<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octo · 事项</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* ===== Octo tokens — from octo设计稿.fig (prototype :root) ===== */
    --ink: 28,28,35;
    --bg: #f5f6f7;
    --panel: #ffffff;
    --border: rgba(28,28,35,.10);
    --border-soft: rgba(28,28,35,.06);
    --text: #1c1c23;
    --text-2: rgba(28,28,35,.66);
    --text-3: rgba(28,28,35,.50);
    --text-4: rgba(28,28,35,.38);
    --text-5: rgba(28,28,35,.28);
    --text-1: rgba(28,28,35,.80);
    --hover: rgba(28,28,35,.055);
    --fill-1: rgba(28,28,35,.025);
    --fill-2: rgba(28,28,35,.045);
    --fill-3: rgba(28,28,35,.06);
    --accent: #0077fa;
    --accent-2: #4e9bff;
    --accent-tint: #ebf5ff;
    --accent-tint-2: #dcecff;
    --accent-border: #bfdcff;
    --progress: #0077fa;
    --progress-bg: #ebf9ff;
    --amber: #ff8800;
    --amber-bg: #fff5eb;
    --amber-border: #ffe1bf;
    --done: #21a953;
    --done-bg: #e9f8ee;
    --done-border: #bfe8cb;
    --gray: rgba(28,28,35,.5);
    --gray-bg: rgba(28,28,35,.05);
    --block: #f54a45;
    --block-bg: #feeceb;
    --block-border: #f8cfcc;
    --danger: #f54a45;
    --tag-doing: #0056a3;
    --tag-review: #985700;
    --tag-done: #1a7a40;
    --tag-block: #ad1f17;
    --tag-todo: rgba(28,28,35,.6);
    --agent: #7f3bf5;
    --agent-tint: #f4eefe;
    --agent-border: #e4d5fb;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --shadow: 0 1px 2px rgba(28,28,35,.05), 0 4px 14px rgba(28,28,35,.04);
    --surface-page: #f5f6f7;
    --surface-work: #ffffff;
    --surface-panel: #fbfbfc;
    --surface-card: #ffffff;
    --surface-popover: #ffffff;
    --surface-hover: rgba(28,28,35,.055);
    --hairline: rgba(28,28,35,.095);
    --hairline-soft: rgba(28,28,35,.055);
    --hairline-strong: rgba(28,28,35,.16);
    --shadow-card: 0 1px 1px rgba(28,28,35,.04), 0 5px 14px rgba(28,28,35,.045);
    --shadow-card-hover: 0 1px 1px rgba(28,28,35,.05), 0 8px 18px rgba(28,28,35,.065);
    --shadow-popover: 0 14px 34px rgba(28,28,35,.14), 0 0 0 1px rgba(28,28,35,.07);
    --shadow-drag: 0 18px 44px rgba(28,28,35,.18), 0 0 0 1px rgba(28,28,35,.10);
    --focus-ring: 0 0 0 3px rgba(10,124,255,.16);
  }
  html, body {
    height: 100%;
    font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--surface-page);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .app { width: 100vw; height: 100vh; height: 100dvh; background: var(--surface-page); overflow: hidden; display: flex; }
  button { font-family: inherit; }

  /* ============ ZONE 1 · icon rail ============ */
  .rail {
    width: 56px; flex: 0 0 56px;
    background: var(--bg);
    border-right: 1px solid rgba(28,28,35,.08);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 0; gap: 8px;
  }
  .rail .avatar-top {
    width: 40px; height: 40px; border-radius: 100px;
    background: linear-gradient(135deg, #4e9bff, #1677ff);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; cursor: pointer; flex: 0 0 auto; position: relative;
  }
  .rail .avatar-top::after {
    content: ""; position: absolute; right: -1px; bottom: -1px;
    width: 9px; height: 9px; border-radius: 50%; background: #41cd59; border: 2px solid var(--bg);
  }
  .rail .avatar-top.off::after { background: #c2c6cf; }
  .rail-btn {
    width: 56px; height: 44px; border-radius: 0; padding: 4px 8px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(28,28,35,.3); cursor: pointer; transition: background .15s, color .15s; flex: 0 0 auto;
  }
  .rail-btn svg { width: 20px; height: 20px; stroke-width: 1.75; }
  .rail-btn:hover { background: var(--fill-2); color: rgba(28,28,35,.6); }
  .rail-btn.active { background: var(--fill-2); color: var(--text); }
  .rail-spacer { flex: 1; }
  body.embed .rail { display: none !important; }

  /* ============ ZONE 2 · module nav ============ */
  .modnav {
    width: 252px; flex: 0 0 252px;
    background: var(--bg);
    border-right: 1px solid rgba(28,28,35,.08);
    display: flex; flex-direction: column;
  }
  .modnav-h { display: flex; align-items: center; gap: 10px; height: 64px; flex: 0 0 64px; padding: 18px 16px 12px; }
  .modnav-h .mh-title { font-size: 20px; line-height: 28px; font-weight: 650; color: var(--text); }
  .modnav-h .mh-ws {
    max-width: 110px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 11px; line-height: 18px; font-weight: 550; color: rgba(28,28,35,.45);
    padding: 0 7px; border-radius: 5px; background: rgba(28,28,35,.06);
  }
  .modnav-h .mh-spacer { flex: 1; }
  .modnav-h .mh-add {
    width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    color: rgba(28,28,35,.4); cursor: pointer; transition: .15s; border: 0; background: transparent;
  }
  .modnav-h .mh-add:hover { background: rgba(28,28,35,.06); color: var(--text); }
  .modnav-h .mh-add svg { width: 18px; height: 18px; }
  .modnav-scroll { flex: 1; overflow-y: auto; padding: 28px 12px 20px; }
  .nav-list { display: flex; flex-direction: column; gap: 8px; }
  body.mailbox-mode .modnav { display: none; }
  body.mailbox-mode .work { min-width: 0; }
  .nav-item {
    position: relative; display: flex; align-items: center; gap: 11px;
    min-height: 40px; height: 40px; padding: 0 12px; border-radius: 10px;
    font-size: 14px; line-height: 22px; font-weight: 500; color: rgba(28,28,35,.6);
    cursor: pointer; transition: background .15s;
  }
  .nav-item:hover { background: var(--fill-2); color: var(--text); }
  .nav-item.active { background: rgba(46,50,56,.09); color: var(--text); }
  .nav-item::before {
    content: ""; position: absolute; left: 0; top: 11px; width: 4px; height: 18px;
    border-radius: 9999px; background: var(--accent); opacity: 0; transition: opacity .15s;
  }
  .nav-item.active::before { opacity: 1; }
  .nav-item .ni-ic { width: 18px; height: 18px; flex: 0 0 18px; display: flex; align-items: center; justify-content: center; color: rgba(28,28,35,.4); }
  .nav-item .ni-ic svg { width: 18px; height: 18px; }
  .nav-item .ni-label { flex: 1; min-width: 0; }
  .nav-item .ni-badge { min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: #ff3b30; color: #fff; font-size: 11px; font-weight: 600; line-height: 18px; text-align: center; }
  .nav-item .ni-badge:empty { display: none; }
  .nav-scrim, .insp-scrim { display: none; }

  /* ============ ZONE 3 · center ============ */
  .work { flex: 1; display: flex; flex-direction: column; background: var(--panel); min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    height: 46px; flex: 0 0 46px; padding: 0 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-3); min-width: 0; }
  .crumb .back {
    width: 26px; height: 26px; border-radius: 7px; margin-right: 2px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2); cursor: pointer; font-size: 15px; transition: .15s; flex: 0 0 auto;
  }
  .crumb .back:hover { background: var(--surface-hover); color: var(--text); }
  .crumb .proj { color: var(--text-2); cursor: pointer; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .crumb .proj:hover { color: var(--text); }
  .crumb .sep { color: var(--text-4); font-size: 12px; }
  .crumb .here { color: var(--text); font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
  .crumb .here .crumb-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumb .cid { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); font-weight: 500; flex: 0 0 auto; }
  .crumb .title-plain { font-size: 14px; font-weight: 700; color: var(--text); }
  .crumb .crumb-link { font-size: 13px; font-weight: 500; color: var(--text-3); text-decoration: none; }
  .crumb .crumb-link:hover { color: var(--text); }
  .crumb .crumb-sep { font-size: 12px; color: var(--text-4); margin: 0 4px; }
  .crumb .crumb-current { font-size: 13px; font-weight: 600; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  .tb-icon {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); cursor: pointer; font-size: 15px; transition: .15s;
  }
  .tb-icon:hover { background: var(--surface-hover); color: var(--text-2); }
  .tb-icon.on { background: var(--accent-tint-2); color: var(--accent); }
  .center-wrap { flex: 1; display: flex; min-height: 0; }
  .center-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .content { flex: 1; overflow-y: auto; min-width: 0; }
  .content-inner { width: 100%; max-width: 940px; margin: 0 auto; padding: 30px clamp(20px, 4vw, 56px) 44px; }
  .content-inner.wide { max-width: 1160px; }
  .content-inner.wide.inbox-page { max-width: 100%; }
  .content::-webkit-scrollbar, .props::-webkit-scrollbar { width: 10px; height: 10px; }
  .content::-webkit-scrollbar-thumb, .props::-webkit-scrollbar-thumb {
    background: rgba(28,28,35,.18); border-radius: 6px; border: 3px solid transparent; background-clip: padding-box;
  }

  /* ============ generic ============ */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    min-height: 20px; padding: 0 8px; border-radius: 9999px;
    font-size: 12px; line-height: 20px; font-weight: 600; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; }
  .pill.progress { background: var(--progress-bg); color: var(--tag-doing); }
  .pill.progress .dot { background: var(--progress); }
  .pill.amber { background: var(--amber-bg); color: var(--tag-review); }
  .pill.amber .dot { background: var(--amber); }
  .pill.done { background: var(--done-bg); color: var(--tag-done); }
  .pill.done .dot { background: var(--done); }
  .pill.backlog { background: rgba(28,28,35,.04); color: var(--text-4); }
  .pill.backlog .dot { background: var(--text-4); }
  .pill.gray { background: var(--gray-bg); color: var(--tag-todo); }
  .pill.gray .dot { background: var(--gray); }
  .pill.block { background: var(--block-bg); color: var(--tag-block); }
  .pill.block .dot { background: var(--block); }
  .pill.cancel { background: rgba(28,28,35,.05); color: var(--text-3); }
  .pill.cancel .dot { background: #c2c6cf; }
  .mav {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; color: #fff; flex: 0 0 20px; text-transform: uppercase;
  }
  .mav-sm { width: 18px; height: 18px; flex: 0 0 18px; font-size: 9.5px; }
  [data-uid] { cursor: pointer; }
  [data-uid]:hover .nm, [data-uid]:hover.uname, .uname[data-uid]:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
  .empty-state { text-align: center; color: var(--text-4); font-size: 14px; padding: 60px 0; }
  .empty-state.actionable {
    width: min(520px, 100%); margin: 26px auto 0; padding: 34px 22px;
    border: 1px dashed var(--border); border-radius: 14px; background: rgba(255,255,255,.72);
  }
  .empty-state .es-t { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
  .empty-state .es-s { font-size: 12.5px; color: var(--text-3); line-height: 1.6; }
  .empty-state .es-action {
    margin-top: 14px; display: inline-flex; align-items: center; justify-content: center;
    min-height: 32px; padding: 0 14px; border: 1px solid var(--border); border-radius: 8px;
    background: #fff; color: var(--text-2); font-size: 12.5px; font-weight: 650; cursor: pointer;
    box-shadow: 0 1px 1px rgba(28,28,35,.04);
  }
  .empty-state .es-action:hover { border-color: var(--hairline-strong); color: var(--text); background: var(--accent-tint); }
  .empty-state .es-action:active { transform: scale(.97); }
  .empty-state .es-action:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .err-state { border: 1px dashed var(--block-border); background: #fffafa; border-radius: 12px; padding: 18px; margin-top: 18px; font-size: 13px; color: var(--text-2); line-height: 1.7; }
  .err-state b { color: var(--tag-block); font-weight: 650; }
  .err-state .retry {
    display: inline-flex; margin-top: 8px; border: 1px solid var(--border); border-radius: 7px;
    background: #fff; padding: 4px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-2); cursor: pointer;
  }
  .err-state .retry:hover { color: var(--text); border-color: rgba(28,28,35,.22); }
  .skel { position: relative; overflow: hidden; background: rgba(28,28,35,.05); border-radius: 8px; }
  .skel::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
    animation: skelmove 1.2s infinite;
  }
  @keyframes skelmove { 100% { transform: translateX(100%); } }
  .sk-rows { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .sk-cols { display: flex; gap: 20px; margin-top: 18px; }
  .sk-cols .skel { flex: 1; }
  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .list-head-actions { margin-left: auto; display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .list-filter-actions { margin-left: 0; }
  .matter-view-switch {
    display: inline-flex; align-items: center; gap: 2px; min-height: 34px; padding: 3px;
    border: 1px solid var(--hairline); border-radius: 10px; background: var(--fill-2);
  }
  .mvs-btn {
    min-width: 66px; min-height: 28px; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 0 10px; border-radius: 7px; color: var(--text-3); text-decoration: none;
    font-size: 12.5px; font-weight: 680; line-height: 18px; white-space: nowrap;
  }
  .mvs-btn:hover { color: var(--text); background: rgba(255,255,255,.62); }
  .mvs-btn.active { background: #fff; color: var(--text); box-shadow: 0 1px 2px rgba(28,28,35,.08); }
  .mvs-btn:focus-visible { outline: none; box-shadow: var(--focus-ring); }
  .list-title { min-width: 0; font-size: 20px; line-height: 26px; font-weight: 600; color: var(--text); }
  .list-sub { font-size: 13px; color: rgba(28,28,35,.4); margin-bottom: 24px; }
  .sub-link { color: rgba(28,28,35,.55); cursor: pointer; border-radius: 4px; }
  .sub-link:hover { color: var(--text); text-decoration: underline; }
  .new-btn {
    display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; white-space: nowrap;
    min-height: 34px; padding: 0 13px; border-radius: 9px;
    border: 1px solid var(--hairline); background: var(--surface-card);
    color: var(--text-2); font-size: 12.5px; font-weight: 680; cursor: pointer;
    transition: background .15s, border-color .15s, box-shadow .15s, transform .1s;
  }
  .new-btn:hover { background: #fff; border-color: var(--hairline-strong); color: var(--text); box-shadow: var(--shadow-card); }
  .new-btn:active { transform: scale(.97); }
  .sec {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; font-weight: 750; color: rgba(28,28,35,.50); letter-spacing: 0; margin-bottom: 9px;
  }
  .sec .sec-l { display: flex; align-items: center; gap: 9px; }
  .sec .sec-count { font-weight: 500; color: var(--text-3); }
  .sec-actions { display: inline-flex; align-items: center; gap: 8px; margin-left: auto; }
  .sec-action {
    min-height: 24px; padding: 0 8px; border: 1px solid var(--border-soft); border-radius: 7px;
    background: #fff; color: var(--text-2); font: inherit; font-size: 11.5px; font-weight: 700;
    letter-spacing: 0; text-transform: none; cursor: pointer;
  }
  .sec-action:hover { background: var(--accent-tint); border-color: var(--accent-border); color: var(--accent); }
  .mode-tag {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: .3px;
    color: var(--text-3); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; cursor: default;
  }
  .detail-block { margin-bottom: 24px; }
  .load-more {
    display: block; width: 100%; margin-top: 10px; padding: 9px 0;
    border: 1px dashed var(--border); border-radius: 9px; background: transparent;
    color: var(--text-3); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .load-more:hover { color: var(--text-2); background: var(--fill-2); }

  /* ============ inbox list ============ */
  .inbox-toolbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; flex-wrap: wrap; }
  .batch-bar {
    position: sticky; top: 0; z-index: 10;
    display: flex; align-items: center; gap: 10px; padding: 8px 14px;
    background: var(--accent-tint); border: 1px solid var(--accent-border); border-radius: 10px;
    margin-bottom: 10px; font-size: 13px; font-weight: 600; color: var(--text);
  }
  .batch-bar .bb-count { color: var(--accent); font-weight: 700; }
  .batch-bar button {
    min-height: 30px; padding: 0 12px; border: 1px solid var(--hairline); border-radius: 7px;
    background: var(--surface-card); font: inherit; font-size: 12.5px; font-weight: 650;
    color: var(--text-2); cursor: pointer; transition: .15s;
  }
  .batch-bar button:hover { background: #fff; border-color: var(--hairline-strong); color: var(--text); }
  .batch-bar .bb-cancel { margin-left: auto; border: 0; background: transparent; color: var(--text-3); }
  .mrow .m-check-zone {
    position: absolute; left: 0; top: 0; bottom: 0; width: 44px;
    display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 2;
  }
  .mrow .m-check {
    width: 18px; height: 18px; border: 2px solid var(--hairline); border-radius: 5px;
    background: #fff; cursor: pointer; opacity: 0; transition: opacity .1s;
    -webkit-appearance: none; appearance: none; position: relative;
  }
  .mrow:hover .m-check, .mrow .m-check:checked, .mlist.has-checked .mrow .m-check { opacity: 1; }
  .mrow .m-check:checked { background: var(--accent); border-color: var(--accent); }
  .mrow .m-check:checked::after {
    content: "✓"; position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 800;
  }
  .mrow.is-checked { background: rgba(0,119,250,.05); }
  .priority-btn {
    width: 24px; height: 24px; flex: 0 0 24px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid transparent; border-radius: 6px; background: transparent;
    color: var(--text-4); font: 800 11px/1 var(--mono); cursor: pointer; transition: .15s;
  }
  .priority-btn:hover, .priority-btn.active { background: #fff; border-color: var(--hairline-strong); color: var(--text); }
  .priority-btn.p1 { color: var(--block); }
  .priority-btn.p2 { color: var(--amber); }
  .priority-btn.p3 { color: var(--accent); }
  .priority-btn.p4 { color: var(--done); }
  .priority-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .priority-menu {
    position: fixed; z-index: 2000; min-width: 200px; padding: 6px;
    background: var(--surface-popover); border: 1px solid var(--hairline); border-radius: 8px;
    box-shadow: 0 14px 36px rgba(28,28,35,.16);
  }
  .priority-menu-title { padding: 7px 9px 6px; color: var(--text-3); font-size: 12px; font-weight: 650; }
  .priority-option {
    width: 100%; min-height: 34px; display: grid; grid-template-columns: 24px minmax(0,1fr) 18px; align-items: center; gap: 8px;
    padding: 0 8px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2);
    font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  }
  .priority-option:hover { background: var(--surface-hover); color: var(--text); }
  .priority-option .po-mark { justify-self: center; font: 800 11px/1 var(--mono); color: var(--text-3); }
  .priority-option.p1 .po-mark { color: var(--block); }
  .priority-option.p2 .po-mark { color: var(--amber); }
  .priority-option.p3 .po-mark { color: var(--accent); }
  .priority-option.p4 .po-mark { color: var(--done); }
  .priority-option .po-check { color: var(--accent); font-size: 13px; font-weight: 800; text-align: center; }
  .inbox-filterbar {

  .dl-time-opt {
    display: block; width: 100%; border: 0; border-radius: 7px; background: transparent; cursor: pointer;
    font-family: var(--mono); font-size: 12.5px; color: var(--text); padding: 7px 10px; text-align: left;
  }
  .dl-time-opt:hover { background: var(--fill-3); }
  .dl-time-opt.sel { background: var(--accent-tint); color: var(--accent); font-weight: 700; }

  /* ============ preference cards ============ */
  .cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .pcard {
    background: var(--surface-card); border: 1px solid var(--hairline-soft); border-radius: 10px;
    padding: 14px 16px; cursor: pointer; transition: border-color .12s, box-shadow .12s;
    display: flex; flex-direction: column; gap: 8px;
  }
  .pcard:hover { border-color: var(--hairline-strong); box-shadow: var(--shadow-card-hover); }
  .pcard-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .pcard-top .pill { height: 20px; font-size: 10.5px; padding: 0 7px; }
  .pcard-scope { font-size: 10.5px; font-weight: 650; color: var(--text-4); background: var(--fill-2); padding: 2px 7px; border-radius: 4px; }
  .pcard-agent { font-size: 11px; color: var(--text-3); display: inline-flex; align-items: center; gap: 3px; }
  .pcard-time { font-size: 10.5px; color: var(--text-4); margin-left: auto; }
  .pcard-content { font-size: 13.5px; font-weight: 600; line-height: 1.55; color: var(--text); overflow-wrap: anywhere; }
  .pcard-evidence { font-size: 12px; color: var(--text-3); line-height: 1.5; font-family: var(--mono); overflow-wrap: anywhere; }
  .pcard-avoid { font-size: 12px; color: var(--amber); line-height: 1.5; font-family: var(--mono); overflow-wrap: anywhere; }
  .pcard-foot { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
  .card-matter-link { font-size: 11.5px; color: var(--accent); text-decoration: none; font-weight: 600; }
  .card-matter-link:hover { text-decoration: underline; }
  .pcard-action {
    min-height: 26px; padding: 0 10px; border: 1px solid var(--hairline); border-radius: 6px;
    background: var(--surface-card); font: inherit; font-size: 11.5px; font-weight: 650;
    color: var(--text-2); cursor: pointer; transition: .12s; margin-left: auto;
  }
  .pcard-action:hover { background: #fff; border-color: var(--hairline-strong); }
  .pcard-auth { color: var(--done); border-color: var(--done-border); }
  .pcard-auth:hover { background: var(--done-bg); }
  .pcard-discard { color: var(--text-3); margin-left: 4px; }
  /* ---- inbox split-pane ---- */
  .inbox-split { display: flex; height: 100%; overflow: hidden; }
  .inbox-left { width: 30%; min-width: 300px; max-width: 440px; flex: 0 0 auto; border-right: 1px solid var(--hairline-soft); display: flex; flex-direction: column; overflow: hidden; transition: width .3s cubic-bezier(.25,.1,.25,1), min-width .3s cubic-bezier(.25,.1,.25,1), max-width .3s cubic-bezier(.25,.1,.25,1), padding .3s cubic-bezier(.25,.1,.25,1), border-width .3s cubic-bezier(.25,.1,.25,1); }
  @media (max-width: 900px) { .inbox-split { flex-direction: column; } .inbox-left { width: 100%; max-width: none; min-width: 0; max-height: 45%; border-right: none; border-bottom: 1px solid var(--hairline-soft); } .inbox-right { min-height: 0; } }
  .inbox-left-head { padding: 8px 12px; height: 46px; box-sizing: border-box; flex: 0 0 auto; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid var(--hairline-soft); position: relative; }
  .inbox-left.collapsed { width: 0 !important; min-width: 0; max-width: 0; padding: 0; border-width: 0; overflow: hidden; }
  .ibx-filter-zone { flex: 1; min-width: 0; position: relative; }
  .ibx-filter-trigger { display: flex; align-items: center; gap: 6px; padding: 5px 10px; border: none; border-radius: 8px; background: transparent; font-size: 13px; font-weight: 500; color: var(--text); cursor: pointer; }
  .ibx-filter-trigger:hover { background: var(--fill-2); }
  .ibx-filter-trigger .ibx-ft-label { max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ibx-filter-trigger svg { width: 16px; height: 16px; color: var(--text-3); flex: 0 0 16px; }
  .ibx-drop { display: none; position: absolute; top: calc(100% + 4px); left: 0; min-width: 160px; z-index: 50; background: var(--surface-card); border: 1px solid var(--hairline-soft); border-radius: 10px; box-shadow: var(--shadow-popover); overflow: hidden; padding: 4px; }
  .ibx-drop.open { display: block; }
  .ibx-drop-item { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 6px; font-size: 13px; color: var(--text-2); cursor: pointer; border: none; background: none; width: 100%; text-align: left; }
  .ibx-drop-item:hover { background: var(--fill-1); color: var(--text); }
  .ibx-drop-item.active { font-weight: 600; color: var(--accent); }
  .ibx-newbtn { width: 30px; height: 30px; flex: 0 0 30px; border: 1px solid var(--border-soft); border-radius: 8px; background: transparent; color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all .15s; }
  .ibx-newbtn:hover { background: var(--fill-2); color: var(--text); border-color: var(--hairline-strong); }
  .ibx-newbtn svg { width: 16px; height: 16px; }
  .ibx-toggle { width: 30px; height: 30px; flex: 0 0 30px; border: none; border-radius: 8px; background: transparent; color: var(--text-3); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; position: relative; z-index: 1; }
  .ibx-toggle:hover { background: var(--fill-2); color: var(--text); }
  .ibx-toggle svg { width: 18px; height: 18px; }
  .ibx-expand-float { position: absolute; top: 10px; left: 10px; z-index: 10; background: var(--surface-card); border: 1px solid var(--hairline-soft); box-shadow: var(--shadow-card); }
  .mailbox-matters-shell { height: 100%; min-height: 0; display: flex; flex-direction: column; overflow: hidden; }
  .mailbox-source-row { height: 48px; flex: 0 0 auto; display: flex; align-items: center; padding: 7px 12px; border-bottom: 1px solid var(--hairline-soft); box-sizing: border-box; background: rgba(255,255,255,.92); }
  .mailbox-matters-shell .inbox-split { flex: 1 1 auto; min-height: 0; }
  .ibx-resize { width: 4px; flex: 0 0 4px; cursor: col-resize; background: transparent; transition: background .15s; position: relative; z-index: 5; }
  .ibx-resize:hover, .ibx-resize:active { background: var(--accent-border); }
  .inbox-left-list { flex: 1; overflow-y: auto; }
  .inbox-right { flex: 1; min-width: 0; overflow: hidden; background: var(--panel); display: flex; flex-direction: column; }
  .inbox-right-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-3); font-size: 14px; }
  .inbox-right .content-inner { max-width: 800px; }
  /* inbox mail-row */
  .mail-row { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; cursor: pointer; border-bottom: 1px solid var(--hairline-soft); transition: background .1s; position: relative; }
  .mail-row:hover { background: var(--fill-1); }
  .mail-row.active { background: var(--accent-tint); }
  .mail-row-st { flex: 0 0 16px; width: 16px; height: 16px; }
  .mail-row-st svg { width: 16px; height: 16px; }
  .mail-row .mav { width: 36px; height: 36px; flex: 0 0 36px; font-size: 14px; border-radius: 10px; }
  .mail-row-body { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .mail-row-top { display: flex; align-items: center; gap: 6px; }
  .mail-row-sender { font-size: 14px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 160px; }
  .mail-row-time { margin-left: auto; font-size: 12px; color: var(--text-3); white-space: nowrap; flex: 0 0 auto; }
  .mail-row-subject { font-size: 13.5px; font-weight: 500; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }
  .mail-row-preview { font-size: 12.5px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; line-height: 1.4; }

  .pref-list { display: flex; flex-direction: column; }
  .pref-row { display: flex; align-items: flex-start; gap: 16px; padding: 14px 0; border-bottom: 1px solid var(--hairline-soft); cursor: pointer; transition: background .1s; }
  .pref-row:hover { background: var(--fill-1); margin: 0 -16px; padding-left: 16px; padding-right: 16px; border-radius: 8px; }
  .pref-main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .pref-rule { font-size: 14px; font-weight: 500; line-height: 1.5; color: var(--text); }
  .pref-evidence { font-size: 12px; color: var(--text-3); line-height: 1.45; }
  .pref-avoid { font-size: 12px; color: var(--amber); line-height: 1.45; }
  .pref-meta { flex: 0 0 auto; display: flex; align-items: center; gap: 8px; }
  .pref-meta .pill { height: 20px; font-size: 10.5px; padding: 0 7px; }
  .pref-scope { font-size: 10.5px; font-weight: 650; color: var(--text-4); background: var(--fill-2); padding: 2px 7px; border-radius: 4px; }
  .pref-src { font-size: 11.5px; color: var(--accent); text-decoration: none; }
  .pref-src:hover { text-decoration: underline; }
  .pref-actions { flex: 0 0 auto; display: flex; gap: 6px; }
  .pref-act { height: 28px; padding: 0 10px; border: 1px solid var(--border-soft); border-radius: 6px; background: transparent; color: var(--text-2); font-size: 12px; cursor: pointer; transition: all .15s; }
  .pref-act:hover { background: var(--fill-2); border-color: var(--hairline-strong); }
  .pref-act-warn { color: var(--text-3); }
  .pref-act-warn:hover { color: #ff3b30; border-color: #ff3b30; background: rgba(255,59,48,.06); }

  /* ============ automation ============ */
  .auto-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); gap: 14px; }
  .auto-card {
    border: 1px solid rgba(28,28,35,.09); border-radius: 10px; background: #fff;
    padding: 14px 16px; cursor: pointer; display: flex; flex-direction: column; gap: 9px;
    box-shadow: var(--shadow-card);
    transition: border-color .15s, box-shadow .15s, transform .15s;
  }
  .auto-card:hover { border-color: rgba(28,28,35,.16); box-shadow: var(--shadow-card-hover); transform: translateY(-1px); }
  .auto-card:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .auto-card.paused { opacity: .62; }
  .auto-head { display: flex; align-items: center; gap: 10px; }
  .ac2-when { font-family: var(--mono); font-size: 13px; font-weight: 700; color: var(--text); white-space: nowrap; flex: 0 0 auto; }
  .ac2-next { font-size: 12px; color: var(--text-3); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auto-name-row { display: flex; align-items: center; gap: 10px; }
  .auto-name { font-size: 15px; line-height: 21px; font-weight: 650; color: var(--text); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auto-exec { display: inline-flex; align-items: center; gap: 6px; min-width: 0; flex: 0 0 auto; }
  .auto-exec .ax-chip {
    display: inline-flex; align-items: center; max-width: 170px; padding: 2px 8px; border-radius: 6px;
    background: var(--accent-tint); color: var(--accent); font-family: var(--mono); font-size: 11.5px; font-weight: 700;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .auto-toggle {
    width: 34px; height: 19px; border-radius: 999px; flex: 0 0 34px;
    background: var(--accent); position: relative; cursor: pointer; border: 0; transition: background .15s;
  }
  .auto-toggle::after {
    content: ""; position: absolute; top: 2px; left: 17px; width: 15px; height: 15px; border-radius: 50%;
    background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.2); transition: left .15s;
  }
  .auto-toggle.off { background: rgba(28,28,35,.2); }
  .auto-toggle.off::after { left: 2px; }
  .auto-toggle.pending { opacity: .5; pointer-events: none; }
  .auto-boxes { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .auto-box { border: 1px solid var(--border-soft); border-radius: 8px; padding: 7px 10px; min-width: 0; background: var(--fill-1); }
  .auto-box .ab-k { font-size: 10.5px; color: var(--text-4); margin-bottom: 2px; }
  .auto-box .ab-v { font-size: 12.5px; color: var(--text); font-weight: 550; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auto-runs { border-top: 1px solid var(--border-soft); padding-top: 8px; display: flex; flex-direction: column; gap: 5px; min-height: 22px; }
  .auto-run-line { display: flex; align-items: center; gap: 7px; font-size: 12px; color: var(--text-3); min-width: 0; }
  .auto-run-line .ar-id { font-family: var(--mono); color: var(--text-2); font-weight: 600; flex: 0 0 auto; }
  .auto-run-line .ar-id:hover { color: var(--accent); text-decoration: underline; }
  .auto-run-line .ar-title { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .auto-run-line .pill { height: 18px; min-height: 18px; font-size: 11px; line-height: 18px; padding: 0 7px; flex: 0 0 auto; }
  .auto-run-line .ar-when { flex: 0 0 auto; font-size: 11.5px; }

  /* ---- 自动化编辑弹窗(双栏) ---- */
  .modal.modal-auto { max-width: 1080px; padding: 0; display: flex; flex-direction: column; max-height: 88vh; overflow: hidden; }
  .am-head { display: flex; align-items: center; justify-content: space-between; padding: 18px 24px 14px; border-bottom: 1px solid var(--border-soft); flex: 0 0 auto; }
  .am-head .modal-title { font-size: 17px; font-weight: 650; }
  .am-body { flex: 1 1 auto; display: flex; min-height: 320px; overflow: hidden; }
  .am-left { flex: 1 1 auto; min-width: 0; padding: 22px 26px; overflow-y: auto; }
  .am-name {
    width: 100%; border: 0; outline: none; background: transparent; color: var(--text);
    font-family: inherit; font-size: 20px; font-weight: 600; padding: 2px 0 12px;
    border-bottom: 1px solid var(--border-soft);
  }
  .am-name::placeholder { color: var(--text-4); font-weight: 500; }
  .am-name:focus { border-bottom-color: var(--accent-border); }
  .am-label { font-size: 12.5px; font-weight: 650; color: var(--text-2); margin: 18px 0 8px; }
  .am-runbook {
    width: 100%; min-height: 300px; resize: vertical; border: 1px solid var(--border); border-radius: 10px;
    background: #fff; color: var(--text); font-family: inherit; font-size: 13.5px; line-height: 1.7;
    padding: 12px 14px; outline: none;
  }
  .am-runbook:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px rgba(0,119,250,.07); }
  .am-right { width: 340px; flex: 0 0 340px; border-left: 1px solid var(--border-soft); background: var(--surface-panel); padding: 18px 20px 22px; overflow-y: auto; }
  .am-right .am-label:first-child { margin-top: 0; }
  .am-ctrl {
    display: flex; align-items: center; gap: 9px; min-height: 42px; padding: 0 12px;
    border: 1px solid var(--border); border-radius: 9px; background: #fff; cursor: pointer; position: relative;
    font-size: 13.5px; color: var(--text);
  }
  .am-ctrl:hover { border-color: rgba(28,28,35,.2); }
  .am-ctrl .mp-chev { position: absolute; right: 11px; top: 50%; transform: translateY(-50%); color: var(--text-3); font-size: 11px; }
  .am-ctrl .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .am-ctrl .ph { color: var(--text-3); }
  .seg-opt {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px;
    border: 1px solid var(--border); border-radius: 10px; background: #fff; cursor: pointer; transition: .15s;
  }
  .seg-opt.sel { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
  .seg-opt .so-radio {
    width: 18px; height: 18px; border-radius: 50%; flex: 0 0 18px; border: 1.5px solid rgba(28,28,35,.25);
    display: inline-flex; align-items: center; justify-content: center; background: #fff;
    color: #fff; font-size: 10px; font-weight: 800;
  }
  .seg-opt.sel .so-radio { background: var(--accent); border-color: var(--accent); }
  .seg-opt .so-t { font-size: 13.5px; font-weight: 650; color: var(--text); }
  .seg-opt .so-s { font-size: 12px; color: var(--text-3); margin-top: 1px; }
  .am-select {
    width: 100%; min-height: 42px; padding: 0 12px; border: 1px solid var(--border); border-radius: 9px;
    background: #fff; color: var(--text); font-family: inherit; font-size: 13.5px; outline: none; cursor: pointer;
  }
  .am-select:focus { border-color: var(--accent-border); }
  .am-quiet { font-size: 11.5px; color: var(--text-3); margin-top: 6px; line-height: 1.6; }
  .am-target { border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 11px 12px; }
  .am-target .matter-input { background: rgba(46,50,56,.05); min-height: 36px; font-size: 13px; }
  .am-target .matter-input + .matter-input { margin-top: 8px; }
  .am-timerow { display: flex; gap: 8px; }
  .am-timerow .am-ctrl { flex: 1 1 auto; }
  .am-timerow .am-select { width: 120px; flex: 0 0 120px; }
  .am-cronline { font-size: 11.5px; color: var(--text-3); margin-top: 8px; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .am-cronline code { font-family: var(--mono); background: var(--fill-2); border-radius: 5px; padding: 1px 6px; color: var(--text-2); }
  .am-advanced { margin-top: 8px; padding-top: 2px; }
  .am-advlink {
    display: inline-flex; align-items: center; gap: 5px; min-height: 24px; padding: 0;
    border: 0; background: transparent; color: var(--text-3); font: inherit; font-size: 11.5px; font-weight: 650;
    cursor: pointer; user-select: none;
  }
  .am-advlink:hover { color: var(--text); }
  .am-advlink:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: 5px; }
  .am-advlink .am-chev { transition: transform .15s; color: var(--text-4); }
  .am-advlink[aria-expanded="true"] .am-chev { transform: rotate(90deg); }
  .am-advhint { margin-top: 2px; color: var(--text-4); font-size: 11.5px; line-height: 1.45; }
  .am-runsbox { border: 1px solid var(--border); border-radius: 10px; background: #fff; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; }
  .am-foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 13px 24px; border-top: 1px solid var(--border-soft); flex: 0 0 auto; background: #fff; }
  .ff-save.blue { background: var(--accent); }
  .ff-save.blue:hover { background: var(--accent-2); opacity: 1; }
  @media (max-width: 860px) {
    .am-body { flex-direction: column; overflow-y: auto; }
    .am-left { overflow: visible; padding: 16px; }
    .am-right { width: 100%; flex: 0 0 auto; border-left: 0; border-top: 1px solid var(--border-soft); overflow: visible; }
    .am-runbook { min-height: 140px; }
    .auto-boxes { grid-template-columns: 1fr; }
  }

  /* ============ matter detail ============ */
  .issue-title { font-size: 23px; font-weight: 650; letter-spacing: 0; line-height: 1.28; margin-bottom: 8px; overflow-wrap: anywhere; }
  .issue-sub { display: flex; align-items: center; gap: 9px; margin-bottom: 18px; flex-wrap: wrap; }
  .brief {
    background: #fff; border: 1px solid rgba(28,28,35,.10); border-radius: 8px;
    padding: 0; overflow: hidden;
    box-shadow: var(--shadow-card);
  }
  .brief-main { padding: 16px 18px 18px; min-width: 0; }
  .wo-label {
    font-size: 11px; line-height: 14px; font-weight: 750; color: rgba(28,28,35,.46);
    letter-spacing: 0; margin-bottom: 8px;
  }
  .brief .free-text { font-size: 14px; line-height: 1.75; color: var(--text); white-space: pre-wrap; overflow-wrap: anywhere; margin-bottom: 10px; }
  .brief .free-text.none { color: var(--text-4); font-size: 13px; }
  .brief-meta { display: grid; gap: 6px; font-size: 12px; color: var(--text-3); margin-top: 12px; }
  .brief-meta .bm { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; padding-top: 6px; border-top: 1px solid rgba(28,28,35,.07); }
  .brief-meta .bm b { color: var(--text-2); font-weight: 600; }
  .brief-meta .bm.overdue b { color: var(--tag-block); }
  .blocker-note, .review-note {
    display: flex; align-items: flex-start; gap: 11px;
    border-radius: 8px; background: #fff; padding: 12px 13px;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.72);
  }
  .blocker-note { border: 1px solid var(--block-border); border-left: 3px solid var(--block); }
  .review-note { border: 1px solid var(--amber-border); border-left: 3px solid var(--amber); }
  .blocker-note .bn-ic, .review-note .rv-ic {
    width: 24px; height: 24px; flex: 0 0 24px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 13px; font-weight: 800;
  }
  .blocker-note .bn-ic { background: var(--block-bg); color: var(--block); }
  .review-note .rv-ic { background: var(--amber-bg); color: var(--amber); }
  .blocker-note .bn-main, .review-note .rv-main { min-width: 0; flex: 1 1 auto; }
  .blocker-note .bn-k, .review-note .rv-k {
    font-size: 10.5px; line-height: 14px; font-weight: 800; letter-spacing: .55px;
    text-transform: uppercase; margin-bottom: 4px;
  }
  .blocker-note .bn-k { color: rgba(173,31,23,.68); }
  .review-note .rv-k { color: rgba(152,87,0,.70); }

  .status-opt .so-name { font-size: 13px; font-weight: 600; color: var(--text); }
  .status-opt .so-sub { font-size: 11px; line-height: 1.35; color: var(--text-3); }
  .props-divider { height: 1px; background: rgba(28,28,35,.08); margin: 10px 0; }
  .prow { display: flex; align-items: center; justify-content: space-between; padding: 4px 0; gap: 12px; }
  .prow .pk { font-size: 12.5px; color: var(--text-2); flex: 0 0 auto; }
  .prow .pv { min-width: 0; flex: 1 1 auto; font-size: 12.5px; color: var(--text); display: flex; align-items: center; gap: 7px; justify-content: flex-end; }
  .pv-none { color: var(--text-4); }
  .att-list { display: flex; flex-direction: column; gap: 6px; max-height: 160px; overflow-y: auto; }
  .att-link { display: flex; align-items: center; gap: 6px; padding: 6px 8px; border-radius: 6px; background: var(--fill-1); text-decoration: none; color: var(--text-1); font-size: 12px; transition: background .15s; }
  .att-link:hover { background: var(--fill-2); }
  .att-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .att-btn { border: none; background: none; cursor: pointer; color: var(--text-3); padding: 4px; border-radius: 4px; display: flex; align-items: center; flex-shrink: 0; }
  .att-btn:hover { color: var(--text-1); background: var(--fill-2); }
  .proj-select {
    width: 100%; font-family: inherit; font-size: 12.5px; color: var(--text);
    border: 1px solid rgba(28,28,35,.11); border-radius: 7px; padding: 7px 10px; background: #fff;
    outline: none; transition: .15s; cursor: pointer;
  }
  .proj-select:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(0,119,250,.12); }
  .assignee-wrap { display: flex; flex-wrap: wrap; gap: 4px; justify-content: flex-end; }
  .htag {
    display: inline-flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 700; letter-spacing: .2px;
    padding: 1px 7px; border-radius: 6px; line-height: 1.5; white-space: nowrap;
  }
  .htag.h2a { background: #e6effd; color: #3c6fc4; }
  .htag.a2a { background: var(--agent-tint); color: var(--agent); }
  .htag.a2h { background: var(--amber-bg); color: var(--amber); }
  .htag.evid { background: var(--done-bg); color: var(--done); }
  .htag.sys { background: rgba(28,28,35,.08); color: rgba(28,28,35,.62); }
  .htag.blk { background: var(--block-bg); color: var(--tag-block); }

  /* ============ modal ============ */
  .modal-scrim {
    position: fixed; inset: 0; z-index: 200; background: rgba(28,28,35,.45);
    display: none; align-items: center; justify-content: center; padding: 24px;
    opacity: 0; transition: opacity .18s ease-out;
  }
  .modal-scrim.open { display: flex; opacity: 1; }
  .modal {
    width: 100%; max-width: 520px; max-height: 88vh; overflow-y: auto;
    background: #fff; border-radius: 12px;
    box-shadow: var(--shadow-popover), 0 18px 48px rgba(28,28,35,.16);
    transform: translateY(10px) scale(.99); transition: transform .18s ease-out;
  }
  .modal-scrim.open .modal { transform: none; }
  .modal-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 18px 22px 8px; }
  .modal-h .modal-title { font-size: 18px; line-height: 26px; font-weight: 600; color: var(--text); }
  .modal-h .modal-sub { font-size: 12px; color: var(--text-3); margin-top: 3px; line-height: 1.5; }
  .modal-x {
    width: 28px; height: 28px; flex: 0 0 28px; border-radius: 6px; cursor: pointer; border: 0; background: transparent;
    display: flex; align-items: center; justify-content: center; color: var(--text-3); font-size: 18px;
  }
  .modal-x:hover { background: var(--fill-3); color: var(--text); }
  .modal-body { padding: 10px 22px 6px; }
  .modal-foot { display: flex; gap: 10px; justify-content: flex-end; align-items: center; padding: 12px 22px 22px; }
  .modal-foot .foot-left { margin-right: auto; }
  .matter-form { display: flex; flex-direction: column; gap: 14px; }
  .matter-field { display: flex; flex-direction: column; gap: 7px; }
  .matter-field label { font-size: 14px; line-height: 20px; font-weight: 600; color: rgba(28,28,35,.76); }
  .matter-field .req { color: #ff3b30; margin-left: 2px; }
  .matter-field .hint { font-size: 11.5px; color: var(--text-3); line-height: 1.5; font-weight: 400; }
  .nm-sep { border: none; border-top: 1px solid var(--border-soft); margin: 2px 0; }
  .nm-fold { margin: 0; }
  .nm-fold summary { font-size: 13px; color: var(--text-2); cursor: pointer; padding: 6px 0; user-select: none; list-style: none; }
  .nm-fold summary::before { content: "▸ "; }
  .nm-fold[open] summary::before { content: "▾ "; }
  .nm-fold summary::-webkit-details-marker { display: none; }
  .nm-fold-hint { font-size: 11.5px; color: var(--text-3); margin-left: 6px; font-weight: 400; }
  .nm-fold > .matter-field { margin-top: 10px; }
  .matter-input, .matter-textarea, .matter-select {
    width: 100%; outline: none; background: rgba(46,50,56,.05); border: 1px solid var(--border-soft); border-radius: 8px;
    color: var(--text); font-family: inherit; font-size: 14px; line-height: 22px;
    transition: border-color .15s, box-shadow .15s, background .15s;
  }
  .matter-input, .matter-select { min-height: 42px; padding: 0 12px; }
  .matter-textarea { min-height: 96px; padding: 12px; resize: vertical; }
  .matter-input:focus, .matter-textarea:focus, .matter-select:focus { border-color: var(--accent-border); box-shadow: 0 0 0 3px rgba(0,119,250,.08); background: #fff; }
  .matter-text-wrap { position: relative; }
  .matter-counter { position: absolute; right: 12px; bottom: 10px; color: rgba(28,28,35,.38); font-size: 12px; line-height: 18px; pointer-events: none; }
  .matter-error { min-height: 18px; color: #ff3b30; font-size: 12px; line-height: 18px; }
  .preset-chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .preset-chip {
    font: inherit; font-size: 11.5px; font-weight: 600; color: var(--text-3);
    background: var(--fill-2); border: 1px solid var(--border-soft); border-radius: 999px;
    padding: 3px 10px; cursor: pointer; transition: .15s;
  }
  .preset-chip:hover { color: var(--accent); background: var(--accent-tint); border-color: var(--accent-border); }
  .ff-cancel, .ff-save, .ff-danger {
    min-width: 64px; min-height: 36px; display: inline-flex; align-items: center; justify-content: center;
    padding: 0 17px; border: 0; border-radius: 999px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .ff-cancel { color: rgba(28,28,35,.68); border: 1px solid rgba(28,28,35,.12); background: #fff; transition: background .15s, transform .1s; }
  .ff-cancel:hover { background: var(--fill-2); }
  .ff-cancel:active { transform: scale(.97); }
  .ff-save { color: #fff; background: #1c1c23; box-shadow: 0 1px 2px rgba(0,0,0,.18), inset 0 1px 0 rgba(255,255,255,.06); }
  .ff-save:hover { opacity: .92; }
  .ff-save:active { transform: scale(.97); }
  .ff-save:disabled, .ff-danger:disabled { opacity: .5; cursor: default; }
  .ff-danger { color: #c2453a; border: 1px solid rgba(194,69,58,.3); background: #fff; transition: background .15s, transform .1s; }
  .ff-danger:hover { background: var(--block-bg); }
  .ff-danger:active { transform: scale(.97); }
  .smart-draft {
    width: 100%; min-height: 172px; max-height: min(36vh, 280px); resize: vertical;
    border: 1px solid var(--border-soft); border-radius: 8px; background: #fff; color: var(--text);
    padding: 10px 11px; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; outline: none;
  }
  .smart-draft:focus { border-color: rgba(0,119,250,.34); box-shadow: 0 0 0 2px rgba(0,119,250,.08); }
  .llm-warn {
    display: flex; gap: 8px; align-items: flex-start;
    border: 1px solid var(--amber-border); background: var(--amber-bg); border-radius: 9px;
    padding: 10px 12px; font-size: 12.5px; color: var(--tag-review); line-height: 1.6;
  }
  .smart-lede { font-size: 13px; color: var(--text-2); line-height: 1.7; }
  .smart-quiet { font-size: 11.5px; color: var(--text-4); line-height: 1.6; margin-top: 8px; }

  /* ============ matter detail · pass2(目标/计划图/产出文件/来源) ============ */
  .src-chip-top {
    display: inline-flex; align-items: center; gap: 6px; max-width: 220px;
    border: 1px solid var(--border); border-radius: 7px; background: var(--panel);
    padding: 3px 10px; font-size: 12px; color: var(--text-2); cursor: pointer; transition: .15s;
  }
  .src-chip-top:hover { background: var(--fill-2); }
  .src-chip-top .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brief .goal-line { font-size: 14px; line-height: 1.7; color: var(--text); font-weight: 700; overflow-wrap: anywhere; margin-bottom: 6px; }
  .brief-rest { font-size: 13.5px; line-height: 1.75; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 10px; }
  .constraint-label { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .3px; margin: 14px 0 6px; }
  .clist { list-style: none; display: grid; gap: 5px; margin: 0; padding: 0; }
  .clist li { display: flex; gap: 8px; font-size: 13px; line-height: 1.6; color: var(--text-2); overflow-wrap: anywhere; }
  .clist li .bullet { color: var(--accent); flex: 0 0 auto; }
  .file-out { display: flex; align-items: center; gap: 10px; border: 1px solid rgba(28,28,35,.10); border-radius: 10px; background: rgba(255,255,255,.8); padding: 10px 12px; }
  .file-out + .file-out { margin-top: 8px; }
  .file-out .fo-ic { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 8px; background: var(--fill-2); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .file-out .fo-main { min-width: 0; flex: 1; }
  .file-out .fo-name { font-family: var(--mono); font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-out .fo-meta { margin-top: 2px; font-size: 11px; color: var(--text-3); }
  .composer-tools { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; padding-bottom: 1px; }
  .composer-icon {
    width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--text-3);
    font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .15s;
  }
  .composer-icon:hover { background: var(--fill-2); color: var(--text); }
  .composer-icon[disabled] { opacity: .4; cursor: not-allowed; }
  .mention-picker {
    display: none; position: absolute; bottom: calc(100% + 6px); left: 0; z-index: 100;
    width: 280px; max-height: 260px; overflow-y: auto; padding: 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow-popover);
  }
  .mention-picker.open { display: block; }
  .mention-picker .mp-search {
    width: 100%; border: 0; border-bottom: 1px solid var(--border-soft); padding: 8px 10px;
    font: inherit; font-size: 12.5px; outline: none; background: transparent;
  }
  .mention-picker .mp-list { max-height: 210px; overflow-y: auto; }
  .mention-picker .mp-item {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px;
    cursor: pointer; transition: background .1s; font-size: 13px;
  }
  .mention-picker .mp-item:hover { background: var(--surface-hover); }
  .mention-picker .mp-item .mp-av {
    width: 24px; height: 24px; border-radius: 50%; flex: 0 0 24px;
    display: flex; align-items: center; justify-content: center;
    font-size: 11px; font-weight: 700; color: #fff;
  }
  .mention-picker .mp-item .mp-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 550; }
  .mention-picker .mp-item .mp-role { font-size: 10.5px; color: var(--text-4); flex: 0 0 auto; }
  .mention-picker .mp-sec {
    font-size: 10.5px; font-weight: 700; color: var(--text-4); padding: 8px 10px 4px;
  }
  .composer-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .so-dot-slot { display: inline-flex; }
  .status-opt.danger { border-top: 1px solid var(--border-soft); margin-top: 4px; padding-top: 9px; }
  .status-opt.danger .so-name { color: #b46a62; }
  .src-send {
    margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--done); background: #fff;
    border: 1px solid var(--done-border); border-radius: 6px; padding: 2px 9px; cursor: pointer; transition: .15s;
  }
  .src-send:hover { background: var(--done-bg); }
  .banner-note { margin-top: 8px; font-size: 11px; color: var(--text-4); line-height: 1.5; }
  .main-trail {
    border-top: 1px solid rgba(28,28,35,.08);
    border-bottom: 1px solid rgba(28,28,35,.08);
    background: #fff;
  }
  .main-trail-entry {
    display: grid; grid-template-columns: 82px minmax(0, 1fr) auto; align-items: center; column-gap: 12px;
    min-height: 38px; border-top: 1px solid rgba(28,28,35,.055); font-size: 12.5px; color: var(--text-2);
  }
  .main-trail-entry:first-child { border-top: 0; }
  .main-trail-line { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .main-trail-line .tn { color: var(--text); font-weight: 650; }
  .main-trail-time { font-family: var(--mono); font-size: 10.5px; color: var(--text-4); white-space: nowrap; }

  /* ===== 计划图(几何即语义,移植自原型 plan-graph) ===== */
  .plan-shell { padding: 10px; border-radius: 10px; background: rgba(28,28,35,.035); }
  .plan-overview {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px;
    padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,.72); margin-bottom: 10px;
  }
  .po-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .po-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--accent); }
  .plan-overview.done .po-dot { background: var(--done); }
  .plan-overview.taste .po-dot { background: var(--amber); }
  .plan-overview.block .po-dot { background: var(--block); }
  .po-eyebrow { margin-bottom: 2px; color: rgba(28,28,35,.44); font-size: 11px; line-height: 14px; font-weight: 650; }
  .po-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(28,28,35,.86); font-size: 13px; font-weight: 650; }
  .po-meter { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .po-num { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .po-bar { width: 110px; height: 4px; border-radius: 999px; background: rgba(28,28,35,.08); overflow: hidden; }
  .po-bar span { display: block; height: 100%; background: var(--done); border-radius: 999px; }
  .plan-graph { position: relative; padding: 6px 2px 10px; overflow-x: auto; cursor: grab; }
  .plan-graph.panning { cursor: grabbing; user-select: none; }
  .pg-edges { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; z-index: 0; overflow: visible; }
  .pg-cols { position: relative; display: flex; align-items: center; gap: 56px; z-index: 1; width: max-content; min-width: 100%; }
  .pg-col { display: flex; flex-flow: column wrap; gap: 10px; max-height: 380px; align-content: flex-start; }
  .pg-node {
    width: 196px; background: var(--panel); border: 1.5px solid var(--border); border-radius: 9px;
    padding: 9px 11px 10px; transition: border-color .15s ease-out, box-shadow .15s ease-out;
  }
  .pg-node[data-open-matter] { cursor: pointer; }
  .pg-node[data-open-matter]:hover { border-color: #c9cdd6; box-shadow: 0 2px 10px rgba(28,28,35,.06); }
  .pg-node[data-open-matter]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pg-node.st-todo { border-style: dashed; }
  .pg-node.st-doing { border-color: var(--accent-border); }
  .pg-node.st-review { border-color: #ecc987; }
  .pg-node.st-block { border-color: #eebcb4; }
  .pg-node.st-done { background: #fafafb; }
  .pg-node.st-done .pg-title { color: var(--text-3); }
  .pg-node.st-cancel { border-style: dashed; opacity: .7; }
  .pg-node.is-join { border-radius: 12px; }
  .pg-node.is-root { width: auto; min-width: 168px; }
  .pg-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .pg-dot { width: 8px; height: 8px; border-radius: 999px; flex: 0 0 8px; }
  .pg-dot.backlog { background: rgba(28,28,35,.28); }
  .pg-dot.todo { background: #c9cdd6; }
  .pg-dot.doing { background: var(--accent); }
  .pg-dot.review { background: var(--amber); }
  .pg-dot.done { background: var(--done); }
  .pg-dot.block { background: var(--block); }
  .pg-dot.cancel { background: #c2c6cf; }
  .pg-id { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .pg-role-tag {
    margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .4px;
    color: var(--text-3); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
  }
  .pg-title {
    font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 7px;
  }
  .pg-asg { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); min-width: 0; cursor: pointer; }
  .pg-asg .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg-asg .mav { width: 18px; height: 18px; flex: 0 0 18px; font-size: 9px; }
  .pg-state { margin-top: 7px; font-size: 11.5px; font-weight: 600; color: var(--text-2); }
  .pg-state.review { color: #b97f1f; }
  .pg-state.block { color: #c2453a; }
  .pg-state.doing { color: var(--accent); }
  .pg-state.done { color: var(--done); }
  .pg-state.todo { color: var(--text-3); }
  .pg-state.cancel { color: var(--text-4); }
  .pg-node.is-role { border-style: dashed; border-color: var(--accent-border); background: rgba(99,102,241,.04); }
  .pg-node.is-role.st-done { border-style: solid; border-color: var(--done); background: rgba(34,197,94,.04); }
  .pg-node.is-role.st-doing { border-style: solid; }
  .pg-node.is-role.st-review { border-style: solid; border-color: #ecc987; }
  @media (max-width: 860px) {
    .pg-edges { display: none; }
    .pg-cols { flex-direction: column; align-items: stretch; gap: 0; width: 100%; }
    .pg-col { flex-direction: row; flex-wrap: wrap; gap: 8px; max-height: none; }
    .pg-col + .pg-col { margin-top: 26px; position: relative; }
    .pg-col + .pg-col::before { content: "↓"; position: absolute; top: -22px; left: 14px; color: var(--text-3); font-size: 13px; }
    .pg-node { width: calc(50% - 4px); }
    .pg-node.is-join, .pg-node.is-root { width: 100%; }
  }

  /* ===== 计划图浮窗(全屏展开) ===== */
  /* ===== 收件箱右键菜单 ===== */
  .ctx-menu {
    position: fixed; z-index: 800; min-width: 160px; padding: 4px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: 0 8px 28px rgba(0,0,0,.12); font-size: 13px;
  }
  .ctx-menu button {
    display: flex; align-items: center; gap: 8px; width: 100%; padding: 7px 10px;
    border: none; background: transparent; border-radius: 7px; cursor: pointer;
    color: var(--text); font-size: 13px; text-align: left;
  }
  .ctx-menu button:hover { background: var(--hover); }
  .ctx-menu button.danger { color: var(--block); }
  .ctx-menu .ctx-sep { height: 1px; background: var(--border); margin: 3px 6px; }

  .plan-float-backdrop {
    position: fixed; inset: 0; z-index: 900; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center;
  }
  .plan-float {
    width: 90vw; max-width: 1200px; max-height: 82vh; background: var(--panel);
    border-radius: 14px; box-shadow: 0 24px 60px rgba(0,0,0,.18); overflow: hidden;
    display: flex; flex-direction: column;
  }
  .plan-float-head {
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px; border-bottom: 1px solid var(--border);
  }
  .plan-float-head .pf-title { font-size: 14px; font-weight: 700; }
  .plan-float-head .pf-close {
    width: 28px; height: 28px; border-radius: 7px; border: none; background: transparent;
    cursor: pointer; font-size: 16px; color: var(--text-3); display: flex; align-items: center; justify-content: center;
  }
  .plan-float-head .pf-close:hover { background: var(--hover); }
  .plan-float-body { flex: 1; overflow: auto; padding: 18px; }
  .plan-float-body .plan-graph { min-height: 200px; }

  /* ============ Agent 名片(modal) ============ */
  .modal.agent-card { max-width: 680px; }
  .agent-card .modal-body { padding-top: 8px; }
  .agent-card .ac-head { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }

  /* ============ 键盘帮助 ============ */

  /* ============ toast ============ */
  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
    max-width: min(560px, calc(100vw - 32px));

    padding: 11px 18px; border-radius: 10px; box-shadow: 0 8px 28px rgba(28,28,35,.3);

    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast .ti { color: var(--accent-2); flex: 0 0 auto; }
  .toast.err .ti { color: #ff8a80; font-weight: 800; }
  .toast .toast-msg { min-width: 0; overflow-wrap: anywhere; }
  .toast .toast-x { margin-left: 4px; padding: 0 6px; border-radius: 6px; cursor: pointer; color: rgba(255,255,255,.75); }
  .toast .toast-x:hover { background: rgba(255,255,255,.18); color: #fff; }

  /* ============ 批注 ============ */

  }
  .im-fab.show { display: inline-flex; }
  .im-fab:hover { background: var(--accent-tint); }

  /* ============ 战绩 popover ============ */
  .agent-pop {
    position: fixed; z-index: 60; display: none; width: 300px; max-width: calc(100vw - 16px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 14px 40px rgba(28,28,35,.18); padding: 12px;
  }
  .agent-pop.show { display: block; }
  .ap-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .ap-head .mav { width: 28px; height: 28px; flex: 0 0 28px; font-size: 12px; }
  .ap-id { flex: 1; min-width: 0; }
  .ap-name { font-size: 13.5px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ap-sub { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ap-x { width: 24px; height: 24px; flex: 0 0 24px; border: 0; background: transparent; border-radius: 6px; color: var(--text-3); font-size: 15px; cursor: pointer; }
  .ap-x:hover { background: var(--fill-3); color: var(--text); }

  .ap-num:last-child { border-right: 0; }
  .ap-num .v { font-size: 16px; font-weight: 780; color: var(--text); font-variant-numeric: tabular-nums; }
  .ap-num .k { margin-top: 3px; font-size: 10.5px; color: var(--text-3); }
  .ap-recent { display: grid; gap: 4px; }
  .ap-rec-row {
    display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 4px 7px;
    border-radius: 8px; cursor: pointer; transition: .15s;
  }
  .ap-rec-row:hover { background: var(--accent-tint); }
  .ap-rec-id { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); flex: 0 0 auto; }

  .ap-rec-when { font-family: var(--mono); font-size: 10px; color: var(--text-4); flex: 0 0 auto; }

  /* ============ connect ============ */
  .connect-scrim {

  /* ============ timeline ============ */
  .tl-shell { display: flex; flex-direction: column; height: 100%; min-height: 0; }
  .tl-head { flex: 0 0 auto; padding: 26px clamp(20px, 4vw, 56px) 0; }
  .tl-body { flex: 1 1 auto; display: flex; min-height: 0; overflow: hidden; }
  .tl-left {
    width: 280px; flex: 0 0 280px; overflow-y: auto; border-right: 1px solid var(--border);
    background: var(--panel); padding: 0;
  }
  .tl-left-head {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: flex-end;
    height: 52px; padding: 0 14px 6px; background: var(--surface-panel);
    border-bottom: 1px solid var(--border); font-size: 11.5px; font-weight: 700; color: var(--text-3);
  }
  .tl-row {
    display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 14px;

    overflow: hidden;

  .tl-row .tl-name {

    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .tl-row .tl-id { font-family: var(--mono); font-size: 10px; color: var(--text-4); flex: 0 0 auto; }
  .tl-row.no-dates .tl-name { color: var(--text-3); }
  .tl-row.hl { background: var(--surface-hover); }
  .tl-row.sel { background: var(--accent-tint); }
  .tl-row[draggable="true"] { cursor: grab; }
  .tl-row.dragging { opacity: .4; }
  .tl-drop-line { height: 2px; background: var(--accent); flex: 0 0 2px; border-radius: 1px; margin: -1px 0; }
  .tl-chart {
    flex: 1 1 auto; min-width: 0; overflow: auto; position: relative; background: var(--panel);
  }
  .tl-chart-inner { position: relative; min-width: 100%; height: 100%; }
  .tl-time-head {
    position: sticky; top: 0; z-index: 4; display: flex; flex-direction: column;
    height: 52px; background: var(--surface-panel); border-bottom: 1px solid var(--border);
  }
  .tl-head-months {
    display: flex; height: 22px; align-items: center; border-bottom: 1px solid var(--border-soft);
  }
  .tl-head-months .tl-mo {
    flex: 0 0 auto; height: 22px; display: flex; align-items: center; padding: 0 10px;
    font-size: 11.5px; font-weight: 750; color: var(--text-3); box-sizing: border-box;
    border-right: 1px solid var(--border-soft); white-space: nowrap; overflow: hidden;
  }
  .tl-head-months .tl-mo.current { color: var(--accent); }
  .tl-head-days {
    display: flex; height: 30px; align-items: flex-end; padding-bottom: 4px; position: relative;
  }
  .tl-head-days .tl-day {
    position: absolute; bottom: 4px;
    font-size: 10px; font-weight: 600; color: var(--text-4);
    transform: translateX(-50%); white-space: nowrap;
  }
  .tl-head-days .tl-day.today {
    color: var(--accent); font-weight: 750;
    background: var(--accent-tint); padding: 1px 5px; border-radius: 4px;
  }
  .tl-vline {
    position: absolute; top: 0; bottom: 0; width: 1px;
    background: var(--border-soft); pointer-events: none; z-index: 0;
  }
  .tl-grid { position: relative; }
  .tl-grid-row {
    position: relative; height: 40px; border-bottom: 1px solid var(--border-soft);
  }
  .tl-grid-row:hover { background: rgba(28,28,35,.018); }
  .tl-grid-row.hl { background: rgba(28,28,35,.024); }
  .tl-bar {
    position: absolute; top: 8px; height: 24px; border-radius: 6px;
    min-width: 8px; cursor: pointer; transition: box-shadow .12s, transform .12s;
    display: flex; align-items: center; padding: 0 8px; overflow: hidden;
    box-shadow: 0 1px 2px rgba(0,0,0,.10);
  }
  .tl-bar::after {
    content: ""; position: absolute; inset: 0; border-radius: 6px;
    background: linear-gradient(180deg, rgba(255,255,255,.18) 0%, rgba(255,255,255,0) 50%);
    pointer-events: none;
  }
  .tl-bar:hover { box-shadow: var(--shadow-card-hover); transform: translateY(-1px); z-index: 3; }
  .tl-bar .tl-bar-label {
    font-size: 11px; font-weight: 650; color: #fff; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 2px rgba(0,0,0,.22);
    position: relative; z-index: 1;
  }
  .tl-bar.st-backlog { background: rgba(28,28,35,.18); }
  .tl-bar.st-open { background: rgba(28,28,35,.36); }
  .tl-bar.st-in_progress { background: var(--accent); }
  .tl-bar.st-review { background: var(--amber); }
  .tl-bar.st-done { background: var(--done); }
  .tl-bar.st-blocked { background: var(--block); }
  .tl-bar.st-cancelled { background: rgba(28,28,35,.22); }
  .tl-bar .tl-drag-r {
    position: absolute; right: -3px; top: 0; bottom: 0; width: 8px;
    cursor: col-resize; z-index: 5; border-radius: 0 6px 6px 0;
  }
  .tl-bar .tl-drag-r:hover, .tl-bar .tl-drag-r.active {
    background: rgba(255,255,255,.25);
  }
  .tl-bar.dragging { opacity: .85; transition: none; }
  .tl-drag-tip {
    position: fixed; z-index: 999; pointer-events: none;
    padding: 3px 8px; border-radius: 5px; font-size: 11px; font-weight: 700;
    background: var(--text); color: #fff; white-space: nowrap;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .tl-dot-marker {
    position: absolute; top: 14px; width: 12px; height: 12px; border-radius: 50%;
    border: 2.5px solid var(--panel); cursor: pointer; transform: translateX(-6px);
    transition: box-shadow .15s, transform .15s;
    box-shadow: 0 1px 3px rgba(28,28,35,.12);
  }
  .tl-dot-marker:hover { box-shadow: 0 0 0 4px rgba(28,28,35,.08); transform: translateX(-6px) scale(1.15); z-index: 3; }
  .tl-today {
    position: absolute; top: 0; bottom: 0; width: 1.5px; background: var(--accent);
    z-index: 1; pointer-events: none; opacity: .35;
  }
  .tl-today-bg {
    position: absolute; top: 0; bottom: 0; width: 20px; transform: translateX(-9px);
    background: rgba(0,119,250,.025); z-index: 0; pointer-events: none;
  }
  .tl-zoom-wrap { position: relative; display: inline-flex; }
  .tl-zoom-trigger {
    display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 13px;
    border: 1px solid var(--hairline); border-radius: 9px; background: var(--surface-card);

    transition: background .15s, border-color .15s, box-shadow .15s;

  .tl-zoom-opt {
    display: flex; align-items: center; gap: 8px; padding: 7px 10px; border-radius: 7px;

  .tl-zoom-opt:hover { background: var(--surface-hover); }
  .tl-zoom-opt.active { background: var(--accent-tint); color: var(--accent); }
  .tl-zoom-opt .zo-check { width: 14px; text-align: center; font-size: 12px; font-weight: 700; color: var(--accent); }
  .tl-empty {
    display: flex; align-items: center; justify-content: center; height: 100%;
    color: var(--text-4); font-size: 13px;
  }
  @media (max-width: 860px) {

    .tl-row .tl-id { display: none; }
  }
  @media (max-width: 700px) {

  }
