/* 经过条目的人话动词标签(交出去/往下派/交回来了/打回重做/圈一笔/完成/卡住了/取消/开始汇总/已改派/偏好沉淀) */
function actTagWord(a){
  var d = a.detail || {};
  switch (a.action){
    case "created": return "交出去";
    case "child_created": return "往下派";
    case "feedback_added": return "圈一笔";
    case "join_started": return "开始汇总";
    case "reassigned": return "已改派";
    case "agent_task_completed": return "交回来了";
    case "agent_task_failed": return "卡住了";
    case "agent_progress": return "有进展";
    case "status_changed":
      if (d.to === "review") return "交回来了";
      if (d.to === "in_progress" && d.from === "review") return "打回重做";
      if (d.to === "done") return "完成";
      if (d.to === "blocked") return "卡住了";
      if (d.to === "cancelled") return "取消";
      if (d.to === "in_progress") return "交出去";
      return "更新";
  }
  if (String(a.action).indexOf("summary") >= 0) return "偏好沉淀";
  return "更新";
}
function actTagCls(a){
  var d = a.detail || {};
  if (a.action === "status_changed"){
    if (d.to === "done") return "evid";
    if (d.to === "blocked") return "blk";
    if (d.to === "review" || d.from === "review") return "a2h";
    return "h2a";
  }
  if (a.action === "feedback_added") return "a2h";
  if (a.action.indexOf("agent_") === 0) return "a2a";
  if (String(a.action).indexOf("summary") >= 0) return "evid";
  if (a.action === "created" || a.action === "child_created" || a.action === "join_started"
    || a.action === "assignee_added" || a.action === "reassigned") return "h2a";
  return "sys";
}

function doStatusChange(target){
  var m = cur.m;
  if (!target || target === m.status) return;
  var proceed = function(reason){
    var field = $("#statusField");
    if (field) field.classList.add("pending");
    var body = { status: target, expected_version: m.version };
    if (reason) body.reason = reason;
    var wantSummary = target === "done" && isMe(m.creator_id);
    api("/matters/" + m.id + "/status", { method: "PUT", body: body }).then(function(){
      toast("改到「" + stName(target) + "」了");
      return render().then(function(){
        if (wantSummary) openSummaryFlow(m.id);
      });
    }).catch(function(e){
      if (e.status === 409){
        toast("被人改过了,已刷新", { err: true, title: e.code || "" });
        render();
      } else {
        errToast(e);
        if (field) field.classList.remove("pending");
      }
    });
  };
  if (target === "blocked"){
    askReason().then(function(reason){
      if (reason === null) return;
      proceed(reason);
    });
  } else {
    proceed("");
  }
}

      + '<button class="ff-save" id="reasonOk" type="button">就是它</button></div>';
    openModal(function(){ resolve(null); });
    var done = function(v){
      modalCloseCb = null;
      closeModal();
      resolve(v);

function summaryRow(json){

function draftCount(text){
  return String(text || "").split(/\n/).filter(function(l){ return /^\s*[-•*]/.test(l); }).length;

function prefHeadHTML(sub){
  return '<div class="modal-h"><div><div class="modal-title">AI 提炼 preference.md</div>'

function summaryLeaderName(matterId){
  var m = (cur && cur.id === matterId) ? cur.m : null;

function openSummaryFlow(matterId){
  var mo = $("#modal");
  mo.className = "modal";
  var who = summaryLeaderName(matterId);
  mo.innerHTML = prefHeadHTML(who ? who + " · 提炼中…" : "提炼中…")
    + '<div class="modal-body"><div class="ap-loading">把这单里的验收、圈点和反馈交给 AI 提炼…</div></div>'
    + '<div class="modal-foot"><button class="ff-cancel" id="smClose" type="button">关闭</button></div>';
  openModal();
  $("#mx").onclick = closeModal;
  $("#smClose").onclick = closeModal;
  var fail = function(e){
    if (!$("#modalScrim").classList.contains("open")) return;
    var inner;
    if (e && (e.status === 503 || e.code === "LLM_NOT_CONFIGURED")){
      // 诚实呈现:LLM 没配就是提炼不了,不给手写假草稿的旁路
      inner = '<div class="llm-warn"><span>⚠</span><span>LLM 未配置(LLM_API_KEY 为空),无法自动提炼</span></div>';
    } else {
      inner = '<div class="matter-error" style="min-height:0">' + esc((e && e.message) || "提炼失败") + "</div>";
    }
    mo.innerHTML = prefHeadHTML(who || "") + '<div class="modal-body">' + inner + "</div>"
      + '<div class="modal-foot"><button class="ff-cancel" id="smClose" type="button">关闭</button></div>';
    $("#mx").onclick = closeModal;
    $("#smClose").onclick = closeModal;
  };
  // 先看有没有已有记录:草稿直接进编辑;已授权给只读视图;否则才请求生成
  settle(api("/matters/" + matterId + "/summary")).then(function(got){
    if (!$("#modalScrim").classList.contains("open")) return;
    var row = got.ok ? summaryRow(got.v) : null;
    if (row && row.status === "draft"){ summaryEditStep(matterId, row); return; }
    if (row && row.status === "authorized"){ summaryWrittenView(matterId, row); return; }
    api("/matters/" + matterId + "/summary", { method: "POST" }).then(function(json){
      if (!$("#modalScrim").classList.contains("open")) return;
      var fresh = summaryRow(json);
      if (!fresh){ fail(apiError(0, "", "服务端没有返回草稿")); return; }
      summaryEditStep(matterId, fresh);
    }).catch(fail);
  });
}

function mpChipHTML(uid){

    + '<button class="mp-x" type="button" data-rm="' + esc(uid) + '" aria-label="移除 ' + esc(uname(uid)) + '">×</button></span>';

function bindMemberPicker(box, state, opts){
  opts = opts || {};
  var paint = function(){
    box.innerHTML = (state.sel.length ? state.sel.map(mpChipHTML).join("") : '<span class="mp-ph">' + esc(opts.ph || "选人") + "</span>")
      + '<span class="mp-chev">▾</span>';
    $$("[data-rm]", box).forEach(function(b){
      b.addEventListener("click", function(e){
        e.stopPropagation();
        state.sel = state.sel.filter(function(u){ return u !== b.getAttribute("data-rm"); });
        paint();
        if (opts.onChange) opts.onChange();
      });
    });
  };
  paint();
  box.addEventListener("click", function(e){
    if (e.target instanceof Element && e.target.closest("[data-rm]")) return;
    e.stopPropagation();
    var list = members.list.filter(function(it){ return it && it.uid && (!opts.botsOnly || it.robot); });
    var html = list.length ? list.map(function(it){
      var sel = state.sel.indexOf(it.uid) >= 0;
      return '<div class="fm-item' + (sel ? " sel" : "") + '" data-val="' + esc(it.uid) + '">' + av(it.uid)
        + '<span class="nm">' + esc(it.name || it.uid) + "</span>" + (it.robot ? '<span class="ai-tag">AI</span>' : "")
        + '<span class="fm-check">' + (sel ? "✓" : "") + "</span></div>";
    }).join("") : '<div class="fm-empty">' + (opts.botsOnly ? "这个空间里没有 bot 成员" : "成员名录还没拿到") + "</div>";
    openFloatMenu(box, html, {
      sticky: !opts.single,
      onPick: function(v, el){
        if (opts.single){
          state.sel = [v];
          paint();
          if (opts.onChange) opts.onChange();
          return false;
        }
        var i = state.sel.indexOf(v);
        if (i >= 0) state.sel.splice(i, 1); else state.sel.push(v);
        el.classList.toggle("sel", i < 0);
        var ck = $(".fm-check", el);
        if (ck) ck.textContent = i < 0 ? "✓" : "";
        paint();
        if (opts.onChange) opts.onChange();
        return true; // 多选保持打开
      }
    });
  });
  return { paint: paint };
}

/* ================= 截止日期选择器(日历 + 15 分钟刻度) ================= */
var dlState = null; // { anchor, view {y,m}, sel {y,m,d}|null, time, onChange }
function closeDlPop(){
  var pop = $("#dlPop");
  if (!pop || !pop.classList.contains("show")) return;
  pop.classList.remove("show");
  dlState = null;
}
function openDlPop(anchor, init, onChange){
  var now = new Date();
  dlState = {
    anchor: anchor,
    view: init.sel ? { y: init.sel.y, m: init.sel.m } : { y: now.getFullYear(), m: now.getMonth() },
    sel: init.sel ? { y: init.sel.y, m: init.sel.m, d: init.sel.d } : null,
    time: init.time || "19:00",
    onChange: onChange
  };
  paintDlPop();
}
function paintDlPop(){
  if (!dlState) return;
  var pop = $("#dlPop");
  var v = dlState.view;
  var now = new Date();
  var start = new Date(v.y, v.m, 1).getDay();
  var head = WDCN.map(function(w){ return '<span class="cal-wd">' + w + "</span>"; }).join("");
  var cells = "";
  for (var i = 0; i < 42; i++){
    var dt = new Date(v.y, v.m, 1 - start + i);
    var dim = dt.getMonth() !== v.m;
    var today = dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth() && dt.getDate() === now.getDate();
    var sel = dlState.sel && dt.getFullYear() === dlState.sel.y && dt.getMonth() === dlState.sel.m && dt.getDate() === dlState.sel.d;
    cells += '<button type="button" class="cal-day' + (dim ? " dim" : "") + (today ? " today" : "") + (sel ? " sel" : "")
      + '" data-day="' + dt.getFullYear() + "," + dt.getMonth() + "," + dt.getDate() + '">' + dt.getDate() + "</button>";
  }
  var times = "";
  for (var h = 0; h < 24; h++){
    for (var q = 0; q < 4; q++){
      var t = pad2(h) + ":" + pad2(q * 15);
      times += '<button type="button" class="dl-time-opt' + (t === dlState.time ? " sel" : "") + '" data-time="' + t + '">' + t + "</button>";
    }
  }
  pop.innerHTML = '<div class="cal">'
    + '<div class="cal-head"><button class="cal-nav" type="button" data-cal-nav="-1" aria-label="上个月">‹</button>'
    + '<span class="cal-title">' + v.y + "年" + (v.m + 1) + "月</span>"
    + '<button class="cal-nav" type="button" data-cal-nav="1" aria-label="下个月">›</button></div>'
    + '<div class="cal-grid">' + head + cells + "</div></div>"
    + '<div class="dl-times">' + times + "</div>";
  pop.classList.add("show");
  placePop(pop, dlState.anchor.getBoundingClientRect());
  var selTime = $(".dl-time-opt.sel", pop);
  if (selTime) selTime.scrollIntoView({ block: "center" });
  $$("[data-cal-nav]", pop).forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      if (!dlState) return;
      var m2 = dlState.view.m + (+b.getAttribute("data-cal-nav"));
      dlState.view = { y: dlState.view.y + Math.floor(m2 / 12), m: ((m2 % 12) + 12) % 12 };
      paintDlPop();
    });
  });
  var emit = function(){
    if (!dlState) return;
    var cb = dlState.onChange;
    var out = { sel: dlState.sel, time: dlState.time };
    closeDlPop();
    if (cb) cb(out);
  };
  $$("[data-day]", pop).forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      if (!dlState) return;
      var p = b.getAttribute("data-day").split(",");
      dlState.sel = { y: +p[0], m: +p[1], d: +p[2] };
      emit(); // 时间有默认值,点完日期直接生效;要改时间再点开
    });
  });
  $$("[data-time]", pop).forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      if (!dlState) return;
      dlState.time = b.getAttribute("data-time");
      if (dlState.sel) emit();
      else paintDlPop(); // 还没选日期:记下时间,等选日期
    });
  });
}

  });
  var syncDl = function(){
    var box = $("#nmDl");

      box.innerHTML = '<span class="dl-date">' + st.dl.sel.y + "-" + pad2(st.dl.sel.m + 1) + "-" + pad2(st.dl.sel.d)
        + '</span><span class="dl-time">' + esc(st.dl.time) + '</span><span class="mp-chev">▾</span>';

      box.innerHTML = '<span class="dl-ph">选日期和时间</span><span class="mp-chev">▾</span>';

  };

  setTimeout(function(){ var f = $("#nmProj"); if (f) f.focus(); }, 50);
  $("#nmOk").onclick = function(){
    var title = $("#nmTitle").value.trim();
    var goalV = goal.value.trim();
    var pj = $("#nmProj").value;
    var firstBad = null;
    var mark = function(id, bad){
      var f = $(id);
      f.classList.toggle("invalid", bad);
      if (bad && !firstBad) firstBad = f;
      return bad;
    };
    var anyBad = false;
    anyBad = mark("#fProj", !pj) || anyBad;
    anyBad = mark("#fTitle", !title) || anyBad;
    anyBad = mark("#fGoal", !goalV) || anyBad;
    anyBad = mark("#fDl", !st.dl.sel) || anyBad;
    if (anyBad){
      if (firstBad){
        var inp = $("input,textarea,select,[tabindex]", firstBad);
        if (inp) inp.focus();
      }
      return;
    }
    var hm = st.dl.time.split(":");
    var dlDate = new Date(st.dl.sel.y, st.dl.sel.m, st.dl.sel.d, +hm[0], +hm[1], 0, 0);
    var body = {
      title: title,
      description: goalV,
      project_id: pj,
      deadline: dlDate.toISOString()
    };
    var cons = $("#nmCons").value.trim();
    if (cons) body.brief_constraints = cons;
    var spec = $("#nmSpec").value.trim();
    if (spec) body.brief_output_spec = spec;
    if (st.sel.length){
      body.leader_uid = st.sel[0];
      if (st.sel.length > 1) body.assignee_ids = st.sel.slice(1);
    }
    var md = $("#nmMode").value;
    if (md) body.mode = md;
    var btn = $("#nmOk");
    btn.disabled = true; btn.textContent = "创建中…";
    api("/matters", { method: "POST", body: body }).then(function(detail){
      closeModal();
      cache.projCounts = {}; // 项目卡片上的计数变了
      var nm = normMatter(detail);
      toast("立好了 · " + (nm ? seqLabel(nm) : ""));
      if (nm && nm.id) location.hash = "#/matter/" + nm.id;
      else render();
    }).catch(function(e){
      btn.disabled = false; btn.textContent = "确定";
      $("#nmErr").textContent = e.message || "创建失败";
    });
  };
}

        + '<span class="ar-t" title="' + esc(it.title || "") + '">' + esc(it.title || "") + "</span>"
        + (it.done_at ? '<span class="ar-when">' + esc(fmtShortDate(it.done_at)) + "</span>" : "")
        + "</div>";
    };
    var html = '<div class="ac-facts">'
      + '<div class="ac-fact"><div class="v">' + curList.length + '</div><div class="k">当前事项</div></div>'
      + '<div class="ac-fact"><div class="v">' + (s.done || 0) + '</div><div class="k">已验证交回</div></div>'
      + '<div class="ac-fact"><div class="v">' + (s.in_review || 0) + '</div><div class="k">待确认</div></div>'
      + "</div>"
      + '<div class="ac-sec"><div class="ac-sec-title"><span>当前事项</span>' + (curList.length ? "<span>" + curList.length + " 个活跃</span>" : "") + "</div>"
      + (curList.length ? acRowsHTML(curList, rowM) : '<div class="ac-empty">手上没有进行中的事项</div>') + "</div>"
      + '<div class="ac-sec"><div class="ac-sec-title"><span>已验证记录</span>' + (s.done ? "<span>" + s.done + " 件</span>" : "") + "</div>"
      + (recent.length ? acRowsHTML(recent.slice(0, 5), rowM) : '<div class="ac-empty">还没有验证过的交回</div>') + "</div>";
    if (bot){
      html += '<div class="ac-sec"><div class="ac-sec-title"><span>preference 文件</span></div>'
        + (prefs.length
          ? acRowsHTML(prefs, function(p){
              return '<div class="ac-row" data-open-matter="' + esc(p.matter_id) + '" role="link" tabindex="0">'
                + '<span class="ar-t" style="font-family:var(--mono);font-size:11.5px">' + esc((p.scope || "综合") + ".preference.md") + "</span>"

                + "</div>";

        + "</div>";
      // 声明半(Agent 文件/读写范围/权限/能力边界/当前接入)没有数据来源 → 统一一块「未上报」,不放假值
      html += '<div class="ac-unreported">声明信息未上报 — 接入 AgentCard 平台身份层后点亮(Agent 文件 / 读写范围 / 权限 / 能力边界 / 当前接入)</div>';
    }
    var btns = [];
    if (onDetail) btns.push('<button class="ac-btn primary" id="acMention" type="button">@ 到当前事项</button>');

  api("/agents/stats", { params: { uids: uidStr } }).then(function(json){

  });

function placePop(pop, r){
  var w = pop.offsetWidth || 300;
  var h = pop.offsetHeight || 160;
  var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  var top = r.bottom + 6;
  if (top + h > window.innerHeight - 8) top = Math.max(8, r.top - h - 6);
  pop.style.left = left + "px";
  pop.style.top = top + "px";
}

/* ================= 圈一笔 ================= */
var annotSel = null;
var annotSnap = null;
var annotFabRaf = 0;
function positionAnnotFab(){
  var fab = $("#annotFab");
  var box = $("#annotBox");
  if (box.classList.contains("show")) return;
  var sel = window.getSelection();
  var txt = sel ? String(sel).trim() : "";
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed || txt.length < 2){
    fab.classList.remove("show"); annotSel = null; return;
  }
  var an = sel.anchorNode, fn = sel.focusNode;
  var ae = an && (an.nodeType === 1 ? an : an.parentElement);
  var fe = fn && (fn.nodeType === 1 ? fn : fn.parentElement);
  var card = ae && ae.closest ? ae.closest(".report-body[data-entry-id]") : null;
  if (!card || !fe || !card.contains(fe)){
    fab.classList.remove("show"); annotSel = null; return;
  }
  var r = sel.getRangeAt(0).getBoundingClientRect();
  if (!r || (!r.width && !r.height)){ fab.classList.remove("show"); annotSel = null; return; }
  annotSel = { snippet: txt.slice(0, 200), entryId: card.getAttribute("data-entry-id") };
  fab.style.left = Math.max(8, Math.min(r.left + r.width / 2 - 40, window.innerWidth - 110)) + "px";
  fab.style.top = (r.top - 40 < 54 ? r.bottom + 8 : r.top - 40) + "px";
  fab.classList.add("show");
}
function hideAnnotBox(){
  $("#annotBox").classList.remove("show");
  $("#annotBox").classList.remove("docked");
}
function hideAnnotAll(){
  $("#annotFab").classList.remove("show");
  hideAnnotBox();
  annotSel = null;
}
function openAnnotBox(){
  var snap = annotSnap || annotSel;
  annotSnap = null;
  if (!snap || !cur) return;
  var fab = $("#annotFab");
  var box = $("#annotBox");
  fab.classList.remove("show");
  $("#annotQuote").textContent = "“" + snap.snippet + "”";
  $("#annotInput").value = "";
  box.setAttribute("data-entry", snap.entryId);
  box.setAttribute("data-snippet", snap.snippet);
  box.classList.add("show");
  if (window.matchMedia("(max-width: 480px)").matches){
    box.classList.add("docked");
    box.style.top = "";
    box.style.left = "";
  } else {
    var fr = fab.getBoundingClientRect();
    var top = parseFloat(fab.style.top) || fr.top || 100;
    var left = parseFloat(fab.style.left) || fr.left || 100;
    box.style.top = Math.min(top + 4, window.innerHeight - 230) + "px";
    box.style.left = Math.max(8, Math.min(left, window.innerWidth - 376)) + "px";
  }
  setTimeout(function(){ $("#annotInput").focus(); }, 30);
}
function sendAnnotation(){
  var box = $("#annotBox");
  var input = $("#annotInput");
  var content = input.value.trim();
  if (!content){ toast("写一句怎么改,再圈上", { icon: "✏️" }); input.focus(); return; }
  if (!cur) return;
  var entryId = box.getAttribute("data-entry");
  var snippet = box.getAttribute("data-snippet") || "";

  btn.disabled = true;

  api("/matters/" + cur.id + "/feedback", { method: "POST", body: body }).then(function(resp){
    hideAnnotAll();
    var flipped = resp && resp.matter_status === "in_progress";
    toast(flipped ? "圈上了 — 已替你打回去重做" : "圈上了", { icon: "✏️" });
    render();
  }).catch(function(e){
    errToast(e);
  }).then(function(){ btn.disabled = false; });
}

/* ================= global wiring ================= */
function bindGlobal(){
  // data-uid → Agent 名片;capture 阻断行/卡片自身跳转
  document.addEventListener("click", function(e){
    var t = e.target instanceof Element ? e.target : null;
    if (!t) return;
    var chip = t.closest("[data-uid]");
    if (chip && !chip.closest("#agentPop")){
      e.preventDefault();
      e.stopPropagation();
      openAgentCard(chip.getAttribute("data-uid"));
      return;
    }
  }, true);
  // 点外面收起 popover / 状态菜单 / 浮层菜单 / 日历
  document.addEventListener("click", function(e){
    var t = e.target instanceof Element ? e.target : null;
    if (!t) return;
    if (!t.closest("#agentPop") && !t.closest("[data-uid]")) closeAgentPop();
    if (!t.closest("#statusField")) $$(".status-field.open").forEach(function(f){ f.classList.remove("open"); });
  });
  document.addEventListener("pointerdown", function(e){
    var t = e.target instanceof Element ? e.target : null;
    if (!t) return;
    if (fmState && !t.closest("#floatMenu") && !(fmState.anchor && fmState.anchor.contains(t))) closeFloatMenu();
    if (dlState && !t.closest("#dlPop") && !(dlState.anchor && dlState.anchor.contains(t))) closeDlPop();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (fmState || dlState){ closeFloatMenu(); closeDlPop(); return; } // 先收浮层,再退弹窗
      closeAgentPop();
      hideAnnotAll();
      closeModal();
      $$(".status-field.open").forEach(function(f){ f.classList.remove("open"); });
    }
  });
  // 内容区滚动时,浮层跟着锚点挪;锚点没了才收起(浮层内部滚动不受影响)
  document.addEventListener("scroll", function(e){
    var t = e.target;
    if (fmState && !(t instanceof Element && t.closest("#floatMenu"))){
      if (fmState.anchor && fmState.anchor.isConnected) placePop($("#floatMenu"), fmState.anchor.getBoundingClientRect());
      else closeFloatMenu();
    }
    if (dlState && !(t instanceof Element && t.closest("#dlPop"))){
      if (dlState.anchor && dlState.anchor.isConnected) placePop($("#dlPop"), dlState.anchor.getBoundingClientRect());
      else closeDlPop();
    }
  }, true);
  window.addEventListener("resize", function(){ closeFloatMenu(); closeDlPop(); drawPlanEdges(); });
  // 计划图画布:按住空白处横向拖动平移;节点点击不受影响
  document.addEventListener("pointerdown", function(e){
    var t = e.target instanceof Element ? e.target : null;
    var g = t ? t.closest(".plan-graph") : null;
    if (!g || (t && t.closest(".pg-node"))) return;
    var sx = e.clientX, sl = g.scrollLeft;
    g.classList.add("panning");
    var move = function(ev){ g.scrollLeft = sl - (ev.clientX - sx); };
    var up = function(){
      g.classList.remove("panning");
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
  // j / k 在列表与看板里移动;Enter 打开
  document.addEventListener("keydown", function(e){
    if (e.key !== "j" && e.key !== "k") return;
    var a = document.activeElement;
    if (a && ["INPUT", "TEXTAREA", "SELECT"].indexOf(a.tagName) >= 0) return;
    var rows = $$('.mrow[tabindex="0"], .bcard[tabindex="0"]');
    if (!rows.length) return;
    var i = rows.indexOf(a);
    var next = e.key === "j" ? rows[Math.min(rows.length - 1, i + 1)] : rows[Math.max(0, i - 1)];
    if (next){ e.preventDefault(); next.focus(); next.scrollIntoView({ block: "nearest" }); }
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = e.target instanceof Element ? e.target.closest('[tabindex="0"]') : null;
    if (!t || ["INPUT", "TEXTAREA", "SELECT", "BUTTON", "A"].indexOf(t.tagName) >= 0) return;
    e.preventDefault();
    t.click();
  });
  // 圈一笔
  document.addEventListener("selectionchange", function(){
    if (annotFabRaf) cancelAnimationFrame(annotFabRaf);
    annotFabRaf = requestAnimationFrame(positionAnnotFab);
  });
  var fab = $("#annotFab");
  fab.addEventListener("pointerdown", function(e){ e.preventDefault(); annotSnap = annotSel; });
  fab.addEventListener("click", openAnnotBox);
  $("#annotSend").addEventListener("click", sendAnnotation);
  $("#annotCancel").addEventListener("click", hideAnnotAll);
  $("#annotInput").addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendAnnotation(); }
    if (e.key === "Escape"){ e.stopPropagation(); hideAnnotBox(); }
  });
  // ? → 键盘帮助(输入态不抢)
  document.addEventListener("keydown", function(e){
    if (e.key !== "?") return;
    var a = document.activeElement;
    if (a && (["INPUT", "TEXTAREA", "SELECT"].indexOf(a.tagName) >= 0 || a.isContentEditable)) return;
    e.preventDefault();
    openKeysHelp();
  });
  document.addEventListener("pointerdown", function(e){
    var box = $("#annotBox");
    if (!box.classList.contains("show")) return;
    var t = e.target instanceof Element ? e.target : null;
    if (t && (box.contains(t) || t.closest("#annotFab"))) return;
    hideAnnotBox();
  });
  // modal scrim
  $("#modalScrim").addEventListener("click", function(e){
    if (e.target === $("#modalScrim")) closeModal();
  });
  // rail / drawer
  $("#railMatters").addEventListener("click", function(){ location.hash = "#/inbox"; });
  $("#railMe").addEventListener("click", function(){ showConnect(); });
  $("#railSettings").addEventListener("click", function(){ showConnect(); });
  $("#newMatterTop").addEventListener("click", function(){
    if (!authReady()){ showConnect(); return; }
    openMatterModal({});
  });
  var burger = $("#navBurger");
  burger.addEventListener("click", function(){
    var open = $("#modnav").classList.toggle("open");
    $("#navScrim").classList.toggle("open", open);
  });
  $("#navScrim").addEventListener("click", closeDrawer);
}

/* ================= boot ================= */
if (EMBED){
  document.body.classList.add("embed");
  var loginLink = $("#connectLoginLink");
  if (loginLink) loginLink.style.display = "none"; // 宿主已登录,不给登录页入口
}
loadAuth();
buildNav();
paintIdentity();
bindConnect();
bindGlobal();
window.addEventListener("hashchange", function(){ render(); });
if (!location.hash) history.replaceState(null, "", "#/inbox");
render();
if (authReady()){
  loadMembers();
  if (parseHash().view !== "inbox") fetchTabCounts(); // 收件箱路由自己会拉计数
}
if (auth.token && !auth.space){
  discoverSpace().then(function(found){
    if (found){ hideConnect(); paintIdentity(); loadMembers(); render(); }
  });
}
</script>
</body>
</html>
