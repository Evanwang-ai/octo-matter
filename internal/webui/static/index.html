  var mo = $("#modal");
  mo.className = "modal";
  mo.style.maxWidth = "420px";
  var row = function(k, d){ return '<div class="keys-row"><kbd>' + esc(k) + '</kbd><span class="kd">' + esc(d) + "</span></div>"; };
  mo.innerHTML = '<div class="modal-h"><div><div class="modal-title">键盘</div></div>'
    + '<button class="modal-x" id="mx" type="button">×</button></div>'
    + '<div class="modal-body"><div class="keys-help">'
    + row("j / k", "上下移动")
    + row("Enter / Space", "打开")
    + row("Tab", "切换区域")
    + row("Esc", "关闭弹层")
    + row("?", "这份帮助")
    + "</div></div>";
  openModal(function(){ mo.style.maxWidth = ""; });
  $("#mx").onclick = closeModal;
}

/* ================= global wiring ================= */
function bindGlobal(){
  // data-uid → Agent 名片;capture 阻断行/Preference自身跳转
  document.addEventListener("click", function(e){
    var t = e.target instanceof Element ? e.target : null;
    if (!t) return;
    var chip = t.closest("[data-uid]");
    if (chip && !chip.closest("#agentPop") && !chip.closest("#mentionPicker")){
      e.preventDefault();
      e.stopPropagation();
      openAgentCard(chip.getAttribute("data-uid"));
      return;
    }
  }, true);
  // 点外面收起 popover / 状态菜单 / 浮层菜单 / 日历
  document.addEventListener("click", function(e){
    var t = e.target instanceof Element ? e.target : null;
    if (!t) return;
    if (!t.closest("#agentPop") && !t.closest("[data-uid]")) closeAgentPop();
    if (!t.closest("#statusField")) $$(".status-field.open").forEach(function(f){ setStatusMenuOpen(f, false); });
    if (!t.closest("#boardFilterPop") && !t.closest("#boardFilterBtn")) setBoardFilterOpen(false);
    if (!t.closest("#boardDisplayPop") && !t.closest("#boardDisplayBtn")) setBoardDisplayOpen(false);
  });
  document.addEventListener("pointerdown", function(e){
    var t = e.target instanceof Element ? e.target : null;
    if (!t) return;
    if (fmState && !t.closest("#floatMenu") && !(fmState.anchor && fmState.anchor.contains(t))) closeFloatMenu();
    if (dlState && !t.closest("#dlPop") && !(dlState.anchor && dlState.anchor.contains(t))) closeDlPop();
  });
  document.addEventListener("keydown", function(e){
    if (e.key === "Escape"){
      if (boardDisplayOpen){ setBoardDisplayOpen(false); return; }
      if (boardFilterOpen){ setBoardFilterOpen(false); return; }
      if (fmState || dlState){ closeFloatMenu(); closeDlPop(); return; } // 先收浮层,再退弹窗
      closeAgentPop();
      hideAnnotAll();
      closeModal();
      $$(".status-field.open").forEach(function(f){ setStatusMenuOpen(f, false); });
    }
  });
  // 内容区滚动时,浮层跟着锚点挪;锚点没了才收起(浮层内部滚动不受影响)
  document.addEventListener("scroll", function(e){
    var t = e.target;
    if (fmState && !(t instanceof Element && t.closest("#floatMenu"))){
      if (fmState.anchor && fmState.anchor.isConnected) placePop($("#floatMenu"), fmState.anchor.getBoundingClientRect());
      else closeFloatMenu();
    }
    if (dlState && !(t instanceof Element && t.closest("#dlPop"))){
      if (dlState.anchor && dlState.anchor.isConnected) placePop($("#dlPop"), dlState.anchor.getBoundingClientRect());
      else closeDlPop();
    }
  }, true);
  window.addEventListener("resize", function(){ closeFloatMenu(); closeDlPop(); drawPlanEdges(); });
  // 计划图画布:按住空白处横向拖动平移;节点点击不受影响
  document.addEventListener("pointerdown", function(e){
    var t = e.target instanceof Element ? e.target : null;
    var g = t ? t.closest(".plan-graph") : null;
    if (!g || (t && t.closest(".pg-node"))) return;
    var sx = e.clientX, sl = g.scrollLeft;
    g.classList.add("panning");
    var move = function(ev){ g.scrollLeft = sl - (ev.clientX - sx); };
    var up = function(){
      g.classList.remove("panning");
      document.removeEventListener("pointermove", move);
      document.removeEventListener("pointerup", up);
    };
    document.addEventListener("pointermove", move);
    document.addEventListener("pointerup", up);
  });
  // j / k 在列表与看板里移动;Enter 打开
  document.addEventListener("keydown", function(e){
    if (e.key !== "j" && e.key !== "k") return;
    var a = document.activeElement;
    if (a && ["INPUT", "TEXTAREA", "SELECT"].indexOf(a.tagName) >= 0) return;
    var rows = $$('.mrow[tabindex="0"], .bcard[tabindex="0"]');
    if (!rows.length) return;
    var i = rows.indexOf(a);
    var next = e.key === "j" ? rows[Math.min(rows.length - 1, i + 1)] : rows[Math.max(0, i - 1)];
    if (next){ e.preventDefault(); next.focus(); next.scrollIntoView({ block: "nearest" }); }
  });
  document.addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    var t = e.target instanceof Element ? e.target.closest('[tabindex="0"]') : null;
    if (!t || ["INPUT", "TEXTAREA", "SELECT", "BUTTON", "A"].indexOf(t.tagName) >= 0) return;
    e.preventDefault();
    t.click();
  });
  // 批注
  document.addEventListener("selectionchange", function(){
    if (annotFabRaf) cancelAnimationFrame(annotFabRaf);
    annotFabRaf = requestAnimationFrame(positionAnnotFab);
  });
  var fab = $("#annotFab");
  fab.addEventListener("pointerdown", function(e){ e.preventDefault(); annotSnap = annotSel; });
  fab.addEventListener("click", openAnnotBox);
  // ? → 键盘帮助(输入态不抢)
  document.addEventListener("keydown", function(e){
    if (e.key !== "?") return;
    var a = document.activeElement;
    if (a && (["INPUT", "TEXTAREA", "SELECT"].indexOf(a.tagName) >= 0 || a.isContentEditable)) return;
    e.preventDefault();
    openKeysHelp();
  });
  // modal scrim
  $("#modalScrim").addEventListener("click", function(e){
    if (e.target === $("#modalScrim")) closeModal();
  });
  // rail / drawer
  $("#railMatters").addEventListener("click", function(){ location.hash = "#/matters"; });
  $("#railMe").addEventListener("click", function(){ showConnect(); });
  $("#railSettings").addEventListener("click", function(){ showConnect(); });
  var topNewBtn = $("#newMatterTop");
  if (topNewBtn) topNewBtn.addEventListener("click", function(){
    if (!authReady()){ showConnect(); return; }
    openMatterModal({});
  });
  var burger = $("#navBurger");
  burger.addEventListener("click", function(){
    var open = $("#modnav").classList.toggle("open");
    $("#navScrim").classList.toggle("open", open);
  });
  $("#navScrim").addEventListener("click", closeDrawer);
}

/* ================= boot ================= */
if (EMBED){
  document.body.classList.add("embed");
  var loginLink = $("#connectLoginLink");
  if (loginLink) loginLink.style.display = "none"; // 宿主已登录,不给登录页入口
}
loadAuth();
buildNav();
paintIdentity();
bindConnect();
bindGlobal();
window.addEventListener("hashchange", function(){ render(); });
if (!location.hash) history.replaceState(null, "", "#/matters");
render();
if (authReady()){
  loadMembers();
  resolveUid();
  if (parseHash().view !== "mymatters") setTimeout(fetchReviewBadge, 1400);
}
if (auth.token && !auth.space){
  discoverSpace().then(function(found){
    if (found){ hideConnect(); paintIdentity(); resolveUid(); loadMembers(); render(); }
  });
}
</script>
