<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Octo · 事项</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    /* ===== Octo tokens — from octo设计稿.fig (prototype :root) ===== */
    --ink: 28,28,35;
    --bg: #f5f6f7;
    --panel: #ffffff;
    --border: rgba(28,28,35,.10);
    --border-soft: rgba(28,28,35,.06);
    --text: #1c1c23;
    --text-2: rgba(28,28,35,.66);
    --text-3: rgba(28,28,35,.62);
    --text-4: rgba(28,28,35,.62);
    --fill-1: rgba(28,28,35,.02);
    --fill-2: rgba(28,28,35,.03);
    --fill-3: rgba(28,28,35,.06);
    --accent: #0077fa;
    --accent-2: #4e9bff;
    --accent-tint: #ebf5ff;
    --accent-tint-2: #dcecff;
    --accent-border: #bfdcff;
    --progress: #0077fa;
    --progress-bg: #ebf9ff;
    --amber: #ff8800;
    --amber-bg: #fff5eb;
    --amber-border: #ffe1bf;
    --done: #21a953;
    --done-bg: #e9f8ee;
    --done-border: #bfe8cb;
    --gray: rgba(28,28,35,.5);
    --gray-bg: rgba(28,28,35,.05);
    --block: #f54a45;
    --block-bg: #feeceb;
    --block-border: #f8cfcc;
    --danger: #f54a45;
    --tag-doing: #0056a3;
    --tag-review: #985700;
    --tag-done: #1a7a40;
    --tag-block: #ad1f17;
    --tag-todo: rgba(28,28,35,.6);
    --agent: #7f3bf5;
    --agent-tint: #f4eefe;
    --agent-border: #e4d5fb;
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace;
    --shadow: 0 1px 2px rgba(28,28,35,.05), 0 4px 14px rgba(28,28,35,.04);
  }
  html, body {
    height: 100%;
    font-family: "PingFang SC", -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }
  .app { width: 100vw; height: 100vh; height: 100dvh; background: var(--bg); overflow: hidden; display: flex; }
  button { font-family: inherit; }

  /* ============ ZONE 1 · icon rail ============ */
  .rail {
    width: 56px; flex: 0 0 56px;
    background: var(--bg);
    border-right: 1px solid rgba(28,28,35,.08);
    display: flex; flex-direction: column; align-items: center;
    padding: 20px 0; gap: 8px;
  }
  .rail .avatar-top {
    width: 40px; height: 40px; border-radius: 100px;
    background: linear-gradient(135deg, #4e9bff, #1677ff);
    color: #fff; display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; cursor: pointer; flex: 0 0 auto; position: relative;
  }
  .rail .avatar-top::after {
    content: ""; position: absolute; right: -1px; bottom: -1px;
    width: 9px; height: 9px; border-radius: 50%; background: #41cd59; border: 2px solid var(--bg);
  }
  .rail .avatar-top.off::after { background: #c2c6cf; }
  .rail-btn {
    width: 56px; height: 44px; border-radius: 0; padding: 4px 8px;
    display: flex; align-items: center; justify-content: center;
    color: rgba(28,28,35,.3); cursor: pointer; transition: background .15s, color .15s; flex: 0 0 auto;
  }
  .rail-btn svg { width: 20px; height: 20px; stroke-width: 1.75; }
  .rail-btn:hover { background: var(--fill-2); color: rgba(28,28,35,.6); }
  .rail-btn.active { background: var(--fill-2); color: var(--text); }
  .rail-spacer { flex: 1; }
  body.embed .rail { display: none !important; }

  /* ============ ZONE 2 · module nav ============ */
  .modnav {
    width: 252px; flex: 0 0 252px;
    background: var(--bg);
    border-right: 1px solid rgba(28,28,35,.08);
    display: flex; flex-direction: column;
  }
  .modnav-h { display: flex; align-items: center; gap: 10px; height: 64px; flex: 0 0 64px; padding: 18px 16px 12px; }
  .modnav-h .mh-title { font-size: 20px; line-height: 28px; font-weight: 650; color: var(--text); }
  .modnav-h .mh-ws {
    max-width: 92px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    font-size: 10px; line-height: 16px; font-weight: 500; color: rgba(28,28,35,.4);
    padding: 0 6px; border-radius: 4px; background: rgba(28,28,35,.06); font-family: var(--mono);
  }
  .modnav-h .mh-spacer { flex: 1; }
  .modnav-h .mh-add {
    width: 28px; height: 28px; border-radius: 7px; display: flex; align-items: center; justify-content: center;
    color: rgba(28,28,35,.4); cursor: pointer; transition: .15s; border: 0; background: transparent;
  }
  .modnav-h .mh-add:hover { background: rgba(28,28,35,.06); color: var(--text); }
  .modnav-h .mh-add svg { width: 18px; height: 18px; }
  .modnav-scroll { flex: 1; overflow-y: auto; padding: 28px 12px 20px; }
  .nav-list { display: flex; flex-direction: column; gap: 8px; }
  .nav-item {
    position: relative; display: flex; align-items: center; gap: 11px;
    min-height: 40px; height: 40px; padding: 0 12px; border-radius: 10px;
    font-size: 14px; line-height: 22px; font-weight: 500; color: rgba(28,28,35,.6);
    cursor: pointer; transition: background .15s;
  }
  .nav-item:hover { background: var(--fill-2); color: var(--text); }
  .nav-item.active { background: rgba(46,50,56,.09); color: var(--text); }
  .nav-item.active::before {
    content: ""; position: absolute; left: 0; top: 11px; width: 4px; height: 18px;
    border-radius: 9999px; background: var(--accent);
  }
  .nav-item .ni-ic { width: 18px; height: 18px; flex: 0 0 18px; display: flex; align-items: center; justify-content: center; color: rgba(28,28,35,.4); }
  .nav-item .ni-ic svg { width: 18px; height: 18px; }
  .nav-item .ni-label { flex: 1; min-width: 0; }
  .nav-scrim { display: none; }

  /* ============ ZONE 3 · center ============ */
  .work { flex: 1; display: flex; flex-direction: column; background: var(--panel); min-width: 0; }
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    height: 46px; flex: 0 0 46px; padding: 0 20px;
    border-bottom: 1px solid var(--border); background: var(--panel);
  }
  .crumb { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text-3); min-width: 0; }
  .crumb .back {
    width: 26px; height: 26px; border-radius: 7px; margin-right: 2px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-2); cursor: pointer; font-size: 15px; transition: .15s; flex: 0 0 auto;
  }
  .crumb .back:hover { background: #f0f0f4; color: var(--text); }
  .crumb .proj { color: var(--text-2); cursor: pointer; white-space: nowrap; max-width: 200px; overflow: hidden; text-overflow: ellipsis; }
  .crumb .proj:hover { color: var(--text); }
  .crumb .sep { color: var(--text-4); font-size: 12px; }
  .crumb .here { color: var(--text); font-weight: 600; display: flex; align-items: center; gap: 6px; white-space: nowrap; flex: 0 1 auto; min-width: 0; }
  .crumb .here .crumb-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .crumb .cid { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); font-weight: 500; flex: 0 0 auto; }
  .crumb .title-plain { font-size: 14px; font-weight: 700; color: var(--text); }
  .topbar-right { display: flex; align-items: center; gap: 4px; }
  .tb-icon {
    width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    color: var(--text-3); cursor: pointer; font-size: 15px; transition: .15s;
  }
  .tb-icon:hover { background: #f0f0f4; color: var(--text-2); }
  .tb-icon.on { background: var(--accent-tint-2); color: var(--accent); }
  .center-wrap { flex: 1; display: flex; min-height: 0; }
  .center-col { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .content { flex: 1; overflow-y: auto; min-width: 0; }
  .content-inner { width: 100%; max-width: 880px; margin: 0 auto; padding: 34px clamp(20px, 4vw, 56px) 48px; }
  .content-inner.wide { max-width: 1160px; }
  .content-inner.wide.inbox-page { max-width: 1420px; }
  .content::-webkit-scrollbar, .props::-webkit-scrollbar { width: 10px; height: 10px; }
  .content::-webkit-scrollbar-thumb, .props::-webkit-scrollbar-thumb {
    background: #d6d9de; border-radius: 6px; border: 3px solid transparent; background-clip: padding-box;
  }

  /* ============ generic ============ */
  .pill {
    display: inline-flex; align-items: center; gap: 5px;
    min-height: 20px; padding: 0 8px; border-radius: 9999px;
    font-size: 12px; line-height: 20px; font-weight: 600; white-space: nowrap;
  }
  .pill .dot { width: 6px; height: 6px; border-radius: 50%; flex: 0 0 6px; }
  .pill.progress { background: var(--progress-bg); color: var(--tag-doing); }
  .pill.progress .dot { background: var(--progress); }
  .pill.amber { background: var(--amber-bg); color: var(--tag-review); }
  .pill.amber .dot { background: var(--amber); }
  .pill.done { background: var(--done-bg); color: var(--tag-done); }
  .pill.done .dot { background: var(--done); }
  .pill.gray { background: var(--gray-bg); color: var(--tag-todo); }
  .pill.gray .dot { background: var(--gray); }
  .pill.block { background: var(--block-bg); color: var(--tag-block); }
  .pill.block .dot { background: var(--block); }
  .pill.cancel { background: rgba(28,28,35,.05); color: var(--text-3); }
  .pill.cancel .dot { background: #c2c6cf; }
  .mav {
    width: 20px; height: 20px; border-radius: 50%;
    display: inline-flex; align-items: center; justify-content: center;
    font-size: 10px; font-weight: 600; color: #fff; flex: 0 0 20px; text-transform: uppercase;
  }
  .mav-sm { width: 18px; height: 18px; flex: 0 0 18px; font-size: 9.5px; }
  [data-uid] { cursor: pointer; }
  [data-uid]:hover .nm, [data-uid]:hover.uname, .uname[data-uid]:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
  .empty-state { text-align: center; color: var(--text-4); font-size: 14px; padding: 60px 0; }
  .empty-state .es-t { font-size: 14px; font-weight: 600; color: var(--text-2); margin-bottom: 5px; }
  .empty-state .es-s { font-size: 12.5px; color: var(--text-3); line-height: 1.6; }
  .err-state { border: 1px dashed var(--block-border); background: #fffafa; border-radius: 12px; padding: 18px; margin-top: 18px; font-size: 13px; color: var(--text-2); line-height: 1.7; }
  .err-state b { color: var(--tag-block); font-weight: 650; }
  .err-state .retry {
    display: inline-flex; margin-top: 8px; border: 1px solid var(--border); border-radius: 7px;
    background: #fff; padding: 4px 12px; font-size: 12.5px; font-weight: 600; color: var(--text-2); cursor: pointer;
  }
  .err-state .retry:hover { color: var(--text); border-color: rgba(28,28,35,.22); }
  .skel { position: relative; overflow: hidden; background: rgba(28,28,35,.05); border-radius: 8px; }
  .skel::after {
    content: ""; position: absolute; inset: 0; transform: translateX(-100%);
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.65), transparent);
    animation: skelmove 1.2s infinite;
  }
  @keyframes skelmove { 100% { transform: translateX(100%); } }
  .sk-rows { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
  .sk-cols { display: flex; gap: 20px; margin-top: 18px; }
  .sk-cols .skel { flex: 1; }
  .list-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; gap: 10px; flex-wrap: wrap; }
  .list-title { min-width: 0; font-size: 20px; line-height: 26px; font-weight: 600; color: var(--text); }
  .list-sub { font-size: 13px; color: rgba(28,28,35,.4); margin-bottom: 24px; }
  .new-btn {
    display: inline-flex; align-items: center; gap: 6px; flex: 0 0 auto; white-space: nowrap;
    min-height: 28px; padding: 4px 12px; border-radius: 4px; border: 1px solid rgba(0,119,250,.16);
    background: #ebf9ff; color: #005694; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .new-btn:hover { background: #dcecff; }
  .sec {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12.5px; font-weight: 700; color: var(--text-2); letter-spacing: .3px; margin-bottom: 12px;
  }
  .sec .sec-l { display: flex; align-items: center; gap: 9px; }
  .sec .sec-count { font-weight: 500; color: var(--text-3); }
  .mode-tag {
    display: inline-flex; align-items: center; font-size: 10px; font-weight: 600; letter-spacing: .3px;
    color: var(--text-3); border: 1px solid var(--border); border-radius: 6px; padding: 1px 6px; cursor: default;
  }
  .block { margin-bottom: 30px; }
  .load-more {
    display: block; width: 100%; margin-top: 10px; padding: 9px 0;
    border: 1px dashed var(--border); border-radius: 9px; background: transparent;
    color: var(--text-3); font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .load-more:hover { color: var(--text-2); background: var(--fill-2); }

  /* ============ inbox list ============ */
  .inbox-toolbar { display: flex; align-items: center; gap: 10px; margin: 0 0 14px; flex-wrap: wrap; }
  .inbox-filterbar {
    max-width: 100%; display: inline-flex; align-items: center; gap: 4px;
    padding: 4px; border-radius: 999px; background: rgba(28,28,35,.06);
    overflow-x: auto; scrollbar-width: none; flex: 0 1 auto;
  }
  .inbox-filterbar::-webkit-scrollbar { display: none; }
  .inbox-filter {
    flex: 0 0 auto; min-height: 28px; display: inline-flex; align-items: center; gap: 5px;
    padding: 0 12px; border-radius: 999px; color: rgba(28,28,35,.55);
    font-size: 13px; line-height: 20px; font-weight: 500; white-space: nowrap; cursor: pointer; transition: .15s;
  }
  .inbox-filter:hover { color: var(--text); }
  .inbox-filter.active { background: #fff; color: var(--text); font-weight: 600; box-shadow: 0 1px 2px rgba(28,28,35,.08); }
  .inbox-filter-count { color: rgba(28,28,35,.38); font-size: 12px; font-weight: 600; }
  .tab-badge {
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 18px; height: 18px; padding: 0 5px; border-radius: 999px;
    background: var(--block); color: #fff; font-size: 11px; font-weight: 700;
  }
  .nav-badge {
    margin-left: auto; display: inline-flex; align-items: center; justify-content: center;
    min-width: 19px; height: 19px; padding: 0 6px; border-radius: 999px;
    background: var(--block); color: #fff; font-size: 11px; font-weight: 700; flex: 0 0 auto;
  }
  .src-chip { display: inline-flex; align-items: center; gap: 3px; min-width: 0; color: var(--text-3); cursor: pointer; }
  .src-chip:hover { color: var(--text); text-decoration: underline dotted; text-underline-offset: 3px; }
  .src-chip .sc-nm { min-width: 0; max-width: 160px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ai-tag {
    display: inline-flex; align-items: center; flex: 0 0 auto; height: 14px; padding: 0 4px;
    border-radius: 4px; background: var(--agent-tint); border: 1px solid var(--agent-border);
    color: var(--agent); font-size: 9px; font-weight: 700; letter-spacing: .4px; line-height: 1;
  }
  .list-search {
    flex: 1 1 220px; max-width: 360px; min-height: 36px; padding: 7px 12px;
    font: inherit; font-size: 13px; color: var(--text);
    background: var(--panel); border: 1px solid var(--border); border-radius: 7px; transition: border-color .15s ease-out;
  }
  .list-search::placeholder { color: var(--text-3); }
  .list-search:focus { outline: none; border-color: var(--accent-border); }
  .inbox-table-head {
    display: grid;
    grid-template-columns: minmax(300px, 1fr) 104px minmax(170px, 220px) 92px;
    column-gap: 24px; align-items: center; padding: 0 18px 9px;
    color: var(--text-4); font-size: 12px; font-weight: 650; border-bottom: 1px solid var(--border);
  }
  .inbox-table-head span:nth-child(4) { text-align: right; }
  .mlist { display: flex; flex-direction: column; gap: 0; border-bottom: 1px solid var(--border); }
  .mrow {
    position: relative; display: grid;
    grid-template-columns: minmax(300px, 1fr) 104px minmax(170px, 220px) 92px;
    grid-template-areas: "main code assignee date";
    align-items: center; column-gap: 24px; min-height: 68px; padding: 12px 18px;
    background: var(--panel); border: 0; border-bottom: 1px solid var(--border-soft);
    cursor: pointer; transition: background .15s; overflow: hidden;
  }
  .mrow:hover { background: var(--fill-1); }
  .mrow:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .mrow.has-kids { padding-left: 42px; }
  .mrow[data-status="cancelled"], .mrow[data-status="archived"] { opacity: .6; }
  .row-exp {
    position: absolute; left: 5px; top: 50%; transform: translateY(-50%);
    width: 30px; height: 30px; display: inline-flex; align-items: center; justify-content: center;
    border: 1px solid transparent; background: transparent; border-radius: 8px;
    color: var(--text-2); font-size: 13px; cursor: pointer;
  }
  .row-exp:hover { background: var(--fill-3); color: var(--text); }
  .row-exp:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .mrow.m-child { padding-left: 64px; }
  .mrow.m-child .m-title { font-weight: 550; }
  .mrow.m-none { cursor: default; color: var(--text-4); font-size: 12.5px; min-height: 44px; padding-left: 64px; background: #fafafb; display: flex; align-items: center; }
  .mrow .m-main { grid-area: main; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
  .mrow .m-title {
    min-width: 0; line-height: 22px; font-size: 15px; font-weight: 600; color: var(--text);
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .mrow .m-subline { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 11.5px; line-height: 16px; color: var(--text-3); }
  .mrow .m-subline span { flex: 0 0 auto; }
  .mrow .m-subline .m-project { min-width: 0; max-width: min(40vw, 300px); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mrow .m-inline-pill { display: inline-flex; align-items: center; flex: 0 0 auto; }
  .mrow .m-inline-pill .pill { height: 20px; min-width: 42px; padding: 0 8px; }
  .mrow .m-id { font-family: var(--mono); }
  .mrow .m-dotsep { color: rgba(28,28,35,.22); }
  .mrow .m-deadline.overdue { color: var(--tag-block); font-weight: 600; }
  .mrow .m-codecol {
    grid-area: code; display: inline-flex; align-items: center; justify-content: center;
    min-width: 0; height: 26px; border-radius: 8px; background: var(--fill-2);
    color: var(--text-2); font-family: var(--mono); font-size: 12.5px; font-weight: 700; white-space: nowrap;
  }
  .mrow .m-assignee {
    grid-area: assignee; min-width: 0; display: inline-flex; align-items: center; gap: 6px;
    font-size: 12.5px; font-weight: 550; color: var(--text-2);
  }
  .mrow .m-assignee .mav { width: 22px; height: 22px; flex: 0 0 22px; font-size: 11px; }
  .mrow .m-assignee .mav + .mav { margin-left: -10px; box-shadow: 0 0 0 2px #fff; }
  .m-noone { color: var(--text-4); font-size: 12px; }
  .pv-assignee {
    display: inline-flex; align-items: center; gap: 6px; min-width: 0;
    font-size: 12.5px; font-weight: 550; color: var(--text);
    padding: 2px 7px 2px 3px; border-radius: 7px; transition: .15s;
  }
  .pv-assignee:hover { background: var(--fill-3); }
  .pv-assignee .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 130px; }
  .mrow .m-datecol {
    grid-area: date; color: var(--text); font-family: var(--mono); font-size: 13px; font-weight: 600;
    text-align: right; white-space: nowrap;
  }

  /* ============ board ============ */
  .board-actions { display: flex; gap: 8px; align-items: center; margin-left: auto; }
  .board-sel {
    height: 34px; padding: 0 30px 0 12px; border: 1px solid var(--border); border-radius: 7px;
    background: #fff; color: var(--text); font: inherit; font-size: 13px; cursor: pointer; max-width: 200px;
    appearance: none;
    background-image: url("data:image/svg+xml;charset=utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='10' height='6' viewBox='0 0 10 6'%3E%3Cpath d='M1 1l4 4 4-4' fill='none' stroke='%23999da6' stroke-width='1.6' stroke-linecap='round'/%3E%3C/svg%3E");
    background-repeat: no-repeat; background-position: right 10px center;
  }
  .board-sel:focus { outline: none; border-color: var(--accent-border); }
  .board-wrap { display: flex; gap: 16px; align-items: flex-start; overflow-x: auto; padding-bottom: 8px; }
  .board-col {
    min-width: 226px; flex: 1 1 0; display: flex; flex-direction: column;
    background: var(--fill-1); border: 1px solid var(--border-soft); border-radius: 10px; padding: 10px;
    min-height: max(300px, calc(100dvh - 260px));
  }
  .board-col-h {
    display: flex; align-items: center; gap: 8px; padding: 2px 2px 12px;
    font-size: 13px; font-weight: 600; color: var(--text-2);
  }
  .board-col-h .bc-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 8px; }

  }
  .ff-cancel { color: rgba(28,28,35,.68); border: 1px solid rgba(28,28,35,.12); background: #fff; }
  .ff-cancel:hover { background: var(--fill-2); }
  .ff-save { color: #fff; background: #1c1c23; }
  .ff-save:hover { opacity: .92; }
  .ff-save:disabled, .ff-danger:disabled { opacity: .5; cursor: default; }
  .ff-danger { color: #c2453a; border: 1px solid rgba(194,69,58,.3); background: #fff; }
  .ff-danger:hover { background: var(--block-bg); }
  .smart-draft {
    width: 100%; min-height: 172px; max-height: min(36vh, 280px); resize: vertical;
    border: 1px solid var(--border-soft); border-radius: 8px; background: #fff; color: var(--text);
    padding: 10px 11px; font-family: var(--mono); font-size: 12.5px; line-height: 1.65; outline: none;
  }
  .smart-draft:focus { border-color: rgba(0,119,250,.34); box-shadow: 0 0 0 2px rgba(0,119,250,.08); }
  .llm-warn {
    display: flex; gap: 8px; align-items: flex-start;
    border: 1px solid var(--amber-border); background: var(--amber-bg); border-radius: 9px;
    padding: 10px 12px; font-size: 12.5px; color: var(--tag-review); line-height: 1.6;
  }
  .smart-lede { font-size: 13px; color: var(--text-2); line-height: 1.7; }
  .smart-quiet { font-size: 11.5px; color: var(--text-4); line-height: 1.6; margin-top: 8px; }

  /* ============ matter detail · pass2(目标/计划图/产出文件/来源) ============ */
  .src-chip-top {
    display: inline-flex; align-items: center; gap: 6px; max-width: 220px;
    border: 1px solid var(--border); border-radius: 7px; background: var(--panel);
    padding: 3px 10px; font-size: 12px; color: var(--text-2); cursor: pointer; transition: .15s;
  }
  .src-chip-top:hover { background: var(--fill-2); }
  .src-chip-top .nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .brief .goal-line { font-size: 14px; line-height: 1.7; color: var(--text); font-weight: 700; overflow-wrap: anywhere; margin-bottom: 6px; }
  .brief-rest { font-size: 13.5px; line-height: 1.75; color: var(--text-2); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 10px; }
  .constraint-label { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .3px; margin: 14px 0 6px; }
  .clist { list-style: none; display: grid; gap: 5px; margin: 0; padding: 0; }
  .clist li { display: flex; gap: 8px; font-size: 13px; line-height: 1.6; color: var(--text-2); overflow-wrap: anywhere; }
  .clist li .bullet { color: var(--accent); flex: 0 0 auto; }
  .file-out { display: flex; align-items: center; gap: 10px; border: 1px solid rgba(28,28,35,.10); border-radius: 10px; background: rgba(255,255,255,.8); padding: 10px 12px; }
  .file-out + .file-out { margin-top: 8px; }
  .file-out .fo-ic { width: 34px; height: 34px; flex: 0 0 34px; border-radius: 8px; background: var(--fill-2); display: flex; align-items: center; justify-content: center; font-size: 15px; }
  .file-out .fo-main { min-width: 0; flex: 1; }
  .file-out .fo-name { font-family: var(--mono); font-size: 12.5px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .file-out .fo-meta { margin-top: 2px; font-size: 11px; color: var(--text-3); }
  .composer-tools { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; padding-bottom: 1px; }
  .composer-icon {
    width: 30px; height: 30px; border: 0; border-radius: 7px; background: transparent; color: var(--text-3);
    font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; transition: .15s;
  }
  .composer-icon:hover { background: var(--fill-2); color: var(--text); }
  .composer-icon[disabled] { opacity: .4; cursor: not-allowed; }
  .composer-icon svg { width: 17px; height: 17px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
  .so-dot-slot { display: inline-flex; }
  .status-opt.danger { border-top: 1px solid var(--border-soft); margin-top: 4px; padding-top: 9px; }
  .status-opt.danger .so-name { color: #b46a62; }
  .src-send {
    margin-left: 6px; font-size: 11px; font-weight: 600; color: var(--done); background: #fff;
    border: 1px solid var(--done-border); border-radius: 6px; padding: 2px 9px; cursor: pointer; transition: .15s;
  }
  .src-send:hover { background: var(--done-bg); }
  .banner-note { margin-top: 8px; font-size: 11px; color: var(--text-4); line-height: 1.5; }
  .prog-rows { display: grid; gap: 2px; }
  .prog-row { display: flex; align-items: center; gap: 8px; min-height: 30px; font-size: 12.5px; color: var(--text); }
  .prog-row .pr-dot { width: 7px; height: 7px; border-radius: 999px; background: var(--done); flex: 0 0 7px; }
  .prog-row .pr-dot.doing { background: var(--accent); }
  .prog-row .pr-dot.amber { background: var(--amber); }
  .prog-row .pr-main { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .prog-row .pr-side { font-size: 11px; color: var(--text-4); flex: 0 0 auto; }
  .trail-more { margin: 2px 0 4px; font-size: 12px; color: var(--accent); cursor: pointer; font-weight: 600; }
  .trail-more:hover { text-decoration: underline; }

  /* ===== 计划图(几何即语义,移植自原型 plan-graph) ===== */
  .plan-shell { padding: 10px; border-radius: 10px; background: rgba(28,28,35,.035); }
  .plan-overview {
    display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 54px;
    padding: 10px 12px; border-radius: 8px; background: rgba(255,255,255,.72); margin-bottom: 10px;
  }
  .po-left { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .po-dot { width: 8px; height: 8px; flex: 0 0 8px; border-radius: 50%; background: var(--accent); }
  .plan-overview.done .po-dot { background: var(--done); }
  .plan-overview.taste .po-dot { background: var(--amber); }
  .plan-overview.block .po-dot { background: var(--block); }
  .po-eyebrow { margin-bottom: 2px; color: rgba(28,28,35,.44); font-size: 11px; line-height: 14px; font-weight: 650; }
  .po-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: rgba(28,28,35,.86); font-size: 13px; font-weight: 650; }
  .po-meter { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .po-num { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
  .po-bar { width: 110px; height: 4px; border-radius: 999px; background: rgba(28,28,35,.08); overflow: hidden; }
  .po-bar span { display: block; height: 100%; background: var(--done); border-radius: 999px; }
  .plan-graph { position: relative; padding: 6px 2px 10px; overflow-x: auto; cursor: grab; }
  .plan-graph.panning { cursor: grabbing; user-select: none; }
  .pg-edges { position: absolute; left: 0; top: 0; pointer-events: none; z-index: 0; }
  .pg-cols { position: relative; display: flex; align-items: center; gap: 56px; z-index: 1; width: max-content; min-width: 100%; }
  .pg-col { display: flex; flex-flow: column wrap; gap: 10px; max-height: 380px; align-content: flex-start; }
  .pg-node {
    width: 196px; background: var(--panel); border: 1.5px solid var(--border); border-radius: 9px;
    padding: 9px 11px 10px; transition: border-color .15s ease-out, box-shadow .15s ease-out;
  }
  .pg-node[data-open-matter] { cursor: pointer; }
  .pg-node[data-open-matter]:hover { border-color: #c9cdd6; box-shadow: 0 2px 10px rgba(28,28,35,.06); }
  .pg-node[data-open-matter]:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .pg-node.st-todo { border-style: dashed; }
  .pg-node.st-doing { border-color: var(--accent-border); }
  .pg-node.st-review { border-color: #ecc987; }
  .pg-node.st-block { border-color: #eebcb4; }
  .pg-node.st-done { background: #fafafb; }
  .pg-node.st-done .pg-title { color: var(--text-3); }
  .pg-node.st-cancel { border-style: dashed; opacity: .7; }
  .pg-node.is-join { border-radius: 12px; }
  .pg-node.is-root { width: auto; min-width: 168px; }
  .pg-top { display: flex; align-items: center; gap: 6px; margin-bottom: 5px; }
  .pg-dot { width: 8px; height: 8px; border-radius: 999px; flex: 0 0 8px; }
  .pg-dot.todo { background: #c9cdd6; }
  .pg-dot.doing { background: var(--accent); }
  .pg-dot.review { background: var(--amber); }
  .pg-dot.done { background: var(--done); }
  .pg-dot.block { background: var(--block); }
  .pg-dot.cancel { background: #c2c6cf; }
  .pg-id { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); }
  .pg-role-tag {
    margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .4px;
    color: var(--text-3); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px;
  }
  .pg-title {
    font-size: 12.5px; font-weight: 600; color: var(--text); line-height: 1.4;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; margin-bottom: 7px;
  }
  .pg-asg { display: flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--text-2); min-width: 0; cursor: pointer; }
  .pg-asg .nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pg-asg .mav { width: 18px; height: 18px; flex: 0 0 18px; font-size: 9px; }
  .pg-state { margin-top: 7px; font-size: 11.5px; font-weight: 600; color: var(--text-2); }
  .pg-state.review { color: #b97f1f; }
  .pg-state.block { color: #c2453a; }
  .pg-state.doing { color: var(--accent); }
  .pg-state.done { color: var(--done); }
  .pg-state.todo { color: var(--text-3); }
  .pg-state.cancel { color: var(--text-4); }
  @media (max-width: 860px) {
    .pg-edges { display: none; }
    .pg-cols { flex-direction: column; align-items: stretch; gap: 0; width: 100%; }
    .pg-col { flex-direction: row; flex-wrap: wrap; gap: 8px; max-height: none; }
    .pg-col + .pg-col { margin-top: 26px; position: relative; }
    .pg-col + .pg-col::before { content: "↓"; position: absolute; top: -22px; left: 14px; color: var(--text-3); font-size: 13px; }
    .pg-node { width: calc(50% - 4px); }
    .pg-node.is-join, .pg-node.is-root { width: 100%; }
  }

  /* ============ Agent 名片(modal) ============ */
  .agent-card .ac-head { display: flex; align-items: flex-start; gap: 12px; min-width: 0; }
  .agent-card .mav.ac-av { width: 44px; height: 44px; flex: 0 0 44px; font-size: 18px; border-radius: 12px; }
  .ac-name { display: flex; align-items: center; gap: 7px; font-size: 16px; font-weight: 700; color: var(--text); min-width: 0; }
  .ac-handle { font-family: var(--mono); font-size: 11.5px; color: var(--text-3); margin-top: 2px; overflow-wrap: anywhere; }
  .ac-tags { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .ac-tag { font-size: 10.5px; font-weight: 700; border-radius: 6px; padding: 1px 7px; background: var(--accent-tint); color: var(--accent); }
  .ac-facts { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border-soft); border-radius: 10px; overflow: hidden; margin: 4px 0 2px; }
  .ac-fact { padding: 10px 12px; background: var(--fill-1); border-right: 1px solid var(--border-soft); }
  .ac-fact:last-child { border-right: 0; }
  .ac-fact .v { font-size: 18px; font-weight: 780; color: var(--text); font-variant-numeric: tabular-nums; }
  .ac-fact .k { margin-top: 3px; font-size: 10.5px; color: var(--text-3); }
  .ac-sec { margin-top: 14px; }
  .ac-sec-title { display: flex; justify-content: space-between; font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .3px; margin-bottom: 6px; }
  .ac-rows { display: grid; gap: 4px; }
  .ac-row { display: flex; align-items: center; gap: 7px; min-height: 32px; padding: 4px 8px; border-radius: 8px; cursor: pointer; transition: .15s; }
  .ac-row:hover { background: var(--accent-tint); }
  .ac-row .ar-id { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); flex: 0 0 auto; }
  .ac-row .ar-t { min-width: 0; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12.5px; color: var(--text); }
  .ac-row .ar-when { font-family: var(--mono); font-size: 10px; color: var(--text-4); flex: 0 0 auto; }
  .ac-empty { font-size: 12px; color: var(--text-3); padding: 4px 2px; line-height: 1.6; }
  .ac-actions { display: flex; gap: 8px; margin-top: 16px; }
  .ac-btn {
    flex: 1; min-height: 34px; border-radius: 8px; border: 1px solid var(--border); background: #fff;
    font-family: inherit; font-size: 12.5px; font-weight: 600; color: var(--text-2); cursor: pointer; transition: .15s;
  }
  .ac-btn:hover { background: var(--fill-2); }
  .ac-btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .ac-btn.primary:hover { background: var(--accent-2); }
  .ac-unreported {
    margin-top: 14px; border: 1px dashed var(--border); border-radius: 10px; background: var(--fill-1);
    padding: 11px 12px; font-size: 12px; color: var(--text-3); line-height: 1.7;
  }

  /* ============ preference.md 提炼 ============ */
  .pref-file { display: flex; align-items: center; gap: 10px; border: 1px solid var(--border-soft); border-radius: 10px; background: var(--fill-1); padding: 10px 12px; margin-bottom: 10px; }
  .pref-file .pf-ic { width: 32px; height: 32px; flex: 0 0 32px; border-radius: 8px; background: #1c1c23; color: #fff; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }
  .pref-file .pf-main { min-width: 0; }
  .pref-file .pf-name { font-size: 13px; font-weight: 650; color: var(--text); overflow-wrap: anywhere; }
  .pref-file .pf-sub { margin-top: 2px; font-size: 11px; color: var(--text-3); }
  .pref-meta { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .pref-meta .pm { border: 1px solid var(--border-soft); border-radius: 9px; padding: 8px 11px; background: #fff; }
  .pref-meta .pm .k { font-size: 10.5px; color: var(--text-3); margin-bottom: 3px; }
  .pref-meta .pm .v { font-size: 12.5px; font-weight: 600; color: var(--text); }
  .pref-label { font-size: 11px; font-weight: 700; color: var(--text-3); letter-spacing: .3px; margin: 0 0 6px; display: flex; justify-content: space-between; align-items: center; }
  .pref-count { font-family: var(--mono); font-size: 11px; color: var(--text-3); font-weight: 500; }
  .pref-who { display: grid; gap: 5px; margin-bottom: 12px; }
  .pref-bot { display: flex; align-items: center; gap: 8px; border: 1px solid var(--border-soft); border-radius: 9px; padding: 7px 10px; cursor: pointer; transition: .15s; font-size: 12.5px; color: var(--text); }
  .pref-bot:hover { border-color: var(--accent-border); }
  .pref-bot.sel { border-color: var(--accent); background: var(--accent-tint); }
  .pref-bot .pb-radio { width: 14px; height: 14px; border-radius: 50%; border: 1.8px solid var(--border); flex: 0 0 14px; box-sizing: border-box; }
  .pref-bot.sel .pb-radio { border-color: var(--accent); background: radial-gradient(circle at center, var(--accent) 0 3.5px, transparent 4px); }
  .pref-confirm { font-size: 11.5px; color: var(--text-3); overflow-wrap: anywhere; }

  /* ============ 键盘帮助 ============ */
  .keys-help { display: grid; gap: 2px; padding: 4px 0 8px; }
  .keys-row { display: grid; grid-template-columns: 130px 1fr; align-items: center; gap: 14px; padding: 8px 2px; }
  .keys-row kbd { font-family: var(--mono); font-size: 12px; font-weight: 700; color: var(--text); background: var(--fill-2); border: 1px solid var(--border); border-radius: 6px; padding: 2px 8px; justify-self: start; white-space: nowrap; }
  .keys-row .kd { font-size: 13px; color: var(--text-2); }

  /* ============ toast ============ */
  .toast {
    position: fixed; bottom: 40px; left: 50%; transform: translateX(-50%) translateY(20px);
    max-width: min(560px, calc(100vw - 32px));
    background: #1f2330; color: #fff; font-size: 13px; font-weight: 500;
    padding: 11px 18px; border-radius: 10px; box-shadow: 0 8px 28px rgba(28,30,45,.3);
    opacity: 0; pointer-events: none; transition: .25s ease-out; z-index: 300;
    display: flex; align-items: center; gap: 8px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }
  .toast .ti { color: var(--accent-2); flex: 0 0 auto; }
  .toast.err .ti { color: #ff8a80; font-weight: 800; }
  .toast .toast-msg { min-width: 0; overflow-wrap: anywhere; }
  .toast .toast-x { margin-left: 4px; padding: 0 6px; border-radius: 6px; cursor: pointer; color: rgba(255,255,255,.75); }
  .toast .toast-x:hover { background: rgba(255,255,255,.18); color: #fff; }

  /* ============ 圈一笔 ============ */
  .im-fab {
    position: fixed; z-index: 30; display: none; align-items: center; gap: 6px;
    background: var(--panel); border: 1px solid var(--accent-border); border-radius: 8px;
    box-shadow: 0 4px 14px rgba(28,28,35,.14); padding: 6px 12px;
    font-size: 12.5px; font-weight: 600; color: var(--accent);
    cursor: pointer; user-select: none; -webkit-user-select: none;
  }
  .im-fab.show { display: inline-flex; }
  .im-fab:hover { background: var(--accent-tint); }
  .annot-box {
    position: fixed; z-index: 36; display: none; width: 360px; max-width: calc(100vw - 16px);
    background: var(--panel); border: 1px solid var(--border-soft); border-radius: 10px;
    box-shadow: 0 10px 32px rgba(28,28,35,.18); padding: 10px;
  }
  .annot-box.show { display: block; }
  .im-quote {
    background: var(--fill-2); border: 1px solid var(--border); border-radius: 6px;
    padding: 8px 10px; margin-bottom: 8px; max-height: 64px; overflow: hidden;
    font-size: 12.5px; color: var(--text-2); line-height: 1.6;
  }
  .annot-text {
    width: 100%; min-height: 54px; resize: none; border: 0; outline: none; border-radius: 8px;
    background: rgba(46,50,56,.05); color: var(--text); font-family: inherit; font-size: 13px; line-height: 1.6;
    padding: 8px 10px; box-sizing: border-box;
  }
  .annot-text:focus { box-shadow: 0 0 0 2px rgba(28,28,35,.08); }
  .annot-hint { font-size: 11px; color: var(--text-4); margin: 7px 0 8px; line-height: 1.5; }
  .annot-foot { display: flex; justify-content: flex-end; gap: 8px; }
  .annot-cancel {
    min-height: 30px; padding: 0 13px; border: 1px solid var(--border); border-radius: 999px;
    background: #fff; color: var(--text-2); font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .annot-cancel:hover { background: var(--fill-2); }
  .annot-send {
    flex: 0 0 auto; min-height: 30px; padding: 0 14px; border: 0; border-radius: 999px;
    background: #1c1c23; color: #fff; font-family: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .annot-send:hover { opacity: .9; }
  .annot-send:disabled { opacity: .5; }

  /* ============ 战绩 popover ============ */
  .agent-pop {
    position: fixed; z-index: 60; display: none; width: 300px; max-width: calc(100vw - 16px);
    background: var(--panel); border: 1px solid var(--border); border-radius: 12px;
    box-shadow: 0 14px 40px rgba(28,28,35,.18); padding: 12px;
  }
  .agent-pop.show { display: block; }
  .ap-head { display: flex; align-items: center; gap: 9px; margin-bottom: 8px; }
  .ap-head .mav { width: 28px; height: 28px; flex: 0 0 28px; font-size: 12px; }
  .ap-id { flex: 1; min-width: 0; }
  .ap-name { font-size: 13.5px; font-weight: 700; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ap-sub { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ap-x { width: 24px; height: 24px; flex: 0 0 24px; border: 0; background: transparent; border-radius: 6px; color: var(--text-3); font-size: 15px; cursor: pointer; }
  .ap-x:hover { background: var(--fill-3); color: var(--text); }
  .ap-nums { display: grid; grid-template-columns: repeat(3, 1fr); border: 1px solid var(--border-soft); border-radius: 10px; overflow: hidden; margin-bottom: 8px; }
  .ap-num { padding: 8px 10px; background: var(--fill-1); border-right: 1px solid var(--border-soft); }
  .ap-num:last-child { border-right: 0; }
  .ap-num .v { font-size: 16px; font-weight: 780; color: var(--text); font-variant-numeric: tabular-nums; }
  .ap-num .k { margin-top: 3px; font-size: 10.5px; color: var(--text-3); }
  .ap-recent { display: grid; gap: 4px; }
  .ap-rec-row {
    display: flex; align-items: center; gap: 7px; min-height: 30px; padding: 4px 7px;
    border-radius: 8px; cursor: pointer; transition: .15s;
  }
  .ap-rec-row:hover { background: var(--accent-tint); }
  .ap-rec-id { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); flex: 0 0 auto; }

<script>
"use strict";
/* Octo-Matter v2 工作台 — 单文件生产 UI。
   所有数据来自 ../api/v1(docs/v2-api.md);无任何内置假数据。 */

var API_BASE = "../api/v1";
/* ?embed=1:宿主(octo-web)自带全局导航,隐藏本应用最左侧图标栏,连接面板不再给登录页链接 */
var EMBED = /(?:^|[?&])embed=1(?:&|$)/.test(location.search.replace(/^\?/, ""));
function $(s, el){ return (el || document).querySelector(s); }
function $$(s, el){ return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s){
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function pad2(n){ return String(n).padStart(2, "0"); }

/* ---------------- auth ---------------- */
var auth = { token: "", uid: "", name: "", space: "" };
function loadAuth(){
  try {
    auth.token = localStorage.getItem("token") || "";
    auth.uid = localStorage.getItem("uid") || "";
    auth.name = localStorage.getItem("name") || "";
    auth.space = localStorage.getItem("currentSpaceId") || "";
  } catch (e) { /* storage 不可用时停留在连接面板 */ }
}
function authReady(){ return !!(auth.token && auth.space); }
/* octo-web 只把 token/uid/name 放进 localStorage(跨标签页白名单),
   currentSpaceId 是 WKApp 内存字段、不持久化 —— 所以新标签页只有 token。
   有 token 没空间时,直接问 octo-server 要空间列表(同源 /api/v1),
   取第一个并持久化;失败则停留在连接面板。 */
var spaceDiscovering = false;
function discoverSpace(){
  if (!auth.token || auth.space || spaceDiscovering) return Promise.resolve(false);
  spaceDiscovering = true;
  return fetch("/api/v1/space/my", { headers: { token: auth.token } }).then(function(res){
    if (!res.ok) throw new Error("space/my " + res.status);
    return res.json();
  }).then(function(list){
    if (Array.isArray(list) && list.length && list[0].space_id){
      try { localStorage.setItem("currentSpaceId", list[0].space_id); } catch (e) {}
      auth.space = list[0].space_id;
      return true;
    }
    return false;
  }).catch(function(){ return false; })
    .finally(function(){ spaceDiscovering = false; });
}
function isMe(uidStr){ return !!auth.uid && uidStr === auth.uid; }

/* ---------------- 空间成员名录(uid → 名字 / 是否机器人) ---------------- */
var members = { space: "", at: 0, map: {}, list: [], inflight: null };
var MEMBERS_TTL = 5 * 60e3; // 5 分钟懒刷新
function loadMembers(force){
  if (!authReady()) return Promise.resolve([]);
  if (members.space !== auth.space){ members = { space: auth.space, at: 0, map: {}, list: [], inflight: null }; }
  if (members.inflight) return members.inflight;
  if (!force && members.list.length && Date.now() - members.at < MEMBERS_TTL) return Promise.resolve(members.list);
  var p = fetch("/api/v1/space/" + encodeURIComponent(auth.space) + "/members?limit=200", {
    headers: { token: auth.token }
  }).then(function(res){
    if (!res.ok) throw new Error("members " + res.status);
    return res.json();
  }).then(function(json){
    var list = listData(json);
    var map = {};
    list.forEach(function(it){
      if (it && it.uid) map[it.uid] = { name: it.name || it.uid, robot: !!it.robot };
    });
    members = { space: auth.space, at: Date.now(), map: map, list: list, inflight: null };
    return list;
  }).catch(function(){
    members.inflight = null;
    members.at = Date.now(); // 拿不到名录就先用 uid 顶着,稍后再试
    return members.list;
  });
  members.inflight = p;
  return p;
}
function memberInfo(uidStr){ return members.map[uidStr] || null; }
function isBot(uidStr){ var mi = memberInfo(uidStr); return !!(mi && mi.robot); }
function aiTagHTML(uidStr){ return isBot(uidStr) ? '<span class="ai-tag">AI</span>' : ""; }
function uname(uidStr){
  if (!uidStr) return "";
  var mi = memberInfo(uidStr);
  if (mi && mi.name) return mi.name;
  if (isMe(uidStr) && auth.name) return auth.name;
  return uidStr;
}
/* bot 归属:成员名录若带 owner 字段就用它;一个都没带说明平台没暴露归属,known=false(不杜撰) */
function ownedBotInfo(){
  var known = false, owned = {};
  members.list.forEach(function(it){
    if (!it || !it.robot || !it.uid) return;
    var o = it.owner_uid || it.creator_uid || it.owner || it.created_by || it.master_uid || "";
    if (o) known = true;
    if (o && o === auth.uid) owned[it.uid] = true;
  });
  return { known: known, owned: owned };
}

/* ---------------- API ---------------- */
function apiError(status, code, message, details){
  var e = new Error(message);
  e.status = status; e.code = code; e.details = details;
  return e;
}
function api(path, opts){
  opts = opts || {};
  var url = new URL(API_BASE + path, location.href);
  if (opts.params){
    Object.keys(opts.params).forEach(function(k){
      var v = opts.params[k];
      if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
    });
  }
  var headers = {};
  if (auth.token) headers["token"] = auth.token;
  if (auth.space) headers["X-Space-Id"] = auth.space;
  var init = { method: opts.method || "GET", headers: headers };
  if (opts.body !== undefined){
    headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  return fetch(url.toString(), init).catch(function(){
    throw apiError(0, "NETWORK", "连不上事项服务,稍后再试");
  }).then(function(res){
    if (res.status === 204) return null;
    return res.text().then(function(text){
      var json = null;
      if (text){ try { json = JSON.parse(text); } catch (e) { json = null; } }
      if (!res.ok){
        if (res.status === 401) showConnect("登录态失效了 — 重新登录主应用,或手动填一次");
        var ei = (json && json.error) || {};
        throw apiError(res.status, ei.code || ("HTTP_" + res.status),
          ei.message || ("请求失败(" + res.status + ")"), ei.details);
      }
      return json;
    });
  });
}
function listData(json){
  if (!json) return [];
  if (Array.isArray(json)) return json;
  if (Array.isArray(json.data)) return json.data;
  if (Array.isArray(json.items)) return json.items;
  return [];
}
function pageInfo(json){ return (json && json.pagination) || {}; }

/* ---------------- toast ---------------- */
var toastTimer = null;
function toast(msg, opts){
  opts = opts || {};
  var t = $("#toast");
  t.className = "toast show" + (opts.err ? " err" : "");
  t.innerHTML = (opts.err ? '<span class="ti">!</span>' : (opts.icon ? '<span class="ti">' + esc(opts.icon) + "</span>" : ""))
    + '<span class="toast-msg">' + esc(msg) + "</span>"
    + (opts.err ? '<span class="toast-x" id="toastX" role="button">×</span>' : "");
  if (opts.title) t.setAttribute("title", opts.title); else t.removeAttribute("title");
  var x = $("#toastX");
  if (x) x.onclick = function(){ t.classList.remove("show"); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, opts.err ? 8000 : (opts.ms || 2200));
}
function errToast(e){
  toast((e && e.message) || "出错了", { err: true, title: (e && e.code) || "" });
}

/* ---------------- format ---------------- */
function fmtTime(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  var now = new Date();
  var diff = now.getTime() - t.getTime();
  if (diff >= 0 && diff < 60e3) return "刚刚";
  if (diff >= 0 && diff < 3600e3) return Math.floor(diff / 60e3) + " 分钟前";
  if (t.toDateString() === now.toDateString()) return pad2(t.getHours()) + ":" + pad2(t.getMinutes());
  var y = t.getFullYear() === now.getFullYear() ? "" : (t.getFullYear() + "-");
  return y + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate());
}
function fmtFull(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  return t.getFullYear() + "-" + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate()) + " " + pad2(t.getHours()) + ":" + pad2(t.getMinutes());
}
function fmtDate(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  return t.getFullYear() + "-" + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate());
}
function fmtShortDate(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  var md = (t.getMonth() + 1) + "/" + pad2(t.getDate());
  return t.getFullYear() === new Date().getFullYear() ? md : t.getFullYear() + "/" + md;
}
function fmtYM(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  return t.getFullYear() + "-" + pad2(t.getMonth() + 1);
}
function fmtSize(n){
  n = +n;
  if (!n || isNaN(n)) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function firstLine(s){
  s = String(s || "");
  var i = s.indexOf("\n");
  return i < 0 ? s : s.slice(0, i);
}
var AV_COLORS = ["#5b8def", "#7c6cf0", "#1f9a7a", "#d26a2c", "#bd4a7a", "#3d65d8", "#0f8f74", "#a35bc9"];
function avColor(uidStr){
  var n = 0, s = String(uidStr || "");
  for (var i = 0; i < s.length; i++) n = (n + s.charCodeAt(i) * 7) % 9973;
  return AV_COLORS[n % AV_COLORS.length];
}
function avInitial(uidStr){
  var s = String(uidStr || "").trim();
  if (!s) return "·";
  var m = s.match(/[A-Za-z0-9一-龥]/);
  return (m ? m[0] : s.charAt(0)).toUpperCase();
}
function av(uidStr, cls){
  return '<span class="mav ' + (cls || "") + '" style="background:' + avColor(uidStr) + '" title="' + esc(uidStr) + '">' + esc(avInitial(uname(uidStr))) + "</span>";
}
function avChip(uidStr){
  return '<span class="pv-assignee" data-uid="' + esc(uidStr) + '" title="' + esc(uidStr) + ' · 看战绩">'
    + av(uidStr) + '<span class="nm">' + esc(uname(uidStr)) + "</span>" + aiTagHTML(uidStr) + "</span>";
}
/* 小图标(描边风,跟原型一致) */
var CHAT_SVG = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" style="flex:0 0 auto"><path d="M2.5 3.5h11v7.2h-6.2L4.6 13v-2.3H2.5z"/></svg>';
var CAL_SVG = '<svg viewBox="0 0 16 16" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round" style="flex:0 0 auto"><rect x="2.5" y="3.5" width="11" height="10" rx="1.5"/><path d="M2.5 6.5h11M5.5 2v2.5M10.5 2v2.5"/></svg>';
var LINK_SVG = '<svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" style="flex:0 0 auto"><path d="M6.5 9.5l3-3M5 7l-1.6 1.6a2.4 2.4 0 0 0 3.4 3.4L8.4 10.4M11 9l1.6-1.6a2.4 2.4 0 0 0-3.4-3.4L7.6 5.6"/></svg>';
function seqLabel(m){
  if (m && (m.seq_no || m.seq_no === 0)) return "M-" + m.seq_no;
  return m && m.id ? String(m.id).slice(0, 8) : "";
}

/* ---------------- 状态词表(exact) ---------------- */
var ST = {
  open:        { name: "待办",   pill: "gray",     ring: "todo" },
  in_progress: { name: "进行中", pill: "progress", ring: "doing" },
  review:      { name: "审核中", pill: "amber",    ring: "review" },

/* ================= INBOX ================= */
var inboxTab = "all";
var inboxSearch = "";
var inboxState = null; // { rows, page, params, key }
var expandedRows = {};
var INBOX_TABS = [
  { k: "all", hash: "#/inbox", label: "全部", title: "收件箱" },
  { k: "mine", hash: "#/mine", label: "我负责的", title: "我负责的" },

  { k: "review", hash: "#/review-me", label: "待确认", title: "待确认" }
];
function tabInfo(k){
  return INBOX_TABS.find(function(t){ return t.k === k; }) || INBOX_TABS[0];
}
function inboxParams(tab){
  if (tab === "mine") return { top_level: 1, leader_id: auth.uid || "me", limit: 50 };
  if (tab === "initiated") return { top_level: 1, creator_id: "me", limit: 50 };

}
/* 四个 tab 的计数:各拉一页(≤50)数出来 —— 没有计数接口,超过一页就显示 50+ */
function fetchTabCounts(){
  if (cache.tabCounts && Date.now() - cache.tabCounts.at < 60e3) return Promise.resolve(cache.tabCounts.counts);
  return Promise.all(INBOX_TABS.map(function(t){
    return api("/matters", { params: inboxParams(t.k) }).then(function(json){
      return { n: listData(json).length, more: !!pageInfo(json).has_more };
    }).catch(function(){ return null; });
  })).then(function(res){
    var counts = {};
    INBOX_TABS.forEach(function(t, i){ if (res[i]) counts[t.k] = res[i]; });
    cache.tabCounts = { at: Date.now(), counts: counts };
    var rv = counts.review;
    setNavBadge(rv ? rv.n : 0);
    return counts;
  });
}
function tabCountHTML(t, active, liveN){
  var c = (cache.tabCounts && cache.tabCounts.counts[t.k]) || null;
  var n = c ? c.n : (active ? liveN : null);
  if (n === null || n === undefined) return "";
  var txt = (c && c.more) ? "50+" : String(n);
  if (t.k === "review" && n > 0) return '<span class="tab-badge">' + txt + "</span>";
  return '<span class="inbox-filter-count">' + txt + "</span>";
}
function renderInbox(my, tab){
  if (tab) inboxTab = tab;
  var info = tabInfo(inboxTab);
  setNav("inbox");
  hideInspector();
  setCrumbText(info.title);
  $("#centerCol").innerHTML = listSkeleton(info.title);
  var params = inboxParams(inboxTab);
  return Promise.all([
    api("/matters", { params: params }),
    loadMembers().catch(function(){ return []; }),
    getProjects().catch(function(){ return []; })
  ]).then(function(res){
    if (my !== renderToken) return;
    inboxState = { rows: listData(res[0]).map(normMatter), page: pageInfo(res[0]), params: params, key: inboxTab };
    paintInbox(my);
    fetchTabCounts().then(function(){
      if (my !== renderToken) return;
      // 计数到了就把 tab 上的数字补上(原位更新,不打断输入)
      $$(".inbox-filter").forEach(function(el){
        var t = tabInfo(el.getAttribute("data-tab"));
        var active = inboxTab === t.k;
        var slot = $(".tab-cnt-slot", el);
        if (slot) slot.innerHTML = tabCountHTML(t, active, inboxState ? inboxState.rows.length : 0);
      });
    });
  });
}
function sortRows(rows){
  return rows.slice().sort(function(a, b){
    var t = (isTerminalRow(a) ? 1 : 0) - (isTerminalRow(b) ? 1 : 0);
    if (t) return t;
    return new Date(b.updated_at || 0).getTime() - new Date(a.updated_at || 0).getTime();
  });
}
function matchSearch(m, q){
  if (!q) return true;
  return (String(m.title || "") + " " + seqLabel(m)).toLowerCase().indexOf(q) >= 0;
}
function rowHTML(m, opts){
  opts = opts || {};
  // 乐观显示展开箭头:探测过且确实没有子事项的行,箭头才消失(贴近原型 05 的观感)
  var probed = cache.children[m.id];
  var canExpand = !opts.child && !opts.noExpand && !opts.flat && !m.parent_matter_id
    && !(probed !== undefined && !probed.length);
  var isOpen = !!expandedRows[m.id];
  var exp = canExpand
    ? '<button class="row-exp" type="button" data-expand="' + esc(m.id) + '" title="看子事项" aria-expanded="' + isOpen + '">' + (isOpen ? "▾" : "▸") + "</button>"
    : "";
  var leader = m.leader || m.assignees[0] || "";
  var pj = m.project_id ? '<span class="m-project">' + esc(projName(m.project_id) || "项目") + "</span>" : "";
  var src = m.source_name
    ? '<span class="m-dotsep">·</span><span class="src-chip" data-src="' + esc(m.source_name) + '" title="来源会话" role="button">' + CHAT_SVG + '<span class="sc-nm">' + esc(m.source_name) + "</span></span>"
    : "";
  return '<div class="mrow' + (opts.child ? " m-child" : "") + (canExpand ? " has-kids" : "") + '" data-id="' + esc(m.id) + '" data-status="' + esc(m.status) + '" role="link" tabindex="0" aria-label="' + esc(m.title) + '">'
    + exp
    + '<span class="m-main">'
    + '<span class="m-title" title="' + esc(m.title) + '">' + esc(m.title) + "</span>"
    + '<span class="m-subline">'
    + '<span class="m-inline-pill">' + pillHTML(m.status) + "</span>"
    + pj + src
    + "</span></span>"
    + '<span class="m-codecol">' + esc(seqLabel(m)) + "</span>"
    + '<span class="m-assignee">' + (leader ? avChip(leader) : '<span class="m-noone">没人接</span>') + "</span>"
    + '<span class="m-datecol" title="创建于 ' + esc(fmtFull(m.created_at)) + '">' + esc(fmtShortDate(m.created_at)) + "</span>"
    + "</div>";
}
function rowsWithChildren(rows, q){
  var html = "";
  var flat = inboxTab === "review";
  rows.forEach(function(m){
    html += rowHTML(m, { flat: flat });
    if (!flat && expandedRows[m.id]){
      var kids = cache.children[m.id];
      if (kids === undefined){
        html += '<div class="mrow m-none m-child">读取中…</div>';
      } else if (kids.length){
        sortRows(kids).forEach(function(k){
          html += rowHTML(k, { child: true, noExpand: true });
        });
      }
    }
  });
  return html;
}
function paintInbox(my){
  if (!inboxState) return;
  var info = tabInfo(inboxTab);
  var q = inboxSearch.trim().toLowerCase();
  var rows = sortRows(inboxState.rows.filter(function(m){ return matchSearch(m, q); }));
  var tabs = INBOX_TABS.map(function(t){
    var active = inboxTab === t.k;
    return '<div class="inbox-filter' + (active ? " active" : "") + '" data-tab="' + t.k + '" role="tab" tabindex="0" aria-selected="' + active + '">'
      + "<span>" + t.label + '</span><span class="tab-cnt-slot">' + tabCountHTML(t, active, inboxState.rows.length) + "</span></div>";
  }).join("");
  var empty = q
    ? '<div class="empty-state"><div class="es-t">未找到相关事项</div><div class="es-s">换个词试试,或清空搜索</div></div>'
    : inboxEmpty(inboxTab);

    ? '<button class="load-more" id="loadMore" type="button">加载更多</button>' : "";
  $("#centerCol").innerHTML = '<div class="content"><div class="content-inner wide inbox-page">'
    + '<div class="list-head"><div class="list-title">' + esc(info.title) + '</div><button class="new-btn" id="newMatterBtn" type="button">+ 新建</button></div>'
    + '<div class="list-sub">' + esc(info.label) + " · " + inboxState.rows.length + " 个事项" + (inboxState.page.has_more ? " · 还有更多" : "") + "</div>"
    + '<div class="inbox-toolbar"><div class="inbox-filterbar" role="tablist">' + tabs + "</div>"
    + '<input class="list-search" id="listSearch" type="search" placeholder="搜索标题或编号" value="' + esc(inboxSearch) + '" aria-label="搜索事项"></div>'
    + (rows.length ? '<div class="inbox-table-head" aria-hidden="true"><span>事项</span><span>编号</span><span>负责人</span><span>创建</span></div>' : "")
    + '<div class="mlist">' + (rows.length ? rowsWithChildren(rows, q) : empty) + "</div>"
    + more + "</div></div>";
  bindInbox(my);
}
function inboxEmpty(tab){

    all: { t: "还没有事项", s: "点右上「新建」,把第一件事立起来" },
    mine: { t: "没有你负责的事", s: "" },

function toggleExpand(id, btn){
  if (expandedRows[id]){ delete expandedRows[id]; repaintList(); return; }

function silentFor(m){
  var ref = m.last_activity_at || m.updated_at;
  if (!ref) return "";
  var mins = Math.max(0, Math.round((Date.now() - new Date(ref).getTime()) / 60e3));
  if (mins < 1) return "刚刚还有动静";
  var span = mins >= 2880 ? (Math.round(mins / 1440) + " 天") : mins >= 120 ? (Math.round(mins / 60) + " 小时") : (mins + " 分钟");
  return "已经 " + span + " 没动静";
}
function boardCardHTML(m){
  var who = m.leader || m.assignees[0] || "";
  var others = m.assignees.filter(function(u){ return u !== who; }).length;
  var block = m.status === "blocked"
    ? '<div class="bc-block-line" title="' + esc(m.block_reason_text || "") + '">● ' + esc(silentFor(m) || "卡住了") + "</div>" : "";
  var src = m.source_name ? '<div class="bc-src">' + CHAT_SVG + '<span class="sc-nm">' + esc(m.source_name) + "</span></div>" : "";
  return '<div class="bcard" draggable="true" data-id="' + esc(m.id) + '" role="link" tabindex="0">'
    + '<div class="bc-card-top"><span class="bc-card-id">' + esc(seqLabel(m)) + '</span><span class="bc-date" title="创建于 ' + esc(fmtFull(m.created_at)) + '">' + CAL_SVG + esc(fmtShortDate(m.created_at)) + "</span></div>"
    + '<div class="bc-title" title="' + esc(m.title) + '">' + esc(m.title) + "</div>" + block
    + '<div class="bc-people"><span class="bc-person-value">'
    + (who ? '<span data-uid="' + esc(who) + '" style="display:inline-flex;align-items:center;gap:4px;min-width:0">' + av(who) + '<span class="nm">' + esc(uname(who)) + "</span>" + aiTagHTML(who) + "</span>" : '<span class="m-noone">没人接</span>')
    + (others > 0 ? '<span class="bc-plus">等 ' + (others + 1) + " 人</span>" : "")
    + "</span>" + src + "</div></div>";
}
function paintBoard(my){
  boardRows = boardAll.filter(function(m){
    if (boardProject && m.project_id !== boardProject) return false;
    if (boardLeader && (m.leader || "") !== boardLeader) return false;
    return true;
  });
  var leaders = [];
  boardAll.forEach(function(m){ if (m.leader && leaders.indexOf(m.leader) < 0) leaders.push(m.leader); });
  if (boardLeader && leaders.indexOf(boardLeader) < 0) leaders.unshift(boardLeader);
  var cols = BOARD_COLS.map(function(c){
    var cards = boardRows.filter(function(m){ return m.status === c.st; });
    return '<div class="board-col ' + c.cls + '" data-status="' + c.st + '">'
      + '<div class="board-col-h"><span class="bc-dot"></span>' + esc(stName(c.st)) + '<span class="bc-cnt">' + cards.length + "</span>"
      + '<button class="bc-add" type="button" data-addcol="' + c.st + '" title="新建事项">+</button></div>'
      + '<div class="board-cards">' + (cards.map(boardCardHTML).join("") || '<div class="board-empty">没有事项</div>') + "</div></div>";
  }).join("");
  var projOpts = '<option value="">全部项目</option>' + liveProjects().map(function(p){
    return '<option value="' + esc(p.id) + '"' + (boardProject === p.id ? " selected" : "") + ">" + esc(p.name) + "</option>";
  }).join("");
  var leaderOpts = '<option value="">全部负责人</option>' + leaders.map(function(u){
    return '<option value="' + esc(u) + '"' + (boardLeader === u ? " selected" : "") + ">" + esc(uname(u)) + "</option>";
  }).join("");
  $("#centerCol").innerHTML = '<div class="content"><div class="content-inner wide inbox-page">'
    + '<div class="list-head"><div class="list-title">看板</div>'
    + '<div class="board-actions">'
    + '<select class="board-sel" id="boardProjSel" aria-label="按项目筛">' + projOpts + "</select>"
    + '<select class="board-sel" id="boardLeaderSel" aria-label="按负责人筛">' + leaderOpts + "</select>"
    + "</div></div>"
    + '<div class="list-sub">按状态分列 · ' + boardRows.length + "/" + boardAll.length + " 个事项" + (boardPage.has_more ? " · 只载入了前 100" : "") + "</div>"
    + '<div class="board-wrap">' + cols + "</div></div></div>";
  bindBoard(my);
}
function bindBoard(my){
  var ps = $("#boardProjSel");
  if (ps) ps.addEventListener("change", function(){ boardProject = ps.value; paintBoard(my); });
  var lsel = $("#boardLeaderSel");
  if (lsel) lsel.addEventListener("change", function(){ boardLeader = lsel.value; paintBoard(my); });
  $$("[data-addcol]").forEach(function(el){
    el.addEventListener("click", function(e){
      e.stopPropagation();
      openMatterModal({ projectId: boardProject || "" });
    });
  });
  $$(".bcard").forEach(function(el){
    el.addEventListener("click", function(){ location.hash = "#/matter/" + el.getAttribute("data-id"); });
    el.addEventListener("dragstart", function(e){
      e.dataTransfer.setData("text/plain", el.getAttribute("data-id"));
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", function(){ el.classList.remove("dragging"); });
  });
  $$(".board-col").forEach(function(col){
    col.addEventListener("dragover", function(e){ e.preventDefault(); col.classList.add("drop-over"); });
    col.addEventListener("dragleave", function(){ col.classList.remove("drop-over"); });
    col.addEventListener("drop", function(e){
      e.preventDefault();
      col.classList.remove("drop-over");
      dropCard(my, e.dataTransfer.getData("text/plain"), col.getAttribute("data-status"));
    });
  });
}
function dropCard(my, id, target){
  var m = boardAll.find(function(x){ return x.id === id; });
  if (!m || !target || m.status === target) return;
  var go = function(reason){
    var prev = m.status;
    m.status = target;           // 乐观挪卡
    paintBoard(my);
    var body = { status: target, expected_version: m.version };
    if (reason) body.reason = reason;
    api("/matters/" + m.id + "/status", { method: "PUT", body: body }).then(function(detail){
      var fresh = normMatter(detail);
      if (fresh && fresh.id){
        var i = boardAll.indexOf(m);
        if (i >= 0) boardAll[i] = fresh;
      }
      if (my === renderToken) paintBoard(my);
      toast("已挪到「" + stName(target) + "」");
    }).catch(function(err){
      m.status = prev;           // 失败弹回
      if (err.status === 409){
        toast("被人改过了,已刷新", { err: true, title: err.code || "" });
        renderBoard(++renderToken).catch(errToast);
      } else {
        errToast(err);
        if (my === renderToken) paintBoard(my);
      }
    });
  };
  if (target === "blocked"){
    askReason().then(function(reason){
      if (reason === null){ paintBoard(my); return; }
      go(reason);
    });
  } else {
    go("");
  }
}

/* ================= AUTOMATION ================= */
var WDCN = ["日", "一", "二", "三", "四", "五", "六"];
function cronHuman(expr){
  var r = parseCronSimple(expr);
  if (!r) return "";
  var t = pad2(r.hh) + ":" + pad2(r.mm);
  if (r.kind === "daily") return "每天 " + t;
  if (r.kind === "weekdays") return "每个工作日 " + t;
  if (r.kind === "weekly") return "每周" + WDCN[r.dow] + " " + t;
  if (r.kind === "monthly") return "每月 " + r.dom + " 号 " + t;
  return "";
}
/* 只认四种简单形状:每天 / 工作日 / 每周X / 每月X号;其余进「高级」原样保留 */
function parseCronSimple(expr){
  var p = String(expr || "").trim().split(/\s+/);
  if (p.length !== 5) return null;
  var mi = p[0], h = p[1], dom = p[2], mon = p[3], dow = p[4];
  if (!/^\d{1,2}$/.test(mi) || !/^\d{1,2}$/.test(h)) return null;
  var mm = +mi, hh = +h;
  if (mm > 59 || hh > 23 || mon !== "*") return null;
  if (dom === "*" && dow === "*") return { kind: "daily", hh: hh, mm: mm };
  if (dom === "*" && dow === "1-5") return { kind: "weekdays", hh: hh, mm: mm };
  if (dom === "*" && /^[0-7]$/.test(dow)) return { kind: "weekly", dow: (+dow) % 7, hh: hh, mm: mm };
  if (dow === "*" && /^\d{1,2}$/.test(dom) && +dom >= 1 && +dom <= 31) return { kind: "monthly", dom: +dom, hh: hh, mm: mm };
  return null;
}
function buildCron(rep, hh, mm){
  if (rep.kind === "weekdays") return mm + " " + hh + " * * 1-5";
  if (rep.kind === "weekly") return mm + " " + hh + " * * " + rep.dow;
  if (rep.kind === "monthly") return mm + " " + hh + " " + rep.dom + " * *";
  return mm + " " + hh + " * * *";
}
function repLabel(rep){
  if (rep.kind === "weekdays") return "每个工作日";
  if (rep.kind === "weekly") return "每周" + WDCN[rep.dow];
  if (rep.kind === "monthly") return "每月 " + rep.dom + " 号";
  return "每天";
}
function nextRunPreview(rep, hh, mm){
  var now = new Date();
  var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
  var ok = function(dt){
    if (rep.kind === "weekdays") return dt.getDay() >= 1 && dt.getDay() <= 5;
    if (rep.kind === "weekly") return dt.getDay() === rep.dow;
    if (rep.kind === "monthly") return dt.getDate() === rep.dom;
    return true;
  };
  for (var i = 0; i < 380; i++){
    if (t.getTime() > now.getTime() && ok(t)) return t;
    t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1, hh, mm, 0, 0);
  }
  return null;
}
function fmtNextRun(t){
  if (!t) return "";
  var now = new Date();
  var hm = pad2(t.getHours()) + ":" + pad2(t.getMinutes());
  var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dd = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - d0) / 86400e3);
  if (dd === 0) return "今天 " + hm;
  if (dd === 1) return "明天 " + hm;
  if (dd < 7) return "周" + WDCN[t.getDay()] + " " + hm;
  return (t.getMonth() + 1) + "/" + pad2(t.getDate()) + " " + hm;
}
function fmtFuture(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  return t.getTime() > Date.now() ? fmtNextRun(t) : fmtTime(iso);
}

}

function openRepeatMenu(anchor, d, onDone){
  var top = [
    { v: "daily", t: "每天" },
    { v: "weekdays", t: "每个工作日" },
    { v: "weekly", t: "每周(选星期几)" },
    { v: "monthly", t: "每月(选几号)" }
  ];
  var html = top.map(function(o){
    var sel = d.rep.kind === o.v;
    return '<div class="fm-item' + (sel ? " sel" : "") + '" data-val="' + o.v + '"><span class="nm">' + o.t + '</span><span class="fm-check">' + (sel ? "✓" : "") + "</span></div>";
  }).join("");
  openFloatMenu(anchor, html, { onPick: function(v){
    if (v === "daily" || v === "weekdays"){ d.rep.kind = v; onDone(); return; }
    if (v === "weekly"){
      setTimeout(function(){
        var wd = WDCN.map(function(w, i){
          var sel = d.rep.kind === "weekly" && d.rep.dow === i;
          return '<div class="fm-item' + (sel ? " sel" : "") + '" data-val="' + i + '"><span class="nm">每周' + w + '</span><span class="fm-check">' + (sel ? "✓" : "") + "</span></div>";
        }).join("");
        openFloatMenu(anchor, wd, { onPick: function(v2){ d.rep.kind = "weekly"; d.rep.dow = +v2; onDone(); } });
      }, 0);
      return;
    }
    if (v === "monthly"){
      setTimeout(function(){
        var days = "";
        for (var i = 1; i <= 31; i++){
          var sel = d.rep.kind === "monthly" && d.rep.dom === i;
          days += '<div class="fm-item' + (sel ? " sel" : "") + '" data-val="' + i + '"><span class="nm">' + i + ' 号</span><span class="fm-check">' + (sel ? "✓" : "") + "</span></div>";
        }
        openFloatMenu(anchor, days, { onPick: function(v2){ d.rep.kind = "monthly"; d.rep.dom = +v2; onDone(); },
          afterOpen: function(fm){ var selEl = $(".fm-item.sel", fm); if (selEl) selEl.scrollIntoView({ block: "center" }); } });
      }, 0);
      return;
    }
  } });
}
function openTimeMenu(anchor, current, onPick){
  var html = "";
  for (var h = 0; h < 24; h++){
    for (var q = 0; q < 4; q++){
      var t = pad2(h) + ":" + pad2(q * 15);
      var sel = t === current;
      html += '<div class="fm-item' + (sel ? " sel" : "") + '" data-val="' + t + '"><span class="nm" style="font-family:var(--mono)">' + t + '</span><span class="fm-check">' + (sel ? "✓" : "") + "</span></div>";
    }
  }
  openFloatMenu(anchor, html, { onPick: function(v){ onPick(v); },
    afterOpen: function(fm){
      var selEl = $(".fm-item.sel", fm);
      if (selEl) selEl.scrollIntoView({ block: "center" });
    } });
}

/* ---- 计划图(几何即语义,移植原型 planNodes/renderCollab/drawPlanEdges,数据来自 GET /matters/:id/tree) ---- */
var PG_RING = { open: "todo", in_progress: "doing", review: "review", done: "done", blocked: "block", cancelled: "cancel", archived: "cancel" };
var PG_STATE_TEXT = { open: "待办", in_progress: "进行中", review: "待确认", done: "已交回", blocked: "受阻", cancelled: "取消", archived: "归档" };
function pgAsgHTML(uid){

function pgChildNodeHTML(k, deps){

    + '<div class="pg-state ' + ring + '">' + esc(PG_STATE_TEXT[k.status] || stName(k.status)) + "</div></div>";
}
function planGraphHTML(m, kids, tv){
  var leader = m.leader || m.creator_id || "";
  var pipeline = ((tv && tv.mode) || m.mode) === "pipeline";
  var rootId = "__plan_root", joinId = "__plan_join";
  var liveKids = kids.filter(function(k){ return k.status !== "cancelled" && k.status !== "archived"; });
  var doneN = liveKids.filter(function(k){ return k.status === "done"; }).length;
  var allBack = liveKids.length > 0 && doneN === liveKids.length;
  var root = '<div class="pg-node is-root st-done" data-pgid="' + rootId + '">'
    + '<div class="pg-top"><span class="pg-dot done"></span><span class="pg-role-tag">带队</span></div>'
    + '<div class="pg-title">把活拆成 ' + kids.length + " 份</div>"
    + pgAsgHTML(leader)
    + '<div class="pg-state done">已 @ ' + kids.length + " 路</div></div>";
  // join 状态只来自 tree 的 barrier_state/join_ready 与真实状态,不杜撰
  var barrier = (tv && tv.barrier_state) || "";
  var joinReady = !!(tv && tv.join_ready);
  var jring, jtext;
  if (m.status === "done" || barrier === "joined"){ jring = "done"; jtext = "已完成"; }
  else if (joinReady || allBack || barrier === "ready" || barrier === "merging"){ jring = "review"; jtext = "子事项已齐"; }
  else { jring = "todo"; jtext = "等待中"; }
  var joinDeps = pipeline ? [kids.length ? kids[kids.length - 1].id : rootId] : kids.map(function(k){ return k.id; });
  var join = '<div class="pg-node is-join st-' + jring + '" data-pgid="' + joinId + '" data-deps="' + esc(joinDeps.join(",")) + '">'
    + '<div class="pg-top"><span class="pg-dot ' + jring + '"></span><span class="pg-role-tag">汇总</span></div>'
    + '<div class="pg-title">@' + esc(uname(leader)) + " 汇总</div>"
    + pgAsgHTML(leader)
    + '<div class="pg-state ' + jring + '">' + jtext + "</div></div>";
  var cols;
  if (pipeline){
    cols = ['<div class="pg-col">' + root + "</div>"]
      .concat(kids.map(function(k, i){
        return '<div class="pg-col">' + pgChildNodeHTML(k, [i ? kids[i - 1].id : rootId]) + "</div>";
      }))
      .concat(['<div class="pg-col">' + join + "</div>"]);
  } else {
    cols = ['<div class="pg-col">' + root + "</div>",
      '<div class="pg-col">' + kids.map(function(k){ return pgChildNodeHTML(k, [rootId]); }).join("") + "</div>",
      '<div class="pg-col">' + join + "</div>"];
  }
  return '<div class="plan-graph"><svg class="pg-edges" aria-hidden="true"></svg><div class="pg-cols">' + cols.join("") + "</div></div>";
}
function planOverviewHTML(m, kids, tv){
  var liveKids = kids.filter(function(k){ return k.status !== "cancelled" && k.status !== "archived"; });
  var total = liveKids.length, doneN = liveKids.filter(function(k){ return k.status === "done"; }).length;
  var pct = total ? Math.round(doneN / total * 100) : 0;
  var leader = uname(m.leader || m.creator_id || "");
  var tone = "", title;
  if (m.status === "done"){ tone = "done"; title = "已完成"; }
  else if (m.status === "blocked"){ tone = "block"; title = "受阻" + (m.block_reason_text ? " · " + m.block_reason_text : ""); }
  else if ((tv && tv.join_ready) || (total && doneN === total)){ tone = "taste"; title = "子事项已齐"; }
  else { title = doneN + "/" + total + " 子事项已回"; }
  return '<div class="plan-overview ' + tone + '">'
    + '<div class="po-left"><span class="po-dot"></span><div>'
    + '<div class="po-eyebrow">@ ' + kids.length + " 路 · 汇总 @" + esc(leader) + "</div>"
    + '<div class="po-title">' + esc(title) + "</div></div></div>"
    + '<div class="po-meter"><span class="po-num">' + doneN + "/" + total + '</span><span class="po-bar"><span style="width:' + pct + '%"></span></span></div></div>';
}
function subsBlockHTML(m){
  var kids = treeChildren();
  var tv = (cur.tree && cur.tree.ok && cur.tree.v) || null;
  var mode = (tv && tv.mode) || m.mode || "";
  var modeTag = mode ? '<span class="mode-tag" title="mode: ' + esc(mode) + '">' + esc(modeLabel(mode) || mode) + "</span>" : "";
  var addBtn = '<button class="sub-add" id="subAddBtn" type="button">+ 派一个子任务</button>';
  if (kids === null){
    var te = cur.tree && cur.tree.e;
    return '<div class="block" id="subsBlock"><div class="sec"><span class="sec-l">计划 ' + modeTag + "</span></div>"
      + '<div class="trail-empty">子任务读取失败' + (te && te.message ? ":" + esc(te.message) : "") + "</div>" + addBtn + "</div>";
  }

      + '<div class="trail-empty">还没往下派活</div>' + addBtn + "</div>";
  }
  kids = kids.slice().sort(function(a, b){
    var d = (a.step_order || 0) - (b.step_order || 0);
    return d !== 0 ? d : ((a.seq_no || 0) - (b.seq_no || 0));
  });
  var liveKids = kids.filter(function(k){ return k.status !== "cancelled" && k.status !== "archived"; });
  var doneN = liveKids.filter(function(k){ return k.status === "done"; }).length;
  return '<div class="block" id="subsBlock">'

    + '<div class="plan-shell">' + planOverviewHTML(m, kids, tv) + planGraphHTML(m, kids, tv) + "</div>"
    + addBtn + "</div>";
}
/* 连线:渲染后量取节点位置画贝塞尔;resize 重画(纯呈现) */
function drawPlanEdges(){
  $$(".plan-graph").forEach(function(g){
    var svg = $(".pg-edges", g);
    if (!svg) return;
    var gr = g.getBoundingClientRect();
    if (!gr.width) return;
    var w = Math.max(g.scrollWidth, gr.width), h = Math.max(g.scrollHeight, gr.height);
    svg.setAttribute("viewBox", "0 0 " + w + " " + h);
    svg.setAttribute("width", w);
    svg.setAttribute("height", h);
    var sl = g.scrollLeft, stp = g.scrollTop;
    var pos = function(el){
      var r = el.getBoundingClientRect();
      return { l: r.left - gr.left + sl, r: r.right - gr.left + sl, cy: r.top - gr.top + stp + r.height / 2 };
    };
    var paths = "";
    $$(".pg-node[data-deps]", g).forEach(function(node){
      var deps = (node.getAttribute("data-deps") || "").split(",").filter(Boolean);
      var np = pos(node);
      deps.forEach(function(did){
        var sel = (window.CSS && CSS.escape) ? CSS.escape(did) : did.replace(/"/g, "");
        var dn = $('.pg-node[data-pgid="' + sel + '"]', g);
        if (!dn) return;
        var dp = pos(dn);
        var dx = Math.max(20, (np.l - dp.r) * 0.45);

function controlLine(m){

  if (m.status === "in_progress") return { cls: "", label: "处理中", main: doer ? ("已 @ " + doer + " · 正在做") : "正在做 — 还没人认领" };
  if (m.status === "review"){
    if (isMe(m.creator_id)) return { cls: "taste", label: "该你了", main: "该你了 — 待你品鉴" };
    return { cls: "taste", label: "待品鉴", main: "等 " + uname(m.creator_id) + " 品鉴" };
  }
  if (m.status === "blocked") return { cls: "block", label: "受阻", main: "卡住了:" + (m.block_reason_text || "没说原因") };
  if (m.status === "done") return { cls: "done", label: "已完成", main: "已完成" };
  if (m.status === "cancelled") return { cls: "cancel", label: "已取消", main: "已取消 · 仅留档" };
  if (m.status === "archived") return { cls: "cancel", label: "已归档", main: "已归档" };
  return { cls: "", label: "待办", main: doer ? ("还没开工 · 在 " + doer + " 手里") : "还没开工,也还没人接" };
}
function statusEdgeHuman(d){
  d = d || {};
  var from = d.from, to = d.to;
  if (to === "in_progress" && from === "open") return "交出去了,开干";
  if (to === "review") return "交回来了";
  if (to === "in_progress" && from === "review") return "打回重做";
  if (to === "in_progress" && from === "blocked") return "解开了,继续";
  if (to === "in_progress" && from === "done") return "拉回重做";
  if (to === "open" && from === "done") return "拉回待办";
  if (to === "done") return "完成,收下了";
  if (to === "blocked") return "卡住了" + (d.reason ? ":" + d.reason : "");
  if (to === "cancelled") return "取消了";
  if (to === "archived") return "归档了";
  return "改到「" + stName(to) + "」";
}
function actHuman(a){
  var d = a.detail || {};
  switch (a.action){
    case "created": return "立了这个事项";
    case "status_changed": return statusEdgeHuman(d);
    case "assignee_added": return "拉了 " + uname(d.user_id || "") + " 进来";
