<script>
"use strict";
/* Octo-Matter v2 工作台 — 单文件生产 UI。
   所有数据来自当前部署前缀下的 /api/v1(docs/v2-api.md);无任何内置假数据。 */

function matterApiBase(){
  var path = (location.pathname || "/").replace(/\/+$/, "");
  var uiIdx = path.lastIndexOf("/ui");
  if (uiIdx >= 0) return (path.slice(0, uiIdx) || "") + "/api/v1";
  if (path === "/matter") return "/matter/api/v1";
  return "/api/v1";
}
var API_BASE = matterApiBase();
/* ?embed=1:宿主(octo-web)自带全局导航,隐藏本应用最左侧图标栏,连接面板不再给登录页链接 */
var EMBED = /(?:^|[?&])embed=1(?:&|$)/.test(location.search.replace(/^\?/, ""));
function $(s, el){ return (el || document).querySelector(s); }
function $$(s, el){ return Array.prototype.slice.call((el || document).querySelectorAll(s)); }
function esc(s){
  return String(s === null || s === undefined ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function pad2(n){ return String(n).padStart(2, "0"); }

/* 安全 Markdown 渲染:先 esc 全文再做行级变换,杜绝 XSS;只支持常用子集
   (标题/加粗/斜体/行内码/围栏码块/无序·有序列表/http 链接/换行)。 */
function mdHTML(src){
  var t = esc(src);
  if (!t) return "";
  t = t.replace(/```([\s\S]*?)```/g, function(_, code){
    return "<pre class=\"md-pre\">" + code.replace(/^\n+|\n+$/g, "") + "</pre>";
  });
  var lines = t.split("\n");
  var out = [], list = null, tbl = null;
  function closeList(){ if (list){ out.push("</" + list + ">"); list = null; } }
  function cells(row){
    return row.replace(/^\s*\|/, "").replace(/\|\s*$/, "").split("|").map(function(x){ return x.trim(); });
  }
  function flushTable(){
    if (!tbl) return;
    if (tbl.length >= 2 && /^[\s|:\-]+$/.test(tbl[1])){
      var html = '<table class="md-table"><tr>' + cells(tbl[0]).map(function(c){ return "<th>" + c + "</th>"; }).join("") + "</tr>";
      tbl.slice(2).forEach(function(r){
        html += "<tr>" + cells(r).map(function(c){ return "<td>" + c + "</td>"; }).join("") + "</tr>";
      });
      out.push(html + "</table>");
    } else {
      tbl.forEach(function(r){ out.push("<div>" + r + "</div>"); });
    }
    tbl = null;
  }
  lines.forEach(function(ln){
    if (/^<pre/.test(ln) || /<\/pre>$/.test(ln)){ closeList(); flushTable(); out.push(ln); return; }
    if (/^\s*\|.*\|\s*$/.test(ln)){ closeList(); (tbl = tbl || []).push(ln
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/`([^`]+)`/g, "<code class=\"md-code\">$1</code>")); return; }
    flushTable();
    var inline = ln
      .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>")
      .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>")
      .replace(/`([^`]+)`/g, "<code class=\"md-code\">$1</code>")
      .replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, "<a href=\"$2\" target=\"_blank\" rel=\"noopener noreferrer\">$1</a>");
    var h = inline.match(/^(#{1,4})\s+(.*)$/);
    if (h){ closeList(); var lv = Math.min(h[1].length + 3, 6); out.push("<h" + lv + " class=\"md-h\">" + h[2] + "</h" + lv + ">"); return; }
    var ul = inline.match(/^\s*[-*]\s+(.*)$/);
    if (ul){ if (list !== "ul"){ closeList(); out.push("<ul class=\"md-list\">"); list = "ul"; } out.push("<li>" + ul[1] + "</li>"); return; }
    var ol = inline.match(/^\s*\d+[.、)]\s+(.*)$/);
    if (ol){ if (list !== "ol"){ closeList(); out.push("<ol class=\"md-list\">"); list = "ol"; } out.push("<li>" + ol[1] + "</li>"); return; }
    closeList();
    if (inline.trim() === ""){ out.push("<div class=\"md-gap\"></div>"); return; }
    out.push("<div>" + inline + "</div>");
  });
  closeList();
  flushTable();
  return '<div class="md">' + out.join("") + "</div>";
}

/* ---------------- auth ---------------- */
var auth = { token: "", uid: "", name: "", space: "" };
function loadAuth(){
  try {
    auth.token = localStorage.getItem("token") || "";
    auth.uid = localStorage.getItem("uid") || "";
    auth.name = localStorage.getItem("name") || "";
    auth.space = localStorage.getItem("currentSpaceId") || "";
  } catch (e) { /* storage 不可用时停留在连接面板 */ }
}
function authReady(){ return !!(auth.token && auth.space); }
var uidResolved = false;
function resolveUid(){
  if (uidResolved || !auth.token || auth.uid) return Promise.resolve();
  uidResolved = true;
  return fetch("/v1/auth/verify", { method: "POST", headers: { "Content-Type": "application/json", token: auth.token }, body: "{}" }).then(function(res){
    if (!res.ok) return;
    return res.json();
  }).then(function(j){
    if (j && j.uid){
      auth.uid = j.uid;
      auth.name = j.name || auth.name || j.uid;
      try { localStorage.setItem("uid", auth.uid); localStorage.setItem("name", auth.name); } catch(e){}
    }
  }).catch(function(){});
}
/* octo-web 只把 token/uid/name 放进 localStorage(跨标签页白名单),
   currentSpaceId 是 WKApp 内存字段、不持久化 —— 所以新标签页只有 token。
   有 token 没空间时,直接问 octo-server 要空间列表(同源 /api/v1),
   取第一个并持久化;失败则停留在连接面板。 */
var spaceDiscovering = false;
function discoverSpace(){
  if (!auth.token || auth.space || spaceDiscovering) return Promise.resolve(false);
  spaceDiscovering = true;
  return fetch("/api/v1/space/my", { headers: { token: auth.token } }).then(function(res){
    if (!res.ok) throw new Error("space/my " + res.status);
    return res.json();
  }).then(function(list){
    if (Array.isArray(list) && list.length && list[0].space_id){
      try { localStorage.setItem("currentSpaceId", list[0].space_id); } catch (e) {}
      auth.space = list[0].space_id;
      rememberSpaceName(list[0].space_id, list[0].name);
      return true;
    }
    return false;
  }).catch(function(){ return false; })
    .finally(function(){ spaceDiscovering = false; });
}
/* 空间名:小白不该看见十六进制 ID。名字缓存在 localStorage,缺了就懒解析一次。 */
function rememberSpaceName(id, name){
  if (id && name){ try { localStorage.setItem("spaceName:" + id, name); } catch (e) {} }
}
function spaceName(){
  if (!auth.space) return "";
  var n = "";
  try { n = localStorage.getItem("spaceName:" + auth.space) || ""; } catch (e) {}
  return n;
}
var spaceNameResolving = false;
function resolveSpaceName(){
  if (!auth.token || !auth.space || spaceName() || spaceNameResolving) return;
  spaceNameResolving = true;
  fetch("/api/v1/space/my", { headers: { token: auth.token } }).then(function(res){
    return res.ok ? res.json() : [];
  }).then(function(list){
    (Array.isArray(list) ? list : []).forEach(function(s){ rememberSpaceName(s.space_id, s.name); });
    if (spaceName()) paintIdentity();
  }).catch(function(){}).finally(function(){ spaceNameResolving = false; });
}
function isMe(uidStr){ return !!auth.uid && uidStr === auth.uid; }

/* ---------------- 空间成员名录(uid → 名字 / 是否机器人) ---------------- */
var members = { space: "", at: 0, map: {}, list: [], inflight: null };
var MEMBERS_TTL = 5 * 60e3; // 5 分钟懒刷新
function loadMembers(force){
  if (!authReady()) return Promise.resolve([]);
  if (members.space !== auth.space){ members = { space: auth.space, at: 0, map: {}, list: [], inflight: null }; }
  if (members.inflight) return members.inflight;
  if (!force && members.list.length && Date.now() - members.at < MEMBERS_TTL) return Promise.resolve(members.list);
  var p = fetch("/api/v1/space/" + encodeURIComponent(auth.space) + "/members?limit=200", {
    headers: { token: auth.token }
  }).then(function(res){
    if (!res.ok) throw new Error("members " + res.status);
    return res.json();
  }).then(function(json){
    var list = listData(json);
    var map = {};
    list.forEach(function(it){
      if (it && it.uid) map[it.uid] = { name: it.name || it.uid, robot: !!it.robot };
    });
    members = { space: auth.space, at: Date.now(), map: map, list: list, inflight: null };
    return list;
  }).catch(function(){
    members.inflight = null;
    members.at = Date.now(); // 拿不到名录就先用 uid 顶着,稍后再试
    return members.list;
  });
  members.inflight = p;
  return p;
}
function memberInfo(uidStr){ return members.map[uidStr] || null; }
function isBot(uidStr){ var mi = memberInfo(uidStr); return !!(mi && mi.robot); }
function aiTagHTML(uidStr){ return isBot(uidStr) ? '<span class="ai-tag">AI</span>' : ""; }
function uname(uidStr){
  if (!uidStr) return "";
  var mi = memberInfo(uidStr);
  if (mi && mi.name) return mi.name;
  if (isMe(uidStr) && auth.name) return auth.name;
  return uidStr;
}
/* bot 归属:成员名录若带 owner 字段就用它;一个都没带说明平台没暴露归属,known=false(不杜撰) */
function ownedBotInfo(){
  var known = false, owned = {};
  members.list.forEach(function(it){
    if (!it || !it.robot || !it.uid) return;
    var o = it.owner_uid || it.creator_uid || it.owner || it.created_by || it.master_uid || "";
    if (o) known = true;
    if (o && o === auth.uid) owned[it.uid] = true;
  });
  return { known: known, owned: owned };
}

/* ---------------- API ---------------- */
function apiError(status, code, message, details){
  var e = new Error(message);
  e.status = status; e.code = code; e.details = details;
  return e;
}
function api(path, opts){
  opts = opts || {};
  var url = new URL(API_BASE + path, location.href);
  if (opts.params){
    Object.keys(opts.params).forEach(function(k){
      var v = opts.params[k];
      if (v !== undefined && v !== null && v !== "") url.searchParams.set(k, v);
    });
  }
  var headers = {};
  if (auth.token) headers["token"] = auth.token;
  if (auth.space) headers["X-Space-Id"] = auth.space;
  var init = { method: opts.method || "GET", headers: headers };
  if (opts.body !== undefined){
    headers["Content-Type"] = "application/json";
    init.body = JSON.stringify(opts.body);
  }
  return fetch(url.toString(), init).catch(function(){
    throw apiError(0, "NETWORK", "连不上事项服务,稍后再试");
  }).then(function(res){
    if (res.status === 204) return null;
    return res.text().then(function(text){
      var json = null;
      if (text){ try { json = JSON.parse(text); } catch (e) { json = null; } }
      if (!res.ok){
        if (res.status === 401) showConnect("登录态失效了 — 重新登录主应用,或手动填一次");
        var ei = (json && json.error) || {};
        throw apiError(res.status, ei.code || ("HTTP_" + res.status),
          ei.message || ("请求失败(" + res.status + ")"), ei.details);
      }
      return json;
    });
  });
}
function listData(json){
  if (!json) return [];
  if (Array.isArray(json)) return json;
  if (Array.isArray(json.data)) return json.data;
  if (Array.isArray(json.items)) return json.items;
  return [];
}
function pageInfo(json){ return (json && json.pagination) || {}; }

/* ---------------- toast ---------------- */
var toastTimer = null;
function toast(msg, opts){
  opts = opts || {};
  var t = $("#toast");
  t.className = "toast show" + (opts.err ? " err" : "");
  t.innerHTML = (opts.err ? '<span class="ti">!</span>' : (opts.icon ? '<span class="ti">' + esc(opts.icon) + "</span>" : ""))
    + '<span class="toast-msg">' + esc(msg) + "</span>"
    + (opts.err ? '<span class="toast-x" id="toastX" role="button">×</span>' : "");
  if (opts.title) t.setAttribute("title", opts.title); else t.removeAttribute("title");
  var x = $("#toastX");
  if (x) x.onclick = function(){ t.classList.remove("show"); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ t.classList.remove("show"); }, opts.err ? 8000 : (opts.ms || 2200));
}
/* 错误码翻译成人话(P3:别把 VERSION_CONFLICT 这种内部词甩给用户)。
   没收录的码回退到服务端 message(已是中文),绝不露原始码。 */
var ERR_HUMAN = {
  VERSION_CONFLICT: "这单刚被改过 — 刷新看看最新状态再操作",
  EPOCH_STALE: "这活已经改派了,不用再做了",
  CHILDREN_NOT_TERMINAL: "还有子任务没收口 — 先把它们确认完成",
  FORBIDDEN: "这一步不归你做(权限不够)",
  MATTER_NOT_FOUND: "这单找不到了,可能已被删除",
  LLM_NOT_CONFIGURED: "智能提炼还没接入(缺模型钥匙),其他功能不受影响",
  UPSTREAM_ERROR: "后台服务暂时没应答,稍等再试",
  AUTH_UNAVAILABLE: "登录服务暂时连不上,稍等再试"
};
function errToast(e){
  var human = e && e.code && ERR_HUMAN[e.code];
  toast(human || (e && e.message) || "出错了,稍后再试", { err: true });
}

/* 来源名兜底:历史单子可能把裸频道 id(32 位 hex)或 uuid 当名字存了
   (创建侧解析修复之前的存量)。给用户看哈希违反易用性宪法 —— 长得像
   id 就退回「来源会话」。新单子已在服务端解析真名,这里只兜底。 */
function srcLabel(name){
  if (!name) return "";
  var s = String(name).trim();
  if (/^[0-9a-f]{32}$/i.test(s) || /^[0-9a-f-]{36}$/i.test(s)) return "来源会话";
  return s;
}
/* 偏好规则预览:草案体例首行就是规则,旧数据可能是「P-NNN 标题: rule…」,
   抽出标题/规则那行给人看一眼,
   而不是只显示 "scope.preference" 文件名(人看不出虾到底学了啥)。 */
function prefRulePreview(content){
  if (!content) return "";
  var lines = String(content).split("\n").map(function(s){ return s.trim(); }).filter(Boolean);
  if (!lines.length) return "";
  // 去掉 bullet、旧 P-* 前缀和可选 rule: 前缀,让Preference展示真正的规则。
  var first = lines[0].replace(/^\s*[-•*]\s*/, "").trim();
  first = first.replace(/^P-(?:new|\d+)\s*\[?[a-z]*\]?\s*/i, "").trim();
  first = first.replace(/^rule\s*:\s*/i, "").trim();
  if (first.length > 60) first = first.slice(0, 58) + "…";
  return first;
}
/* ---------------- format ---------------- */
function fmtTime(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  var now = new Date();
  var diff = now.getTime() - t.getTime();
  if (diff >= 0 && diff < 60e3) return "刚刚";
  if (diff >= 0 && diff < 3600e3) return Math.floor(diff / 60e3) + " 分钟前";
  var hm = pad2(t.getHours()) + ":" + pad2(t.getMinutes());
  if (t.toDateString() === now.toDateString()) return hm;
  var y = t.getFullYear() === now.getFullYear() ? "" : (t.getFullYear() + "-");
  return y + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate()) + " " + hm;
}
function fmtFull(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  return t.getFullYear() + "-" + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate()) + " " + pad2(t.getHours()) + ":" + pad2(t.getMinutes());
}
function fmtDate(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  return t.getFullYear() + "-" + pad2(t.getMonth() + 1) + "-" + pad2(t.getDate());
}
function fmtShortDate(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  var now = new Date();
  if (t.toDateString() === now.toDateString()) return "今天";
  var y = new Date(now); y.setDate(now.getDate() - 1);
  if (t.toDateString() === y.toDateString()) return "昨天";
  var days = Math.floor((now - t) / 864e5);
  if (days > 1 && days < 7) return days + " 天前";
  var md = (t.getMonth() + 1) + "月" + t.getDate() + "日";
  return t.getFullYear() === now.getFullYear() ? md : t.getFullYear() + "年" + md;
}
function fmtYM(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  return t.getFullYear() + "-" + pad2(t.getMonth() + 1);
}
function fmtSize(n){
  n = +n;
  if (!n || isNaN(n)) return "";
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  return (n / 1048576).toFixed(1) + " MB";
}
function firstLine(s){
  s = String(s || "");
  var i = s.indexOf("\n");

  if (h === "projects" || h === "automation" || h === "cards") return { view: h };

  if (h.indexOf("mailbox/") === 0) return { view: "mailbox", source: h.slice(8) || "matters" };
  if (h === "matters") return { view: "mymatters", tab: "all", mode: "list" };
  if (h === "matters/board") return { view: "mymatters", tab: "all", mode: "board" };
  if (h === "matters/created") return { view: "mymatters", tab: "created", mode: "list" };
  if (h === "matters/created/board") return { view: "mymatters", tab: "created", mode: "board" };
  if (h === "matters/participating") return { view: "mymatters", tab: "participating", mode: "list" };
  if (h === "matters/participating/board") return { view: "mymatters", tab: "participating", mode: "board" };
  if (h === "matters/assigned") { location.hash = "#/matters/participating"; return { view: "mymatters", tab: "participating", mode: "list" }; }
  if (h === "matters/assigned/board") { location.hash = "#/matters/participating/board"; return { view: "mymatters", tab: "participating", mode: "board" }; }
  if (h === "matters/agents") { location.hash = "#/matters/participating"; return { view: "mymatters", tab: "participating", mode: "list" }; }
  if (h === "matters/agents/board") { location.hash = "#/matters/participating/board"; return { view: "mymatters", tab: "participating", mode: "board" }; }
  if (h === "mine") { location.hash = "#/matters/participating"; return { view: "mymatters", tab: "participating", mode: "list" }; }
  if (h === "initiated") { location.hash = "#/matters/created"; return { view: "mymatters", tab: "created", mode: "list" }; }
  if (h === "review-me" || h === "archived") { location.hash = "#/matters"; return { view: "mymatters", tab: "all", mode: "list" }; }

function fmtRelative(d){
  if (!d) return "";
  var ms = Date.now() - new Date(d).getTime();
  if (ms < 0) ms = 0;
  var s = ms / 1000;
  if (s < 60) return "刚刚";
  var m = s / 60;
  if (m < 60) return Math.floor(m) + "分钟前";
  var h = m / 60;
  if (h < 24) return Math.floor(h) + "小时前";
  var dy = h / 24;
  if (dy < 2) return "昨天";
  if (dy < 30) return Math.floor(dy) + "天前";
  return fmtShortDate(d);
}

function sortMyMattersRows(rows){
  var r = rows.slice();
  var dir = myMattersOrderDir === "asc" ? 1 : -1;
  if (myMattersOrdering === "title") return r.sort(function(a, b){
    return dir * String(a.title || "").localeCompare(String(b.title || ""), "zh-Hans-CN");
  });
  if (myMattersOrdering === "seq") return r.sort(function(a, b){
    return dir * (Number(a.seq_no || 0) - Number(b.seq_no || 0));
  });
  if (myMattersOrdering === "priority") return r.sort(function(a, b){
    var d = priorityRank(a) - priorityRank(b);
    if (d) return dir * d;
    return new Date(b.created_at || 0).getTime() - new Date(a.created_at || 0).getTime();
  });
  if (myMattersOrdering === "deadline") return r.sort(function(a, b){
    var av = a.deadline ? new Date(a.deadline).getTime() : NaN;
    var bv = b.deadline ? new Date(b.deadline).getTime() : NaN;
    var aNil = !isFinite(av), bNil = !isFinite(bv);
    if (aNil && bNil) return 0;

function updateMyMatterPriority(id, next, my){

  var i = myMattersState.rows.findIndex(function(r){ return r.id === id; });
  if (i < 0) return;
  var prev = priorityValue(myMattersState.rows[i]);
  if (prev === next) return;
  myMattersState.rows[i].priority = next;
  paintMyMatters(my);
  api("/matters/" + id, { method: "PUT", body: { priority: next } }).then(function(detail){
    if (my !== renderToken || !myMattersState) return;
    var updated = normMatter(detail);
    var idx = myMattersState.rows.findIndex(function(r){ return r.id === id; });
    if (idx >= 0 && updated && updated.id) myMattersState.rows[idx] = updated;
    paintMyMatters(my);
  }).catch(function(e){
    if (my !== renderToken) return;
    if (myMattersState){
      var idx = myMattersState.rows.findIndex(function(r){ return r.id === id; });

function manualSortValue(row, index, rows){
  if (row.sort_order != null) return Number(row.sort_order);
  var real = rows.map(function(r){ return r.sort_order == null ? null : Number(r.sort_order); }).filter(function(v){ return isFinite(v); });
  var asc = myMattersOrderDir !== "desc";
  if (asc){
    var max = real.length ? Math.max.apply(Math, real) : 0;
    return max + (index + 1) * 1000;
  }
  var min = real.length ? Math.min.apply(Math, real) : 0;
  return min - (index + 1) * 1000;
}
function myManualGroupRows(status, excludeId){
  var rows = myMattersFilteredRows().filter(function(m){ return m.status === status && m.id !== excludeId; });
  return rows.map(function(m, i){
    return { matter: m, order: manualSortValue(m, i, rows) };
  });
}
function calcMyManualSortOrder(status, id, insertIndex){
  var rows = myManualGroupRows(status, id);
  var before = insertIndex > 0 && rows[insertIndex - 1] ? rows[insertIndex - 1].order : null;
  var after = insertIndex < rows.length && rows[insertIndex] ? rows[insertIndex].order : null;
  var desc = myMattersOrderDir === "desc";
  if (!desc){
    if (before == null && after == null) return 1000;
    if (before == null) return after - 1000;
    if (after == null) return before + 1000;
    return (before + after) / 2;
  }
  if (before == null && after == null) return 1000;
  if (before == null) return after + 1000;
  if (after == null) return before - 1000;
  return (before + after) / 2;
}
function commitMyManualSort(id, status, insertIndex, my){
  if (!myMattersState || myMattersOrdering !== "manual") return;
  var row = myMattersState.rows.find(function(m){ return m.id === id; });
  if (!row || row.status !== status) return;
  var prev = row.sort_order;
  var next = calcMyManualSortOrder(status, id, insertIndex);
  if (!isFinite(next)) return;
  row.sort_order = next;
  paintMyMatters(my);
  api("/matters/" + id, { method: "PUT", body: { sort_order: next } }).then(function(detail){
    if (my !== renderToken || !myMattersState) return;
    replaceMyMatterRow(normMatter(detail));
    paintMyMatters(my);
  }).catch(function(e){
    if (my !== renderToken || !myMattersState) return;
    var r = myMattersState.rows.find(function(m){ return m.id === id; });
    if (r) r.sort_order = prev;
    paintMyMatters(my);
    errToast(e);
  });
}
function myDropIndex(container, y, selector){
  var rows = $$(selector + ":not(.dragging)", container);
  var best = { idx: rows.length, y: Infinity };
  rows.forEach(function(el, i){
    var r = el.getBoundingClientRect();
    var mid = r.top + r.height / 2;
    if (Math.abs(y - mid) < Math.abs(y - best.y)) best = { idx: y < mid ? i : i + 1, y: mid };
  });
  return best.idx;
}
function showMyDropLine(container, idx, selector){
  $$(".my-drop-line").forEach(function(l){ l.remove(); });
  var rows = $$(selector + ":not(.dragging)", container);
  var line = document.createElement("div");
  line.className = "my-drop-line";
  if (idx < rows.length) container.insertBefore(line, rows[idx]); else container.appendChild(line);
}
function bindMyManualSorting(my){
  if (myMattersOrdering !== "manual") return;
  var drag = { id: "", status: "" };
  function startDrag(el, status){
    drag.id = el.getAttribute("data-id") || "";
    drag.status = status || el.getAttribute("data-status") || "";
    el.classList.add("dragging");
  }
  function endDrag(el){
    el.classList.remove("dragging");
    drag = { id: "", status: "" };
    $$(".my-drop-line").forEach(function(l){ l.remove(); });
    $$(".drop-over").forEach(function(c){ c.classList.remove("drop-over"); });
  }
  $$(".mrow[draggable='true'][data-id]").forEach(function(el){
    el.addEventListener("dragstart", function(e){
      startDrag(el, el.getAttribute("data-status"));
      e.dataTransfer.setData("text/plain", drag.id);
      e.dataTransfer.effectAllowed = "move";
    });
    el.addEventListener("dragend", function(){ endDrag(el); });
  });
  $$("[data-mm-list-status]").forEach(function(list){
    list.addEventListener("dragover", function(e){
      if (!drag.id || drag.status !== list.getAttribute("data-mm-list-status")) return;
      e.preventDefault();
      showMyDropLine(list, myDropIndex(list, e.clientY, ".mrow[data-id]"), ".mrow[data-id]");
    });
    list.addEventListener("drop", function(e){
      if (!drag.id) return;
      e.preventDefault();
      var status = list.getAttribute("data-mm-list-status");
      if (drag.status !== status) return;
      var idx = myDropIndex(list, e.clientY, ".mrow[data-id]");
      $$(".my-drop-line").forEach(function(l){ l.remove(); });
      commitMyManualSort(drag.id, status, idx, my);
    });
  });
  $$(".my-board-shell .bcard[draggable='true'][data-id]").forEach(function(el){
    el.addEventListener("dragstart", function(e){
      var col = el.closest(".board-col");
      startDrag(el, col ? col.getAttribute("data-status") : "");
      e.dataTransfer.setData("text/plain", drag.id);
      e.dataTransfer.effectAllowed = "move";
    });
    el.addEventListener("dragend", function(){ endDrag(el); });
  });
  $$(".my-board-shell .board-col").forEach(function(col){
    var cards = $(".board-cards", col);
    if (!cards) return;
    col.addEventListener("dragover", function(e){
      if (!drag.id || drag.status !== col.getAttribute("data-status")) return;
      e.preventDefault();
      col.classList.add("drop-over");
      showMyDropLine(cards, myDropIndex(cards, e.clientY, ".bcard[data-id]"), ".bcard[data-id]");
    });
    col.addEventListener("dragleave", function(e){
      if (col.contains(e.relatedTarget)) return;
      col.classList.remove("drop-over");
      $$(".my-drop-line", col).forEach(function(l){ l.remove(); });
    });
    col.addEventListener("drop", function(e){
      if (!drag.id) return;
      e.preventDefault();
      col.classList.remove("drop-over");
      var status = col.getAttribute("data-status");
      if (drag.status !== status) return;
      var idx = myDropIndex(cards, e.clientY, ".bcard[data-id]");
      $$(".my-drop-line").forEach(function(l){ l.remove(); });
      commitMyManualSort(drag.id, status, idx, my);
    });
  });
}

function tlMonthsBetween(start, end){
  var months = [];
  var d = new Date(start.getFullYear(), start.getMonth(), 1);
  while (d <= end){
    months.push(new Date(d));
    d.setMonth(d.getMonth() + 1);
  }
  return months;
}
function tlWeeksBetween(start, end){
  var weeks = [];
  var d = new Date(start);
  d.setDate(d.getDate() - d.getDay() + 1);
  while (d <= end){
    weeks.push(new Date(d));
    var next = new Date(d);
    next.setDate(next.getDate() + 7);
    d = next;
  }
  return weeks;
}

  } else {
    months.forEach(function(mo){
      var daysInMonth = new Date(mo.getFullYear(), mo.getMonth() + 1, 0).getDate();
      var w = daysInMonth * dayW;
      var isCur = nowY === mo.getFullYear() && nowM === mo.getMonth();
      var label = mo.getFullYear() + '年' + (mo.getMonth() + 1) + '月';
      if (months.length > 8) label = (mo.getMonth() + 1) + '月';
      moRowHTML += '<div class="tl-mo' + (isCur ? ' current' : '') + '" style="width:' + w + 'px">' + label + '</div>';
    });
    var allWeeks = tlWeeksBetween(rangeStart, rangeEnd);
    allWeeks.forEach(function(w){
      var px = dayPos(w);
      var d = w.getDate();
      var isToday = w.getFullYear() === nowY && w.getMonth() === nowM && d === nowD;
      dayRowHTML += '<span class="tl-day' + (isToday ? ' today' : '') + '" style="left:' + (px + 3.5 * dayW) + 'px">' + d + '</span>';

  }

  var todayPx = dayPos(now);

    : '';

  $(".tl-left").innerHTML = leftHTML;
  $(".tl-chart").innerHTML = '<div class="tl-chart-inner" style="width:' + totalW + 'px">'
    + '<div class="tl-time-head"><div class="tl-head-months">' + moRowHTML + '</div>'
    + '<div class="tl-head-days" style="width:' + totalW + 'px">' + dayRowHTML + '</div></div>'

  $$(".tl-bar, .tl-dot-marker", $(".tl-chart")).forEach(function(el){

      if (e.clientY < rect.top + rect.height / 2) row.parentNode.insertBefore(line, row);

      var targetIdx = others.indexOf(row);
      var dropIdx = above ? targetIdx : targetIdx + 1;

      });
      var dm = tlAll.find(function(x){ return x.id === dragId; });

    });

      if (!m) return;
      tlDragged = true;
      bar.classList.add("dragging");
      bar.style.transition = "none";
      var tip = document.createElement("div");
      tip.className = "tl-drag-tip";
      document.body.appendChild(tip);
      var chartRect = chartEl.getBoundingClientRect();
      var origW = bar.offsetWidth;

      function posToDate(clientX){
        var px = clientX - chartRect.left + chartEl.scrollLeft;
        var days = Math.round(px / dayW);
        var d = new Date(rangeStart.getTime() + days * 864e5);
        d.setHours(18, 0, 0, 0);
        return d;
      }
      function fmtTip(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }

      function onMove(ev){
        var newEnd = posToDate(ev.clientX);
        var sDate = m.created_at ? new Date(m.created_at) : new Date();
        if (newEnd <= sDate) newEnd = new Date(sDate.getTime() + 864e5);
        var newW = Math.max(dayW, dayPos(newEnd) - parseInt(bar.style.left));
        bar.style.width = newW + "px";
        tip.textContent = fmtTip(newEnd);
        tip.style.left = (ev.clientX + 12) + "px";
        tip.style.top = (ev.clientY - 28) + "px";
      }
      function onUp(ev){
        document.removeEventListener("mousemove", onMove);
        document.removeEventListener("mouseup", onUp);
        bar.classList.remove("dragging");
        bar.style.transition = "";
        if (tip.parentNode) tip.parentNode.removeChild(tip);
        setTimeout(function(){ tlDragged = false; }, 50);
        var newEnd = posToDate(ev.clientX);
        var sDate = m.created_at ? new Date(m.created_at) : new Date();
        if (newEnd <= sDate) newEnd = new Date(sDate.getTime() + 864e5);
        var iso = newEnd.toISOString();
        api("/matters/" + id, { method: "PUT", body: { deadline: iso } }).then(function(){
          m.deadline = iso;
          toast("截止日期 → " + fmtTip(newEnd));
          if (my === renderToken) paintTimeline(my);
        }).catch(function(err){
          toast("更新失败: " + (err.message || ""), { err: true });
        });
      }
      document.addEventListener("mousemove", onMove);
      document.addEventListener("mouseup", onUp);
    });
  });
}

  }
  if (c.updated_at){
    var days = Math.floor((Date.now() - new Date(c.updated_at).getTime()) / 864e5);
    if (days === 0) parts.push("今天更新");
    else if (days === 1) parts.push("昨天更新");
    else if (days > 1) parts.push("最近 " + days + " 天前");
  }
  return parts.join(" · ");
}
function cardScopeGroup(c){
  var s = c.scope || "matter";
  if (s === "global" || s === "space") return 0; // 普适标准
  if (s === "project") return 1;
  if (s === "bot") return 2;
  return 3; // matter-specific
}
function cardScopeGroupLabel(group){
  return ["普适标准", "项目级", "Bot 级", "事项级"][group] || "其他";
}
function paintCards(my){
  var cards = cardsCache || [];
  if (!cards.length){
    $(".content-inner").innerHTML = '<div class="list-head"><div class="list-head-actions"></div></div>'
      + '<div class="inbox-toolbar"><div style="margin:0"><input class="list-search" id="cardSearch" type="search" placeholder="搜索偏好（全文检索）" style="max-width:400px" aria-label="搜索偏好"></div></div>'
      + '<div class="pref-list"><div class="empty-state"><div class="es-t">还没有 Preference</div><div class="es-s">完成 Matter 后,从验收反馈中自动提炼行为规则</div></div></div>';
    paintCardsBindSearch(my);
    return;
  }
  // Group cards by scope
  var grouped = {};
  cards.forEach(function(c){
    var g = cardScopeGroup(c);
    if (!grouped[g]) grouped[g] = [];
    grouped[g].push(c);
  });
  // Sub-group project cards by project_id
  var html = '';
  [0, 1, 2, 3].forEach(function(g){
    var group = grouped[g];
    if (!group || !group.length) return;
    html += '<div class="pref-group">'
      + '<div class="pref-group-label" style="font-size:11px;font-weight:700;color:var(--text-4);letter-spacing:.3px;padding:10px 0 6px;border-bottom:1px solid var(--hairline-soft);margin-bottom:2px">'
      + esc(cardScopeGroupLabel(g)) + ' <span style="font-weight:500;color:var(--text-5)">' + group.length + '</span></div>';
    if (g === 1){
      // Sub-group by project
      var byProj = {};
      group.forEach(function(c){
        var pk = c.project_id || "_none";
        if (!byProj[pk]) byProj[pk] = [];
        byProj[pk].push(c);
      });
      Object.keys(byProj).forEach(function(pk){
        var pName = pk !== "_none" ? (projName(pk) || "未命名项目") : "";
        if (pName) html += '<div style="font-size:10.5px;color:var(--text-4);padding:6px 0 2px;font-weight:600">' + esc(pName) + '</div>';
        byProj[pk].forEach(function(c){ html += paintCardRow(c); });
      });
    } else {
      group.forEach(function(c){ html += paintCardRow(c); });
    }
    html += '</div>';
  });

  $(".content-inner").innerHTML = '<div class="list-head"><div class="list-head-actions"></div></div>'
    + '<div class="inbox-toolbar"><div style="margin:0"><input class="list-search" id="cardSearch" type="search" placeholder="搜索偏好（全文检索）" style="max-width:400px" aria-label="搜索偏好"></div></div>'
    + '<div class="pref-list">' + html + '</div>';

  // Bind click handlers for expand/collapse + actions
  var list = $(".pref-list");
  if (list) list.addEventListener("click", function(e){
    var authBtn = e.target.closest("[data-auth]");
    if (authBtn){
      e.stopPropagation();
      api("/preference-cards/" + authBtn.getAttribute("data-auth"), { method: "PUT", body: { status: "authorized" } }).then(function(){
        toast("已确认"); renderCards(my);
      }).catch(function(er){ errToast(er); });
      return;
    }
    var discardBtn = e.target.closest("[data-discard]");
    if (discardBtn){
      e.stopPropagation();
      api("/preference-cards/" + discardBtn.getAttribute("data-discard"), { method: "PUT", body: { status: "discarded" } }).then(function(){
        toast("已弃用"); renderCards(my);
      }).catch(function(er){ errToast(er); });
      return;
    }
    var suspendBtn = e.target.closest("[data-suspend]");
    if (suspendBtn){
      e.stopPropagation();
      api("/preference-cards/" + suspendBtn.getAttribute("data-suspend"), { method: "PUT", body: { status: "discarded" } }).then(function(){
        toast("已停用"); renderCards(my);
      }).catch(function(er){ errToast(er); });
      return;
    }
    var editBtn = e.target.closest("[data-edit-card]");
    if (editBtn){
      e.stopPropagation();
      var ec = cardsCache.find(function(x){ return x.id === editBtn.getAttribute("data-edit-card"); });
      if (ec) openEditCardModal(my, ec);
      return;
    }
    // Toggle expand
    var row = e.target.closest(".pref-row[data-card-id]");
    if (row){
      var detail = row.querySelector(".pref-expand");
      if (detail){
        var isOpen = detail.style.display !== "none";
        detail.style.display = isOpen ? "none" : "block";
        return;
      }
      // Build expand content on first click
      var c = cardsCache.find(function(x){ return x.id === row.getAttribute("data-card-id"); });
      if (c){
        var expandHTML = '<div class="pref-expand" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--hairline-soft)">'
          + '<div style="font-size:13px;color:var(--text);white-space:pre-wrap;line-height:1.6;margin-bottom:8px">' + esc(c.content) + '</div>'
          + (c.evidence ? '<div style="font-size:12px;color:var(--text-3);background:var(--fill-1);border-left:3px solid var(--accent-border);border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:6px;line-height:1.5">' + esc(c.evidence) + '</div>' : '')
          + (c.avoid ? '<div style="font-size:12px;color:var(--amber);background:rgba(255,190,0,.06);border-left:3px solid var(--amber);border-radius:0 6px 6px 0;padding:8px 10px;margin-bottom:6px;line-height:1.5">不适用: ' + esc(c.avoid) + '</div>' : '')
          + '<div style="margin-top:6px"><button class="pref-act pref-edit-btn" data-edit-card="' + esc(c.id) + '" onclick="event.stopPropagation()" style="font-size:12px">编辑</button></div>'
          + '</div>';
        row.querySelector(".pref-main").insertAdjacentHTML("beforeend", expandHTML);
      }
    }
  });
  paintCardsBindSearch(my);
}
function paintCardRow(c){
  var statusCls = CARD_STATUS_CLS[c.status] || "gray";

  var srcInfo = cardSourceInfo(c);
  var matterId = c.matter_id;
  var srcLink = matterId ? '<a href="#/matter/' + esc(matterId) + '" class="pref-src" onclick="event.stopPropagation()">来源</a>' : '';

    actions = '<button class="pref-act" data-auth="' + esc(c.id) + '" title="确认">确认</button>'
      + '<button class="pref-act pref-act-warn" data-discard="' + esc(c.id) + '" title="弃用">弃用</button>';
  } else if (c.status === "authorized" || c.status === "hit"){
    actions = '<button class="pref-act pref-act-warn" data-suspend="' + esc(c.id) + '" title="停用">停用</button>';
  }
  return '<div class="pref-row" data-card-id="' + esc(c.id) + '" role="button" tabindex="0">'
    + '<div class="pref-main">'
    + '<div class="pref-rule">' + esc(firstLine) + '</div>'
    + '<div class="pref-source-info" style="font-size:11.5px;color:var(--text-4);margin-top:2px">' + esc(srcInfo) + '</div>'
    + '</div>'
    + '<div class="pref-meta">'
    + '<span class="pill ' + statusCls + '"><span class="dot"></span>' + esc(CARD_STATUS_LABEL[c.status] || c.status) + '</span>'

    + '</div>'
    + '<div class="pref-actions">' + actions + '</div>'

}
function paintCardsBindSearch(my){
  var cs = $("#cardSearch");
  if (cs){
    var searchTimer = 0;
    cs.addEventListener("input", function(){
      clearTimeout(searchTimer);
      var q = cs.value.trim();
      if (!q){ cardsCache = null; renderCards(my); return; }
      searchTimer = setTimeout(function(){
        api("/preference-cards/search", { params: { q: q } }).then(function(json){
          if (my !== renderToken) return;
          cardsCache = (json && json.data) || [];
          paintCards(my);
          var cs2 = $("#cardSearch"); if (cs2){ cs2.value = q; cs2.focus(); }

    });

}

function projCount(id){
  var c = cache.projCounts[id];
  if (c && Date.now() - c.at < 60e3) return Promise.resolve(c);
  return api("/matters", { params: { project_id: id, limit: 100 } }).then(function(json){
    var v = { at: Date.now(), n: listData(json).length, more: !!pageInfo(json).has_more };
    cache.projCounts[id] = v;
    return v;
  });
}
function fillProjCounts(root){
  $$("[data-count-for]", root).forEach(function(el){
    projCount(el.getAttribute("data-count-for")).then(function(c){
      el.textContent = (c.more ? "99+" : c.n) + " 个事项";
      el.style.visibility = "visible";
    }).catch(function(){ el.textContent = ""; });
  });
}

        var before = idx > 0 ? colCards[idx - 1].sort_order : null;
        var after = idx < colCards.length ? colCards[idx].sort_order : null;
        var newOrder;
        if (before == null && after == null) newOrder = 1000;
        else if (before == null) newOrder = after - 1000;

        var m = rows.find(function(x){ return x.id === id; });

          askReason().then(function(reason){

    if (pvp){
      var pds = { active: false, startX: 0, scrollLeft: 0, velX: 0, lastX: 0, lastT: 0, rafId: 0 };
      pvp.addEventListener("mousedown", function(e){
        if (e.target.closest(".bcard, .bc-add, button, a, [draggable]")) return;
        pds.active = true; pds.startX = e.clientX; pds.scrollLeft = pvp.scrollLeft;
        pds.velX = 0; pds.lastX = e.clientX; pds.lastT = Date.now();

      });
      document.addEventListener("mousemove", function(e){
        if (!pds.active) return;
        pvp.scrollLeft = pds.scrollLeft - (e.clientX - pds.startX);
        var now = Date.now(), dt = Math.max(1, now - pds.lastT);

      });
      document.addEventListener("mouseup", function(){
        if (!pds.active) return;

      }, { passive: false });

/* ================= AUTOMATION ================= */
var WDCN = ["日", "一", "二", "三", "四", "五", "六"];
function cronHuman(expr){
  var r = parseCronSimple(expr);
  if (!r) return "";
  var t = pad2(r.hh) + ":" + pad2(r.mm);
  if (r.kind === "daily") return "每天 " + t;
  if (r.kind === "weekdays") return "每个工作日 " + t;
  if (r.kind === "weekly") return "每周" + WDCN[r.dow] + " " + t;
  if (r.kind === "monthly") return "每月 " + r.dom + " 号 " + t;
  return "";
}
/* 只认四种简单形状:每天 / 工作日 / 每周X / 每月X号;其余进「高级」原样保留 */
function parseCronSimple(expr){
  var p = String(expr || "").trim().split(/\s+/);
  if (p.length !== 5) return null;
  var mi = p[0], h = p[1], dom = p[2], mon = p[3], dow = p[4];
  if (!/^\d{1,2}$/.test(mi) || !/^\d{1,2}$/.test(h)) return null;
  var mm = +mi, hh = +h;
  if (mm > 59 || hh > 23 || mon !== "*") return null;
  if (dom === "*" && dow === "*") return { kind: "daily", hh: hh, mm: mm };
  if (dom === "*" && dow === "1-5") return { kind: "weekdays", hh: hh, mm: mm };
  if (dom === "*" && /^[0-7]$/.test(dow)) return { kind: "weekly", dow: (+dow) % 7, hh: hh, mm: mm };
  if (dow === "*" && /^\d{1,2}$/.test(dom) && +dom >= 1 && +dom <= 31) return { kind: "monthly", dom: +dom, hh: hh, mm: mm };
  return null;
}
function buildCron(rep, hh, mm){
  if (rep.kind === "weekdays") return mm + " " + hh + " * * 1-5";
  if (rep.kind === "weekly") return mm + " " + hh + " * * " + rep.dow;
  if (rep.kind === "monthly") return mm + " " + hh + " " + rep.dom + " * *";
  return mm + " " + hh + " * * *";
}
function repLabel(rep){
  if (rep.kind === "weekdays") return "每个工作日";
  if (rep.kind === "weekly") return "每周" + WDCN[rep.dow];
  if (rep.kind === "monthly") return "每月 " + rep.dom + " 号";
  return "每天";
}
function nextRunPreview(rep, hh, mm){
  var now = new Date();
  var t = new Date(now.getFullYear(), now.getMonth(), now.getDate(), hh, mm, 0, 0);
  var ok = function(dt){
    if (rep.kind === "weekdays") return dt.getDay() >= 1 && dt.getDay() <= 5;
    if (rep.kind === "weekly") return dt.getDay() === rep.dow;
    if (rep.kind === "monthly") return dt.getDate() === rep.dom;
    return true;
  };
  for (var i = 0; i < 380; i++){
    if (t.getTime() > now.getTime() && ok(t)) return t;
    t = new Date(t.getFullYear(), t.getMonth(), t.getDate() + 1, hh, mm, 0, 0);
  }
  return null;
}
function fmtNextRun(t){
  if (!t) return "";
  var now = new Date();
  var hm = pad2(t.getHours()) + ":" + pad2(t.getMinutes());
  var d0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  var dd = Math.round((new Date(t.getFullYear(), t.getMonth(), t.getDate()) - d0) / 86400e3);
  if (dd === 0) return "今天 " + hm;
  if (dd === 1) return "明天 " + hm;
  if (dd < 7) return "周" + WDCN[t.getDay()] + " " + hm;
  return (t.getMonth() + 1) + "/" + pad2(t.getDate()) + " " + hm;
}
function fmtFuture(iso){
  if (!iso) return "";
  var t = new Date(iso);
  if (isNaN(t.getTime())) return "";
  return t.getTime() > Date.now() ? fmtNextRun(t) : fmtTime(iso);
}

function openRepeatMenu(anchor, d, onDone){
  var top = [
    { v: "daily", t: "每天" },
    { v: "weekdays", t: "每个工作日" },
    { v: "weekly", t: "每周(选星期几)" },
    { v: "monthly", t: "每月(选几号)" }
  ];
  var html = top.map(function(o){
    var sel = d.rep.kind === o.v;
    return '<div class="fm-item' + (sel ? " sel" : "") + '" data-val="' + o.v + '"><span class="nm">' + o.t + '</span><span class="fm-check">' + (sel ? "✓" : "") + "</span></div>";
  }).join("");
  openFloatMenu(anchor, html, { onPick: function(v){
    if (v === "daily" || v === "weekdays"){ d.rep.kind = v; onDone(); return; }
    if (v === "weekly"){
      setTimeout(function(){
        var wd = WDCN.map(function(w, i){
          var sel = d.rep.kind === "weekly" && d.rep.dow === i;
          return '<div class="fm-item' + (sel ? " sel" : "") + '" data-val="' + i + '"><span class="nm">每周' + w + '</span><span class="fm-check">' + (sel ? "✓" : "") + "</span></div>";
        }).join("");
        openFloatMenu(anchor, wd, { onPick: function(v2){ d.rep.kind = "weekly"; d.rep.dow = +v2; onDone(); } });
      }, 0);
      return;
    }
    if (v === "monthly"){
      setTimeout(function(){
        var days = "";
        for (var i = 1; i <= 31; i++){
          var sel = d.rep.kind === "monthly" && d.rep.dom === i;
          days += '<div class="fm-item' + (sel ? " sel" : "") + '" data-val="' + i + '"><span class="nm">' + i + ' 号</span><span class="fm-check">' + (sel ? "✓" : "") + "</span></div>";
        }
        openFloatMenu(anchor, days, { onPick: function(v2){ d.rep.kind = "monthly"; d.rep.dom = +v2; onDone(); },
          afterOpen: function(fm){ var selEl = $(".fm-item.sel", fm); if (selEl) selEl.scrollIntoView({ block: "center" }); } });
      }, 0);
      return;
    }
  } });
}
function openTimeMenu(anchor, current, onPick){
  var html = "";
  for (var h = 0; h < 24; h++){
    for (var q = 0; q < 4; q++){
      var t = pad2(h) + ":" + pad2(q * 15);
      var sel = t === current;
      html += '<div class="fm-item' + (sel ? " sel" : "") + '" data-val="' + t + '"><span class="nm" style="font-family:var(--mono)">' + t + '</span><span class="fm-check">' + (sel ? "✓" : "") + "</span></div>";
    }
  }
  openFloatMenu(anchor, html, { onPick: function(v){ onPick(v); },
    afterOpen: function(fm){
      var selEl = $(".fm-item.sel", fm);
      if (selEl) selEl.scrollIntoView({ block: "center" });
    } });
}

var cur = null; // { id, m, tree, timeline, acts, parent }
function settle(p){
  return p.then(function(v){ return { ok: true, v: v }; }, function(e){ return { ok: false, e: e }; });
}
function renderMatter(my, id){
  setNav(null);
  setCrumbText("…");
  $("#centerCol").innerHTML = '<div class="content"><div class="content-inner">' + skelRows(1, 34) + skelRows(4, 90) + "</div></div>";
  $("#props").innerHTML = '<div class="panel"><div class="panel-body" style="padding-top:14px">' + skelRows(4, 36) + "</div></div>";
  showInspector();
  return Promise.all([
    api("/matters/" + id),
    settle(api("/matters/" + id + "/tree")),
    settle(api("/matters/" + id + "/timeline", { params: { limit: 100 } })),
    settle(api("/matters/" + id + "/activities", { params: { limit: 100 } })),
    getProjects().catch(function(){ return []; }),
    loadMembers().catch(function(){ return []; })
  ]).then(function(res){
    if (my !== renderToken) return;
    var m = normMatter(res[0]);
    if (!m || !m.id){
      $("#centerCol").innerHTML = errorState(apiError(404, "NOT_FOUND", "没找到这个事项"));
      bindRetry($("#centerCol"));
      hideInspector();
      return;
    }
    cur = { id: id, m: m, tree: res[1], timeline: res[2], acts: res[3], edges: { ok: false, loading: true }, prefHints: { ok: false, loading: true }, parent: null, summary: null };
    paintMatter(my);
    if (m.parent_matter_id){
      api("/matters/" + m.parent_matter_id).then(function(p){
        if (my !== renderToken || !cur || cur.id !== id) return;
        cur.parent = normMatter(p);
        var pl = $("#parentLinkBox");
        if (pl) pl.innerHTML = parentLinkHTML();
        bindParentLink();
      }).catch(function(){ /* 父单读不到就只留编号链接 */ });
    }
    loadDetailContextLater(my, id, m);
  });
}
function loadDetailContextLater(my, id, m){
  setTimeout(function(){
    if (my !== renderToken || !cur || cur.id !== id) return;
    settle(api("/matters/" + id + "/context")).then(function(res){
      if (my !== renderToken || !cur || cur.id !== id) return;
      if (!res.ok){
        cur.edges = { ok: false, e: res.e };
        cur.prefHints = { ok: false, e: res.e };
        paintInspector();
        return;
      }
      var ctx = res.v || {};
      cur.edges = contextPartSettled(ctx.edges);
      cur.prefHints = contextPartSettled(ctx.preference_hints);
      if (ctx.summary && ctx.summary.ok && ctx.summary.data){
        cur.summary = summaryRow(ctx.summary.data);
      }
      paintInspector();
    });
  }, 400);
}
function contextPartSettled(part){
  if (part && part.ok) return { ok: true, v: part.data };
  var code = part && part.error && part.error.code || "ERROR";
  return { ok: false, e: apiError(200, code, code) };
}

/* 连线:渲染后量取节点位置画贝塞尔;resize 重画(纯呈现) */
function pgNodePos(el, gr, sl, stp){
  var r = el.getBoundingClientRect();
  if (!r.width || !r.height) return null;
  return { l: r.left - gr.left + sl, r: r.right - gr.left + sl, cy: r.top - gr.top + stp + r.height / 2 };
}
function drawEdgesFor(g){
  var svg = $(".pg-edges", g);
  if (!svg) return false;
  var gr = g.getBoundingClientRect();
  if (!gr.width || !gr.height){ svg.innerHTML = ""; return false; }
  var w = Math.max(g.scrollWidth, gr.width), h = Math.max(g.scrollHeight, gr.height);
  svg.setAttribute("viewBox", "0 0 " + w + " " + h);
  svg.setAttribute("width", w);
  svg.setAttribute("height", h);
  svg.style.width = w + "px";
  svg.style.height = h + "px";
  var sl = g.scrollLeft, stp = g.scrollTop;
  var paths = "";
  var ready = true;
  $$(".pg-node[data-deps]", g).forEach(function(node){
    var deps = (node.getAttribute("data-deps") || "").split(",").filter(Boolean);
    var np = pgNodePos(node, gr, sl, stp);
    if (!np){ ready = false; return; }
    deps.forEach(function(did){
      var sel = (window.CSS && CSS.escape) ? CSS.escape(did) : did.replace(/"/g, "");
      var dn = $('.pg-node[data-pgid="' + sel + '"]', g);
      if (!dn){ ready = false; return; }
      var dp = pgNodePos(dn, gr, sl, stp);
      if (!dp){ ready = false; return; }
      var dx = Math.max(20, (np.l - dp.r) * 0.45);
      paths += '<path d="M ' + dp.r + " " + dp.cy + " C " + (dp.r + dx) + " " + dp.cy + ", " + (np.l - dx) + " " + np.cy + ", " + np.l + " " + np.cy + '" fill="none" stroke="#9ca2af" stroke-width="1.5"/>';
    });
  });
  svg.innerHTML = paths;
  return ready;
}
function drawPlanEdges(){
  $$(".plan-graph").forEach(function(g){
    drawEdgesFor(g);
    if (!g._pgObs && window.ResizeObserver){
      g._pgObs = new ResizeObserver(function(){ schedulePlanEdges(); });
      g._pgObs.observe(g);
      var cols = $(".pg-cols", g);
      if (cols) g._pgObs.observe(cols);
    }
  });
}
function schedulePlanEdges(){
  requestAnimationFrame(function(){ requestAnimationFrame(drawPlanEdges); });
  [60, 180, 360, 720].forEach(function(ms){ setTimeout(drawPlanEdges, ms); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawPlanEdges).catch(function(){});
}

/* ---- openInlineReply: shared entry-level reply box ----
 * opts.snippet    - pre-fill quote text (from text selection / annotation)
 * opts.prefill    - pre-fill textarea content
 * opts.isFeedback - also POST /feedback (triggers doorbell + status flip)
 * opts.placeholder - custom placeholder text
 */
function openInlineReply(eid, opts){
  opts = opts || {};
  if (!cur) return;
  var drop = document.querySelector('[data-entry-drop="' + eid + '"]');
  if (drop) drop.classList.remove("open");
  var entries = listData(cur.timeline.v);
  var parent = null;
  for (var i = 0; i < entries.length; i++) { if (entries[i].id === eid) { parent = entries[i]; break; } }
  // remove any existing inline reply inputs
  $$(".tl-reply-input", $("#repliesBlock")).forEach(function(el){ el.remove(); });
  var reportEl = document.querySelector('[data-report-id="' + eid + '"]');
  if (!reportEl) return;
  var insertAfter = reportEl;
  // build quote: use snippet if provided, otherwise first line of parent content
  var quoteText = "";
  var quoteAuthor = "";
  if (opts.snippet) {
    quoteText = opts.snippet.length > 80 ? opts.snippet.substring(0, 80) + "..." : opts.snippet;
    quoteAuthor = parent ? uname(parent.user_id) : "";
  } else if (parent && parent.content) {
    quoteText = parent.content.split("\n")[0];
    if (quoteText.length > 60) quoteText = quoteText.substring(0, 60) + "...";
    quoteAuthor = uname(parent.user_id);
  }
  var replyBox = document.createElement("div");
  replyBox.className = "tl-reply-input";
  replyBox.innerHTML = (quoteText ? '<div class="tl-reply-quote">' + esc(quoteAuthor ? quoteAuthor + ": " : "") + esc(quoteText) + '</div>' : '')
    + '<div class="tl-reply-row">'
    + '<textarea class="tl-reply-ta" rows="1" placeholder="' + esc(opts.placeholder || "回复...") + '"></textarea>'
    + '<button class="tl-reply-send" type="button">发送</button>'
    + '<button class="tl-reply-cancel" type="button">取消</button>'
    + '</div>';
  insertAfter.parentNode.insertBefore(replyBox, insertAfter.nextSibling);
  var rta = replyBox.querySelector(".tl-reply-ta");
  if (opts.prefill) {
    rta.value = opts.prefill;
    rta.style.height = "auto"; rta.style.height = Math.min(rta.scrollHeight, 100) + "px";
  }
  rta.focus();
  if (opts.prefill) { try { rta.setSelectionRange(rta.value.length, rta.value.length); } catch(e){} }
  rta.addEventListener("input", function(){ rta.style.height = "auto"; rta.style.height = Math.min(rta.scrollHeight, 100) + "px"; });
  rta.addEventListener("keydown", function(e){ if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); doSend(); } });
  replyBox.querySelector(".tl-reply-cancel").addEventListener("click", function(){ replyBox.remove(); });
  replyBox.querySelector(".tl-reply-send").addEventListener("click", doSend);
  // scroll into view
  setTimeout(function(){ replyBox.scrollIntoView({ block: "nearest", behavior: "smooth" }); }, 60);
  var snippet = opts.snippet || "";
  var isFeedback = !!opts.isFeedback;
  function doSend(){
    var text = rta.value.trim();
    if (!text) { toast("写点什么再发"); rta.focus(); return; }
    var sendBtn = replyBox.querySelector(".tl-reply-send");
    sendBtn.disabled = true; sendBtn.textContent = "发送中...";
    var matterId = cur.id;
    // For annotation/feedback replies, prepend snippet context into timeline content
    var tlContent = text;
    if (isFeedback && snippet) {
      tlContent = "批注: \"" + snippet.slice(0, 60) + (snippet.length > 60 ? "..." : "") + "\"\n\n" + text;
    }
    var timelinePosted = replyBox.__timelinePosted;
    var chain = timelinePosted
      ? Promise.resolve()
      : api("/matters/" + matterId + "/timeline", { method: "POST", body: { content: tlContent, parent_entry_id: eid } }).then(function(){ replyBox.__timelinePosted = true; });
    if (isFeedback) {
      var fbBody = { content: text, anchor: { snippet: snippet } };
      fbBody.entry_id = eid;
      chain = chain.then(function(){
        return api("/matters/" + matterId + "/feedback", { method: "POST", body: fbBody });
      });
    }
    chain.then(function(resp){
      replyBox.remove();
      var flipped = isFeedback && resp && resp.matter_status === "in_progress";
      var sc = $("#detailScroll");
      var scrollPos = sc ? sc.scrollTop : 0;
      return api("/matters/" + matterId + "/timeline", { params: { limit: 100 } }).then(function(json){
        if (!cur || cur.id !== matterId) return;
        cur.timeline = { ok: true, v: json };
        var blockEl = $("#repliesBlock");
        if (blockEl) blockEl.outerHTML = timelineBlockHTML(cur.m);
        bindEntryActions();
        if (sc) sc.scrollTop = scrollPos;
        toast(flipped ? "已批注 -- 已退回修改" : isFeedback ? "已批注" : "已回复");
      });
    }).catch(function(e){
      errToast(e);
      sendBtn.disabled = false;
      sendBtn.textContent = "发送";
    });
  }
}

/* ---- simple inline markdown renderer (no external deps) ---- */
function renderSimpleMarkdown(src){
  var lines = src.split("\n");
  var html = [];
  var inCode = false, codeBuf = [];
  for (var i = 0; i < lines.length; i++){
    var ln = lines[i];
    if (/^```/.test(ln)){
      if (inCode){ html.push('<pre><code>' + esc(codeBuf.join("\n")) + '</code></pre>'); codeBuf = []; }
      inCode = !inCode;
      continue;
    }
    if (inCode){ codeBuf.push(ln); continue; }
    if (/^#{1,3}\s/.test(ln)){
      var lvl = ln.match(/^(#+)/)[1].length;
      html.push('<h' + lvl + '>' + mdInline(ln.replace(/^#+\s*/, '')) + '</h' + lvl + '>');
    } else if (/^[-*]\s/.test(ln)){
      var items = [ln.replace(/^[-*]\s*/, '')];
      while (i + 1 < lines.length && /^[-*]\s/.test(lines[i + 1])){ i++; items.push(lines[i].replace(/^[-*]\s*/, '')); }
      html.push('<ul>' + items.map(function(t){ return '<li>' + mdInline(t) + '</li>'; }).join('') + '</ul>');
    } else if (ln.trim() === ''){
      html.push('');
    } else {
      html.push('<p>' + mdInline(ln) + '</p>');
    }
  }
  if (inCode && codeBuf.length){ html.push('<pre><code>' + esc(codeBuf.join("\n")) + '</code></pre>'); }
  return html.join("\n");
}
function isSafeHref(href){
  if (!href) return false;
  var lower = href.trim().toLowerCase();
  return lower.startsWith("http://") || lower.startsWith("https://") || lower.startsWith("/") || lower.startsWith("./");
}
function mdInline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g, '<em>$1</em>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, function(_, text, href){
    return isSafeHref(href)
      ? '<a href="' + href + '" target="_blank" rel="noopener">' + text + '</a>'
      : text;
  });
  return s;
}

function doStatusChange(target, opts){

      toast("改到「" + stName(target) + "」了");

        render(); // 刷掉经过/推进记录,偏好沉淀入档

      }
      if (evidenceFeedbacks.length){
        pending++;
        api("/matters/" + matterId + "/feedback", { params: { limit: 50 } }).then(function(json){
          var all = (json && json.data) || [];
          evidenceFeedbacks.forEach(function(fid){
            var fb = all.find(function(f){ return f.id === fid; });
            if (fb && fb.content) parts.push(fb.content);
          });
          if (!--pending) loadDone();
        }).catch(function(){ if (!--pending) loadDone(); });
      }
    }
  }

    openFloatMenu(box, html, {
      sticky: !opts.single,
      onPick: function(v, el){

          state.sel = [v];

          return false;
        }
        var i = state.sel.indexOf(v);
        if (i >= 0) state.sel.splice(i, 1); else state.sel.push(v);
        el.classList.toggle("sel", i < 0);
        var ck = $(".fm-check", el);
        if (ck) ck.textContent = i < 0 ? "✓" : "";
        paint();
        if (opts.onChange) opts.onChange();
        return true; // 多选保持打开
      }
    });
  });
  return { paint: paint };
}

/* ================= 截止日期选择器(日历 + 15 分钟刻度) ================= */
var dlState = null; // { anchor, view {y,m}, sel {y,m,d}|null, time, onChange }
function closeDlPop(){
  var pop = $("#dlPop");
  if (!pop || !pop.classList.contains("show")) return;
  pop.classList.remove("show");
  dlState = null;
}
function openDlPop(anchor, init, onChange){
  var now = new Date();
  dlState = {
    anchor: anchor,
    view: init.sel ? { y: init.sel.y, m: init.sel.m } : { y: now.getFullYear(), m: now.getMonth() },
    sel: init.sel ? { y: init.sel.y, m: init.sel.m, d: init.sel.d } : null,
    time: init.time || "19:00",
    onChange: onChange
  };
  paintDlPop();
}
function paintDlPop(){
  if (!dlState) return;
  var pop = $("#dlPop");
  var v = dlState.view;
  var now = new Date();
  var start = new Date(v.y, v.m, 1).getDay();
  var head = WDCN.map(function(w){ return '<span class="cal-wd">' + w + "</span>"; }).join("");
  var cells = "";
  for (var i = 0; i < 42; i++){
    var dt = new Date(v.y, v.m, 1 - start + i);
    var dim = dt.getMonth() !== v.m;
    var today = dt.getFullYear() === now.getFullYear() && dt.getMonth() === now.getMonth() && dt.getDate() === now.getDate();
    var sel = dlState.sel && dt.getFullYear() === dlState.sel.y && dt.getMonth() === dlState.sel.m && dt.getDate() === dlState.sel.d;
    cells += '<button type="button" class="cal-day' + (dim ? " dim" : "") + (today ? " today" : "") + (sel ? " sel" : "")
      + '" data-day="' + dt.getFullYear() + "," + dt.getMonth() + "," + dt.getDate() + '">' + dt.getDate() + "</button>";
  }
  var times = "";
  for (var h = 0; h < 24; h++){
    for (var q = 0; q < 4; q++){
      var t = pad2(h) + ":" + pad2(q * 15);
      times += '<button type="button" class="dl-time-opt' + (t === dlState.time ? " sel" : "") + '" data-time="' + t + '">' + t + "</button>";
    }
  }
  pop.innerHTML = '<div class="cal">'
    + '<div class="cal-head"><button class="cal-nav" type="button" data-cal-nav="-1" aria-label="上个月">‹</button>'
    + '<span class="cal-title">' + v.y + "年" + (v.m + 1) + "月</span>"
    + '<button class="cal-nav" type="button" data-cal-nav="1" aria-label="下个月">›</button></div>'
    + '<div class="cal-grid">' + head + cells + "</div></div>"
    + '<div class="dl-times">' + times + "</div>";
  pop.classList.add("show");
  placePop(pop, dlState.anchor.getBoundingClientRect());
  var selTime = $(".dl-time-opt.sel", pop);
  if (selTime) selTime.scrollIntoView({ block: "center" });
  $$("[data-cal-nav]", pop).forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      if (!dlState) return;
      var m2 = dlState.view.m + (+b.getAttribute("data-cal-nav"));
      dlState.view = { y: dlState.view.y + Math.floor(m2 / 12), m: ((m2 % 12) + 12) % 12 };
      paintDlPop();
    });
  });
  var emit = function(){
    if (!dlState) return;
    var cb = dlState.onChange;
    var out = { sel: dlState.sel, time: dlState.time };
    closeDlPop();
    if (cb) cb(out);
  };
  $$("[data-day]", pop).forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      if (!dlState) return;
      var p = b.getAttribute("data-day").split(",");
      dlState.sel = { y: +p[0], m: +p[1], d: +p[2] };
      emit(); // 时间有默认值,点完日期直接生效;要改时间再点开
    });
  });
  $$("[data-time]", pop).forEach(function(b){
    b.addEventListener("click", function(e){
      e.stopPropagation();
      if (!dlState) return;
      dlState.time = b.getAttribute("data-time");
      if (dlState.sel) emit();
      else paintDlPop(); // 还没选日期:记下时间,等选日期
    });
  });
}

/* 升段(06 §11):从真实验收数派生,不存储 — 战绩即真相 */
var RANKS = [
  { at: 0, name: "新虾" }, { at: 5, name: "出徒" }, { at: 20, name: "熟手" },
  { at: 50, name: "老手" }, { at: 100, name: "宗师" }
];
function rankHTML(done){
  var cur = RANKS[0], next = null;
  for (var i = 0; i < RANKS.length; i++){
    if (done >= RANKS[i].at) cur = RANKS[i]; else { next = RANKS[i]; break; }
  }
  if (!next){
    return '<div class="ac-rank"><span class="rk">' + cur.name + '</span><div class="ac-rank-bar"><i style="width:100%"></i></div><span class="rk-next">已到顶</span></div>';
  }
  var span = next.at - cur.at;
  var pct = Math.max(4, Math.round(((done - cur.at) / span) * 100));
  return '<div class="ac-rank"><span class="rk">' + cur.name + '</span>'
    + '<div class="ac-rank-bar"><i style="width:' + pct + '%"></i></div>'
    + '<span class="rk-next">再 ' + (next.at - done) + ' 件升「' + next.name + '」</span></div>';
}

function formatCapabilitiesInput(caps){
  caps = caps || [];
  return caps.length ? JSON.stringify(caps, null, 2) : "";
}

function normalizeCapStatus(x){
  x = String(x || "").toLowerCase();
  if (x === "ready" || x === "claimed" || x === "needs_setup" || x === "disabled" || x === "unknown") return x;
  return "claimed";
}

function capStatusLabel(status){
  status = normalizeCapStatus(status);
  return ({ ready: "可用", claimed: "", needs_setup: "待配置", disabled: "停用", unknown: "" })[status] || "";
}

function capSourceLabel(source){
  source = String(source || "").toLowerCase();
  if (source === "openclaw") return "OpenClaw";
  if (source === "custom") return "自定义";
  return "";
}

function capabilitySummaryHTML(caps){
  caps = caps || [];
  var openclaw = caps.filter(function(c){ return String(c.source || "").toLowerCase() === "openclaw"; }).length;
  var owner = caps.filter(function(c){ return c.visibility === "owner"; }).length;
  return '<div class="ac-cap-summary">'
    + '<div class="acs"><div class="v">' + caps.length + '</div><div class="k">发布能力</div></div>'
    + '<div class="acs"><div class="v">' + openclaw + '</div><div class="k">OpenClaw</div></div>'
    + '<div class="acs"><div class="v">' + owner + '</div><div class="k">仅 creator</div></div>'
    + "</div>";
}

function capFromSkillObject(x){
  var ready = !!(x && x.eligible && x.modelVisible && x.commandVisible);
  var cap = {
    name: String((x && (x.name || x.skillKey || x.key)) || "").trim(),
    description: String((x && x.description) || "").trim(),
    source: "openclaw",
    status: ready ? "ready" : normalizeCapStatus(x && x.status),
    homepage: String((x && x.homepage) || "").trim(),
    visibility: "space"
  };
  cap.visibility = defaultCapabilityVisibility(cap);
  return cap;
}

function isSensitiveOpenClawCapability(c){
  if (String(c && c.source || "").toLowerCase() !== "openclaw") return false;
  var text = String((c && c.name) || "") + " " + String((c && c.description) || "") + " " + String((c && c.homepage) || "");
  text = text.toLowerCase();
  return ["1password","password","secret","credential","token","keychain",
    "mail","email","gmail","calendar","contact","browser",
    "filesystem","file-system","file system","shell","terminal","ssh",
    "lark","feishu","drive","sheet","doc","notes","reminder"].some(function(k){
      return text.indexOf(k) >= 0;
    });
}

function defaultCapabilityVisibility(c){
  return isSensitiveOpenClawCapability(c) ? "owner" : "space";
}

function extractCapabilitiesJSONText(raw){
  raw = String(raw || "").trim();
  if (!raw) return raw;
  var objStart = raw.indexOf("{");
  var objEnd = raw.lastIndexOf("}");
  if (objStart >= 0 && objEnd > objStart) return raw.slice(objStart, objEnd + 1);
  var arrStart = raw.indexOf("[");
  var arrEnd = raw.lastIndexOf("]");
  if (arrStart >= 0 && arrEnd > arrStart) return raw.slice(arrStart, arrEnd + 1);
  return raw;
}

function parseCapabilitiesInput(raw, manualSkills){
  raw = String(raw || "").trim();
  var caps = [];
  if (raw){
    try {
      var parsed;
      try { parsed = JSON.parse(raw); }
      catch (e) { parsed = JSON.parse(extractCapabilitiesJSONText(raw)); }
      var arr = Array.isArray(parsed) ? parsed : (parsed.skills || parsed.capabilities || parsed.data || []);
      if (!Array.isArray(arr)) throw new Error("能力 JSON 需要是数组,或包含 skills/capabilities 数组");
      var fromOpenClawList = !Array.isArray(parsed) && Array.isArray(parsed.skills);
      caps = arr.map(function(x){
        if (typeof x === "string") return { name: x.trim(), source: "custom", status: "claimed", visibility: "space" };
        return capFromSkillObject(x);
      }).filter(function(x){
        if (!x.name) return false;
        if (!fromOpenClawList) return true;
        return x.status === "ready";
      });
    } catch (e) {
      caps = raw.split(/\n+/).map(function(line){
        return { name: line.trim(), source: "custom", status: "claimed", visibility: "space" };
      }).filter(function(x){ return !!x.name; });
    }
  }
  (manualSkills || []).forEach(function(name){
    if (!caps.some(function(c){ return String(c.name).toLowerCase() === String(name).toLowerCase(); })){
      caps.push({ name: name, source: "custom", status: "claimed", visibility: "space" });
    }
  });
  return caps.slice(0, 60);
}

function capabilityHTML(c){
  var status = normalizeCapStatus(c.status);
  var source = String(c.source || "").toLowerCase();
  var badgeCls = status === "ready" ? "ready" : (status === "needs_setup" ? "warn" : "");
  var badges = "";
  var statusLabel = capStatusLabel(status);
  if (statusLabel) badges += '<span class="ac-cap-badge ' + badgeCls + '">' + esc(statusLabel) + "</span>";
  if (c.visibility === "owner") badges += '<span class="ac-cap-badge owner">仅 creator</span>';
  var sourceLabel = capSourceLabel(source);
  if (sourceLabel) badges += '<span class="ac-cap-badge">' + esc(sourceLabel) + "</span>";
  return '<div class="ac-cap">'
    + '<div class="ac-cap-name" title="' + esc(c.name || "") + '">' + esc(c.name || "") + "</div>"
    + '<div class="ac-cap-meta">' + badges + "</div>"
    + (c.description ? '<div class="ac-cap-desc">' + esc(c.description) + "</div>" : "")
    + "</div>";
}

function capabilityGroupsHTML(caps, limit){
  caps = caps || [];
  limit = limit || 12;
  var total = caps.length;
  var shown = sortCapabilitiesForDisplay(caps).slice(0, limit);
  var groups = [
    {
      label: "OpenClaw Skills",
      total: caps.filter(function(c){ return String(c.source || "").toLowerCase() === "openclaw"; }).length,
      items: shown.filter(function(c){ return String(c.source || "").toLowerCase() === "openclaw"; })
    },
    {
      label: "自定义能力",
      total: caps.filter(function(c){ return String(c.source || "").toLowerCase() !== "openclaw"; }).length,
      items: shown.filter(function(c){ return String(c.source || "").toLowerCase() !== "openclaw"; })
    }
  ].filter(function(g){ return g.items.length; });
  return '<div class="ac-cap-list grouped">' + groups.map(function(g){
    return '<div class="ac-cap-group">'
      + '<div class="ac-cap-group-title"><span>' + esc(g.label) + '</span><span>' + g.items.length + (g.total > g.items.length ? " / " + g.total : "") + "</span></div>"
      + g.items.map(capabilityHTML).join("")
      + "</div>";
  }).join("")
    + (total > shown.length ? '<div class="ac-cap-more">还有 ' + (total - shown.length) + ' 条能力未显示,编辑名片可查看完整列表。</div>' : "")
    + "</div>";
}

function sortCapabilitiesForDisplay(caps){
  return (caps || []).map(function(c, idx){ return { c: c, idx: idx }; }).sort(function(a, b){
    var ar = capDisplayRank(a.c);
    var br = capDisplayRank(b.c);
    if (ar !== br) return ar - br;
    var an = String(a.c && a.c.name || "").toLowerCase();
    var bn = String(b.c && b.c.name || "").toLowerCase();
    if (an < bn) return -1;
    if (an > bn) return 1;
    return a.idx - b.idx;
  }).map(function(x){ return x.c; });
}

function capDisplayRank(c){
  var status = normalizeCapStatus(c && c.status);
  if (status === "ready") return 0;
  if (status === "claimed") return 1;
  if (status === "needs_setup") return 2;
  if (status === "unknown") return 3;
  if (status === "disabled") return 4;
  return 5;
}

function capEditorOption(value, label, current){
  return '<option value="' + esc(value) + '"' + (value === current ? " selected" : "") + ">" + esc(label) + "</option>";
}

function capEditorStatusValue(status){
  var s = normalizeCapStatus(status);
  return s === "unknown" ? "claimed" : s;
}

function capEditorSourceValue(source){
  source = String(source || "").toLowerCase();
  return source.indexOf("openclaw") === 0 ? "openclaw" : "custom";
}

function declaredCapabilitiesForEditor(d){
  var caps = (d.capabilities || []).filter(function(c){ return c && c.name; }).map(function(c){
    return {
      name: c.name || "",
      description: c.description || "",
      source: capEditorSourceValue(c.source),
      status: capEditorStatusValue(c.status),
      visibility: c.visibility === "owner" ? "owner" : "space"
    };
  });
  if (!caps.length){
    caps = (d.skills || []).filter(Boolean).map(function(name){
      return { name: name, description: "", source: "custom", status: "claimed", visibility: "space" };
    });
  }
  return caps;
}

function capEditorSearchText(c){
  return [
    c && c.name,
    c && c.description,
    capSourceLabel(capEditorSourceValue(c && c.source)),
    capStatusLabel(capEditorStatusValue(c && c.status)),
    (c && c.visibility) === "owner" ? "仅 creator" : "空间可见"
  ].join(" ").toLowerCase();
}

function capabilityEditorRowHTML(c, idx){
  var source = capEditorSourceValue(c.source);
  var status = capEditorStatusValue(c.status);
  var visibility = c.visibility === "owner" ? "owner" : "space";
  var locked = isSensitiveOpenClawCapability({ name: c.name, description: c.description, source: source });
  if (locked) visibility = "owner";
  return '<div class="cap-editor-row' + (locked ? " locked-sensitive" : "") + '" data-cap-row="' + idx + '" data-cap-search="' + esc(capEditorSearchText(c)) + '">'
    + '<div class="cap-editor-grid">'
    + '<input class="ce-cap-name" maxlength="80" placeholder="能力名称" value="' + esc(c.name || "") + '">'
    + '<select class="ce-cap-source">'
    + capEditorOption("custom", "自定义", source)
    + capEditorOption("openclaw", "OpenClaw", source)
    + "</select>"
    + '<select class="ce-cap-status">'
    + capEditorOption("claimed", "已发布", status)
    + capEditorOption("ready", "可用", status)
    + capEditorOption("needs_setup", "待配置", status)
    + capEditorOption("disabled", "停用", status)
    + "</select>"
    + '<select class="ce-cap-visibility"' + (locked ? ' disabled title="敏感 OpenClaw 能力只能由 creator 查看"' : "") + '>'
    + capEditorOption("space", "空间可见", visibility)
    + capEditorOption("owner", "仅 creator", visibility)
    + "</select>"
    + '<button class="cap-editor-remove" type="button" data-cap-remove="' + idx + '" title="移除能力">×</button>'
    + '<input class="ce-cap-desc cap-editor-desc" maxlength="400" placeholder="补充说明,可留空" value="' + esc(c.description || "") + '">'
    + '<div class="cap-editor-lock-hint" aria-hidden="' + (locked ? "false" : "true") + '">敏感 OpenClaw 能力仅 creator 可见,不会公开给空间协作者。</div>'
    + "</div></div>";
}

function editorRowCapability(row){
  return {
    name: ($(".ce-cap-name", row)?.value || "").trim(),
    source: $(".ce-cap-source", row)?.value || "custom",
    description: ($(".ce-cap-desc", row)?.value || "").trim()
  };
}

function applyCapabilityVisibilityLocks(){
  $$(".cap-editor-row").forEach(function(row){
    var vis = $(".ce-cap-visibility", row);
    if (!vis) return;
    var locked = isSensitiveOpenClawCapability(editorRowCapability(row));
    row.classList.toggle("locked-sensitive", locked);
    vis.disabled = locked;
    vis.title = locked ? "敏感 OpenClaw 能力只能由 creator 查看" : "";
    if (locked) vis.value = "owner";
    var hint = $(".cap-editor-lock-hint", row);
    if (hint) hint.setAttribute("aria-hidden", locked ? "false" : "true");
  });
}

function readCapabilityEditorRows(){
  return $$(".cap-editor-row").map(function(row){
    var name = ($(".ce-cap-name", row)?.value || "").trim();
    if (!name) return null;
    var desc = ($(".ce-cap-desc", row)?.value || "").trim();
    var cap = {
      name: name,
      source: $(".ce-cap-source", row)?.value || "custom",
      status: $(".ce-cap-status", row)?.value || "claimed",
      visibility: $(".ce-cap-visibility", row)?.value || "space"
    };
    if (desc) cap.description = desc;
    if (isSensitiveOpenClawCapability(cap)) cap.visibility = "owner";
    return cap;
  }).filter(Boolean);
}

function renderCapabilityEditorRows(caps){
  var box = $("#ceCapRows");
  if (!box) return;
  caps = (caps || []).filter(Boolean);
  if (!caps.length){
    box.innerHTML = '<div class="ac-empty">还没有能力。添加一条,或从 OpenClaw JSON 导入。</div>';
    var zero = $("#ceCapCount");
    if (zero) zero.textContent = "0 条";
    return;
  }
  box.innerHTML = caps.map(capabilityEditorRowHTML).join("")
    + '<div class="ac-empty" id="ceCapNoMatch" style="display:none">没有匹配的能力</div>';
  applyCapabilityVisibilityLocks();
  $$(".ce-cap-name,.ce-cap-source,.ce-cap-desc", box).forEach(function(el){
    el.addEventListener("input", applyCapabilityVisibilityLocks);
    el.addEventListener("change", applyCapabilityVisibilityLocks);
  });
  $$("[data-cap-remove]", box).forEach(function(btn){
    btn.addEventListener("click", function(){
      var idx = Number(btn.getAttribute("data-cap-remove") || "0");
      var rows = readCapabilityEditorRows();
      rows.splice(idx, 1);
      renderCapabilityEditorRows(rows);
    });
  });
  applyCapabilityEditorFilter();
}

function applyCapabilityEditorFilter(){
  var input = $("#ceCapSearch");
  var q = input ? input.value.trim().toLowerCase() : "";
  var rows = $$(".cap-editor-row");
  var shown = 0;
  rows.forEach(function(row){
    var hit = !q || (row.getAttribute("data-cap-search") || "").indexOf(q) >= 0;
    row.style.display = hit ? "" : "none";
    if (hit) shown++;
  });
  var count = $("#ceCapCount");
  if (count) count.textContent = q ? (shown + "/" + rows.length + " 条") : (rows.length + " 条");
  var empty = $("#ceCapNoMatch");
  if (empty) empty.style.display = shown || !rows.length ? "none" : "";
}

function clearCapabilityEditorFilter(){
  var input = $("#ceCapSearch");
  if (input) input.value = "";
}

function mergeCapabilityEditorRows(base, incoming){
  var out = [];
  var seen = {};
  (base || []).concat(incoming || []).forEach(function(c){
    if (!c || !c.name) return;
    var key = String(c.name).toLowerCase();
    if (seen[key]) return;
    seen[key] = true;
    out.push({
      name: c.name,
      description: c.description || "",
      source: capEditorSourceValue(c.source),
      status: capEditorStatusValue(c.status),
      visibility: c.visibility === "owner" ? "owner" : "space"
    });
  });
  return out.slice(0, 60);
}

function placePop(pop, r){

  var h = pop.offsetHeight || 160;
  var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 8));
  var top = r.bottom + 6;

  pop.style.left = left + "px";
  pop.style.top = top + "px";
}

var annotSel = null;
var annotSnap = null;
var annotFabRaf = 0;
function positionAnnotFab(){
  var fab = $("#annotFab");
  // If an inline reply is already open, don't reposition fab
  if ($$(".tl-reply-input", $("#repliesBlock")).length) return;
  var sel = window.getSelection();
  var txt = sel ? String(sel).trim() : "";
  if (!sel || sel.rangeCount === 0 || sel.isCollapsed || txt.length < 2){
    fab.classList.remove("show"); annotSel = null; return;
  }
  var an = sel.anchorNode, fn = sel.focusNode;
  var ae = an && (an.nodeType === 1 ? an : an.parentElement);
  var fe = fn && (fn.nodeType === 1 ? fn : fn.parentElement);
  var card = ae && ae.closest ? ae.closest(".report-body[data-entry-id]") : null;
  if (!card || !fe || !card.contains(fe)){
    fab.classList.remove("show"); annotSel = null; return;
  }
  var r = sel.getRangeAt(0).getBoundingClientRect();
  if (!r || (!r.width && !r.height)){ fab.classList.remove("show"); annotSel = null; return; }
  annotSel = { snippet: txt.slice(0, 200), entryId: card.getAttribute("data-entry-id") };
  fab.style.left = Math.max(8, Math.min(r.left + r.width / 2 - 40, window.innerWidth - 110)) + "px";
  fab.style.top = (r.top - 40 < 54 ? r.bottom + 8 : r.top - 40) + "px";
  fab.classList.add("show");
}

function hideConnect(){ $("#connectScrim").classList.remove("show"); }
function bindConnect(){
  ["ccToken", "ccSpace"].forEach(function(id){
    document.getElementById(id).addEventListener("keydown", function(e){
      if (e.key === "Enter"){ e.preventDefault(); $("#ccSave").click(); }
    });
  });
  $("#ccSave").addEventListener("click", function(){
    var t = $("#ccToken").value.trim();
    var s = $("#ccSpace").value.trim();
    if (!t){ $("#ccErr").textContent = "token 得填(空间 ID 可留空,自动取你的第一个空间)"; return; }
    try {
      localStorage.setItem("token", t);
      if (s) localStorage.setItem("currentSpaceId", s);
    } catch (e) { $("#ccErr").textContent = "浏览器存储不可用"; return; }
    loadAuth();
    if (!auth.space){
      $("#ccErr").textContent = "正在向 Octo 查询你的空间…";
      discoverSpace().then(function(found){
        if (found){ paintIdentity(); hideConnect(); toast("连上了"); render(); }
        else { $("#ccErr").textContent = "查不到空间:token 可能不对,或你不在任何空间里"; }
      });
      return;
    }
    paintIdentity();
    hideConnect();
    toast("连上了");
    render();
  });
  window.addEventListener("storage", function(e){
    if (["token", "uid", "name", "currentSpaceId"].indexOf(e.key) >= 0){
      loadAuth();
      paintIdentity();
      if (authReady()){ hideConnect(); render(); }
    }
  });
}
